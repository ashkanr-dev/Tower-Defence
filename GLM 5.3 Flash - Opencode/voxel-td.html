<script type="module">
import * as THREE from 'three';

/* ================= utils ================= */
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const choice=arr=>arr[(Math.random()*arr.length)|0];
const d2=(ax,az,bx,bz)=>{const x=ax-bx,z=az-bz;return x*x+z*z;};
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const dampAngle=(a,b,l,dt)=>a+angDiff(a,b)*Math.min(1,l*dt);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function n2(x,z){ // cheap value noise
  const s=Math.sin(x*127.1+z*311.7)*43758.5453; return s-Math.floor(s);
}
function vn(x,z){ // smooth-ish bilinear noise 0..1
  const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const a=n2(xi,zi),b=n2(xi+1,zi),c=n2(xi,zi+1),d2_=n2(xi+1,zi+1);
  const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  return lerp(lerp(a,b,u),lerp(c,d2_,u),v);
}
function vary(c,a=0.07){const col=new THREE.Color(c);const f=1+rand(-a,a);
  col.r=clamp(col.r*f,0,1);col.g=clamp(col.g*f,0,1);col.b=clamp(col.b*f,0,1);return col;}

/* ============ voxel merge helpers ============ */
function mergeParts(parts){ // parts:{w,h,d,x,y,z,c,rx?,ry?,rz?}
  const pos=[],nor=[],col=[];
  const ct=new THREE.Color();
  for(const p of parts){
    const g=new THREE.BoxGeometry(p.w,p.h,p.d);
    if(p.rx)g.rotateX(p.rx); if(p.ry)g.rotateY(p.ry); if(p.rz)g.rotateZ(p.rz);
    g.translate(p.x,p.y,p.z);
    const ng=g.toNonIndexed();
    const pa=ng.attributes.position.array,na=ng.attributes.normal.array;
    ct.set(p.c);
    for(let i=0;i<pa.length;i+=3){
      pos.push(pa[i],pa[i+1],pa[i+2]); nor.push(na[i],na[i+1],na[i+2]);
      col.push(ct.r,ct.g,ct.b);
    }
    g.dispose(); ng.dispose();
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  return geo;
}
function B(l,w,h,d,x,y,z,c,ry=0){l.push({w,h,d,x,y,z,c,ry});}

/* ================= palette ================= */
const P={
  grass1:0x59a83b,grass2:0x4c9a33,grass3:0x67b34a,dirt:0x8a5a33,dirtD:0x6e4626,
  stone:0x8d8d97,stoneD:0x69696f,wood:0x7a5230,woodD:0x5a3c22,plank:0x9a6d3c,
  water:0x3d7ec2,waterD:0x2f66a3,sand:0xd6bd7d,
  leaf1:0x3e7d2c,leaf2:0x4d923a,leaf3:0x336c23,pine:0x2c6b3a,
  roof:0xa03b2f,wall:0xdccba2,wallD:0xc0a97e,
  castle:0xb6b9c6,castleD:0x8e93a4,gold:0xf6c744,banner:0xc43b3b,
  ember:0xff9540,ice:0x9fe8ff
};

/* ================= renderer / scene roots ================= */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
let pixRatio=Math.min(window.devicePixelRatio||1,1.75);
renderer.setPixelRatio(pixRatio);
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,320);
camera.position.set(0,26,34);

addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();

/* ================= particle pools ================= */
const _dm=new THREE.Object3D();
const _cq=new THREE.Quaternion();
const _ca=new THREE.Vector3();
class Pool{
  constructor(n,opt){
    this.n=n;this.o=opt;this.i=0;
    this.px=new Float32Array(n);this.py=new Float32Array(n);this.pz=new Float32Array(n);
    this.vx=new Float32Array(n);this.vy=new Float32Array(n);this.vz=new Float32Array(n);
    this.life=new Float32Array(n);this.ttl=new Float32Array(n);
    this.s0=new Float32Array(n);this.s1=new Float32Array(n);
    this.ax=new Float32Array(n);this.ay=new Float32Array(n);this.az=new Float32Array(n);
    this.ang=new Float32Array(n);this.av=new Float32Array(n);
    this.bounced=new Uint8Array(n);
    this.cf=null;this.ct=null; // optional color lerp arrays (Color)
    if(opt.colorLerp){this.cf=[];this.ct=[];}
    const geo=Pool.geo||(Pool.geo=new THREE.BoxGeometry(1,1,1));
    this.mesh=new THREE.InstancedMesh(geo,opt.mat,n);
    this.mesh.frustumCulled=false;
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const c=new THREE.Color(1,1,1);
    for(let i=0;i<n;i++){this.mesh.setColorAt(i,c);_dm.position.set(0,-999,0);_dm.scale.setScalar(0.0001);_dm.updateMatrix();this.mesh.setMatrixAt(i,_dm.matrix);}
    if(opt.renderOrder)this.mesh.renderOrder=opt.renderOrder;
    scene.add(this.mesh);
    this.mesh.instanceMatrix.needsUpdate=true;
  }
  spawn(x,y,z,o={}){
    const i=this.i;this.i=(this.i+1)%this.n;
    this.px[i]=x;this.py[i]=y;this.pz[i]=z;
    this.vx[i]=o.vx||0;this.vy[i]=o.vy||0;this.vz[i]=o.vz||0;
    this.ttl[i]=o.ttl||1;this.life[i]=0;
    this.s0[i]=o.s0!==undefined?o.s0:0.15;this.s1[i]=o.s1!==undefined?o.s1:this.s0[i];
    this.ax[i]=rand(-1,1);this.ay[i]=rand(-1,1);this.az[i]=rand(-1,1);
    this.ang[i]=rand(TAU);this.av[i]=rand(-6,6);this.bounced[i]=0;
    if(this.o.colorLerp){
      this.cf[i]=new THREE.Color(o.c0!==undefined?o.c0:0xffffff);
      this.ct[i]=new THREE.Color(o.c1!==undefined?o.c1:o.c0!==undefined?o.c0:0xffffff);
      this.mesh.setColorAt(i,this.cf[i]);
    }else if(o.c!==undefined){this.mesh.setColorAt(i,new THREE.Color(o.c));}
    return i;
  }
  update(dt){
    const o=this.o;let any=false;
    const g=o.gravity||0,drag=o.drag||0;
    for(let i=0;i<this.n;i++){
      if(this.life[i]>=this.ttl[i])continue;
      any=true;this.life[i]+=dt;
      if(this.life[i]>=this.ttl[i]){
        _dm.position.set(0,-999,0);_dm.scale.setScalar(0.0001);_dm.updateMatrix();this.mesh.setMatrixAt(i,_dm.matrix);continue;
      }
      this.vy[i]-=g*dt;
      if(drag){const f=Math.max(0,1-drag*dt);this.vx[i]*=f;this.vy[i]*=f;this.vz[i]*=f;}
      this.px[i]+=this.vx[i]*dt;this.py[i]+=this.vy[i]*dt;this.pz[i]+=this.vz[i]*dt;
      if(o.grow){this.py[i]+=o.grow*dt;}
      if(o.bounce&&this.py[i]<groundAt(this.px[i],this.pz[i])+0.03&&this.vy[i]<0){
        this.bounced[i]++;
        if(this.bounced[i]>2){this.life[i]=this.ttl[i];continue;}
        this.py[i]=groundAt(this.px[i],this.pz[i])+0.03;
        this.vy[i]*=-0.42;this.vx[i]*=0.65;this.vz[i]*=0.65;
      }
      this.ang[i]+=this.av[i]*dt;
      const u=this.life[i]/this.ttl[i];
      let s=lerp(this.s0[i],this.s1[i],u);
      if(o.tailShrink&&u>0.75)s*=clamp((1-u)/0.25,0,1);
      _dm.position.set(this.px[i],this.py[i],this.pz[i]);
      if(o.spin){_ca.set(this.ax[i],this.ay[i],this.az[i]).normalize();_cq.setFromAxisAngle(_ca,this.ang[i]);_dm.quaternion.copy(_cq);}
      else _dm.quaternion.identity();
      if(o.billboard)_dm.quaternion.copy(camera.quaternion);
      _dm.scale.setScalar(Math.max(s,0.001));_dm.updateMatrix();
      this.mesh.setMatrixAt(i,_dm.matrix);
      if(this.o.colorLerp){const c=this.cf[i].clone().lerp(this.ct[i],u);this.mesh.setColorAt(i,c);}
    }
    this.mesh.instanceMatrix.needsUpdate=true;
    if(this.mesh.instanceColor)this.mesh.instanceColor.needsUpdate=true;
    this.mesh.visible=any;
    return any;
  }
  reset(){for(let i=0;i<this.n;i++){this.life[i]=this.ttl[i];_dm.position.set(0,-999,0);_dm.scale.setScalar(0.0001);_dm.updateMatrix();this.mesh.setMatrixAt(i,_dm.matrix);}this.mesh.instanceMatrix.needsUpdate=true;}
}
let scene=new THREE.Scene(); // replaced per run; pools re-parented

function makePools(){
  if(pool.debris){for(const k of ['debris','smoke','spark','flame','coin']){scene.remove(pool[k].mesh);pool[k].mesh.material.dispose();}}
  pool.debris=new Pool(1000,{mat:new THREE.MeshLambertMaterial({}),gravity:14,spin:true,tailShrink:true});
  pool.smoke=new Pool(340,{mat:new THREE.MeshLambertMaterial({transparent:true,opacity:0.5,depthWrite:false}),gravity:-0.9,drag:0.6,spin:true,renderOrder:8});
  pool.spark=new Pool(500,{mat:new THREE.MeshBasicMaterial({}),gravity:9,drag:1.4,spin:true,renderOrder:9});
  pool.flame=new Pool(420,{mat:new THREE.MeshBasicMaterial({transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false}),gravity:-1.6,drag:2.2,colorLerp:true,renderOrder:10});
  pool.coin=new Pool(160,{mat:new THREE.MeshLambertMaterial({}),gravity:16,spin:true,bounce:true});
}
const pool={};

function burst(pos,{n=14,c=0xffffff,c2,spd=5,size=0.16,ttl=0.9,up=3,grav=14}={}){
  for(let i=0;i<n;i++){
    const a=rand(TAU),r=rand(0.2,1)*spd;
    pool.debris.spawn(pos.x+rand(-.2,.2),pos.y+rand(0,.3),pos.z+rand(-.2,.2),{
      vx:Math.cos(a)*r,vy:rand(up*0.4,up+2),vz:Math.sin(a)*r,
      s0:size*rand(0.6,1.5),s1:size*rand(0.3,0.8),ttl:ttl*rand(0.7,1.3),
      c:c2&&Math.random()<0.35?c2:c
    });
  }
}
function sparks(pos,{n=8,c=0xffe08a,spd=6,size=0.07,ttl=0.4,up=2}={}){
  for(let i=0;i<n;i++){
    const a=rand(TAU),r=rand(0.3,1)*spd;
    pool.spark.spawn(pos.x,pos.y,pos.z,{vx:Math.cos(a)*r,vy:rand(0.5,1)*up+1,vz:Math.sin(a)*r,s0:size*rand(.7,1.4),s1:size*0.4,ttl:ttl*rand(.7,1.3),c});
  }
}
function smoke(pos,{n=3,c=0x9aa2a8,spd=0.5,size=0.3,ttl=1.6,up=1.4}={}){
  for(let i=0;i<n;i++){
    pool.smoke.spawn(pos.x+rand(-.2,.2),pos.y+rand(0,.2),pos.z+rand(-.2,.2),{
      vx:rand(-.4,.4)*spd,vy:up*rand(.7,1.3),vz:rand(-.4,.4)*spd,
      s0:size*rand(.6,1),s1:size*rand(1.8,2.6),ttl:ttl*rand(.8,1.3),c:vary(c,0.12)
    });
  }
}
function flamePuff(pos,dir,{n=3,spd=7,size=0.16,ttl=0.35,spread=0.35}={}){
  for(let i=0;i<n;i++){
    const d=dir.clone();d.x+=rand(-spread,spread);d.y+=rand(-.1,.25);d.z+=rand(-spread,spread);d.normalize();
    pool.flame.spawn(pos.x,pos.y,pos.z,{vx:d.x*spd*rand(.7,1.2),vy:d.y*spd*rand(.7,1.2),vz:d.z*spd*rand(.7,1.2),
      s0:size*rand(.7,1.2),s1:size*rand(1.6,2.4),ttl:ttl*rand(.75,1.25),c0:0xffdf6e,c1:0xd42a08});
  }
}
function ember(pos,{n=2,c=0xff9540}={}){
  for(let i=0;i<n;i++){
    pool.flame.spawn(pos.x+rand(-.2,.2),pos.y+rand(0,.2),pos.z+rand(-.2,.2),
      {vx:rand(-.5,.5),vy:rand(1,2.2),vz:rand(-.5,.5),s0:0.09,s1:0.02,ttl:rand(.4,.8),c0:0xffc95e,c1:0xc23a0a});
  }
}
function coins(pos,n,gold){
  const count=clamp(Math.round(gold/7)+2,2,7);
  for(let i=0;i<Math.min(count,n);i++){
    pool.coin.spawn(pos.x,pos.y+0.2,pos.z,{vx:rand(-2,2),vy:rand(3.5,6),vz:rand(-2,2),
      s0:0.16,s1:0.16,ttl:rand(0.8,1.2),c:0xf6c744});
  }
}

/* shock rings */
const rings=[];
function makeRings(){
  for(const r of rings){scene.remove(r.mesh);r.mesh.material.dispose();}
  if(rings.geo)rings.geo.dispose();
  rings.length=0;
  const geo=new THREE.RingGeometry(0.62,0.78,26);rings.geo=geo;
  for(let i=0;i<8;i++){
    const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xffcf7a,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
    m.rotation.x=-Math.PI/2;m.visible=false;m.renderOrder=11;scene.add(m);
    rings.push({mesh:m,life:1,ttl:1,s0:1,s1:6});
  }
}
let ringI=0;
function ring(pos,{s0=0.8,s1=5.5,ttl=0.5,c=0xffcf7a}={}){
  const r=rings[ringI];ringI=(ringI+1)%rings.length;
  r.mesh.visible=true;r.mesh.position.set(pos.x,pos.y+0.08,pos.z);
  r.mesh.material.color.set(c);r.life=0;r.ttl=ttl;r.s0=s0;r.s1=s1;
}
function updateRings(dt){
  for(const r of rings){
    if(!r.mesh.visible)continue;
    r.life+=dt;const u=r.life/r.ttl;
    if(u>=1){r.mesh.visible=false;continue;}
    r.mesh.scale.setScalar(lerp(r.s0,r.s1,u));
    r.mesh.material.opacity=(1-u)*0.85;
  }
}

/* lightning bolts */
const bolts=[];
function makeBolts(){
  for(const b of bolts){scene.remove(b.line);b.line.material.dispose();b.line.geometry.dispose();}
  bolts.length=0;
  for(let i=0;i<10;i++){
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(16*3),3));
    const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x9fd8ff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
    l.frustumCulled=false;l.renderOrder=12;scene.add(l);
    bolts.push({line:l,life:1,ttl:1});
  }
}
let boltI=0;
const _bv1=new THREE.Vector3(),_bv2=new THREE.Vector3(),_bv3=new THREE.Vector3();
function bolt(a,b,{c=0x9fd8ff,w=null}={}){
  const bl=bolts[boltI];boltI=(boltI+1)%bolts.length;
  const p=bl.line.geometry.attributes.position;
  const seg=12;_bv1.copy(a);_bv2.copy(b).sub(a);
  const side=new THREE.Vector3().crossVectors(_bv2,new THREE.Vector3(0,1,0)).normalize();
  for(let i=0;i<=seg;i++){
    const t=i/seg;_bv3.copy(a).addScaledVector(_bv2,t);
    if(i>0&&i<seg){const j=(Math.random()-0.5)*0.7;_bv3.x+=side.x*j;_bv3.z+=side.z*j;_bv3.y+=(Math.random()-0.5)*0.4;}
    p.setXYZ(Math.min(i,15),_bv3.x,_bv3.y,_bv3.z);
  }
  p.needsUpdate=true;
  bl.line.geometry.setDrawRange(0,seg+1);
  bl.line.material.color.set(c);bl.life=0;bl.ttl=0.14;bl.line.visible=true;
}
function updateBolts(dt){
  for(const b of bolts){
    if(!b.line.visible)continue;
    b.life+=dt;const u=b.life/b.ttl;
    if(u>=1){b.line.visible=false;continue;}
    b.line.material.opacity=1-u;
  }
}

/* ================= world ================= */
const MW=66,MH=66,HALF=33,RES=0.4,MAX_WAVES=12,CYCLE=115,DAY0=0.16;
const T_GRASS=0,T_PATH=1,T_WATER=2,T_BRIDGE=3,T_SAND=4,T_PLAT=5,T_MTN=6,T_BLOCK=7;
let world=null;
const _sp={x:0,z:0,dx:1,dz:0};
function groundAt(x,z){
  if(!world)return 0;
  const i=clamp(Math.round(x+HALF-0.5),0,MW-1),k=clamp(Math.round(z+HALF-0.5),0,MH-1);
  return world.surf[k*MW+i];
}
function samplePath(s){
  const r=world.res;
  const f=clamp(s/RES,0,r.length-1.001);
  const i=f|0,t=f-i;
  const a=r[i],b=r[Math.min(i+1,r.length-1)];
  _sp.x=lerp(a.x,b.x,t);_sp.z=lerp(a.z,b.z,t);
  _sp.dx=b.x-a.x;_sp.dz=b.z-a.z;
  const l=Math.hypot(_sp.dx,_sp.dz)||1;_sp.dx/=l;_sp.dz/=l;
  return _sp;
}
const tileOf=v=>clamp(Math.round(v+HALF-0.5),0,MW-1);
const tileX=i=>i-HALF+0.5;

function disposeWorld(w){
  if(!w)return;
  for(const g of w.geos)g.dispose();
  for(const m of w.mats)m.dispose();
}
function groundAtStandalone(grid,surf,x,z){
  const i=tileOf(x),k=tileOf(z);return surf[k*MW+i];
}
function samplePathStandalone(res,s){
  const f=clamp(s/RES,0,res.length-1.001),i=f|0,t=f-i;
  const a=res[i],b=res[Math.min(i+1,res.length-1)];
  return {x:lerp(a.x,b.x,t),z:lerp(a.z,b.z,t),dx:b.x-a.x,dz:b.z-a.z};
}

function buildWorld(seed){
  const rng=mulberry32(seed);
  const w={seed,geos:[],mats:[],decor:[],waterTiles:[],chimneys:[],flags:[],clouds:[],birds:[],spots:[],spawners:[],lanterns:[]};
  const grid=new Uint8Array(MW*MH), hgt=new Float32Array(MW*MH), surf=new Float32Array(MW*MH);
  const gi=(i,k)=>k*MW+i;

  /* ---- path ---- */
  const z0=(rng()*2-1)*12;
  const wps=[{x:-27.5,z:z0}];
  const east=[];for(let i=0;i<6;i++)east.push(6.2+rng()*1.9);
  let cx=-27.5,cz=z0,dir=-Math.sign(z0)||1;
  for(let i=0;i<5;i++){
    cx+=east[i];wps.push({x:cx,z:cz});
    cz=clamp(cz+dir*(6+rng()*6),-13.5,13.5);dir=-dir;
    wps.push({x:cx,z:cz});
  }
  cx+=east[5];wps.push({x:cx,z:cz});
  const castleCX=clamp(cx+4.4,-24,24),castleCZ=cz;
  wps.push({x:castleCX+1.7,z:castleCZ}); // walk into the gate

  const res=[];
  for(let i=0;i<wps.length-1;i++){
    const a=wps[i],b=wps[i+1];
    const len=Math.abs(b.x-a.x)+Math.abs(b.z-a.z);
    const n=Math.max(1,Math.ceil(len/RES));
    for(let j=0;j<n;j++)res.push({x:lerp(a.x,b.x,j/n),z:lerp(a.z,b.z,j/n)});
  }
  res.push({x:wps[wps.length-1].x,z:wps[wps.length-1].z});
  w.res=res;w.pathLen=(res.length-1)*RES;
  const gate={x:wps[0].x,z:wps[0].z};

  /* ---- river ---- */
  const legStart=wps[4].x,legEnd=wps[5].x;
  const rI=tileOf(legStart+3.6+rng()*Math.max(0.8,legEnd-legStart-7.2));
  const rw=2+((rng()*2)|0);
  for(let i=rI-rw;i<=rI+rw;i++)for(let k=0;k<MH;k++){
    if(grid[gi(i,k)]===T_PATH)grid[gi(i,k)]=T_BRIDGE;else grid[gi(i,k)]=T_WATER;
  }
  for(let k=0;k<MH;k++){
    if(grid[gi(rI-rw-1,k)]!==T_PATH&&grid[gi(rI-rw-1,k)]!==T_BRIDGE)grid[gi(rI-rw-1,k)]=T_SAND;
    if(grid[gi(rI+rw+1,k)]!==T_PATH&&grid[gi(rI+rw+1,k)]!==T_BRIDGE)grid[gi(rI+rw+1,k)]=T_SAND;
  }
  w.riverX=tileX(rI);

  /* ---- path tiles ---- */
  for(const p of res){
    const i=tileOf(p.x),k=tileOf(p.z),id=gi(i,k);
    if(grid[id]===T_WATER)grid[id]=T_BRIDGE;else if(grid[id]!==T_BRIDGE)grid[id]=T_PATH;
  }

  /* ---- plateau + castle ---- */
  for(let k=0;k<MH;k++)for(let i=0;i<MW;i++){
    const d=Math.hypot(tileX(i)-castleCX,tileX(k)-castleCZ);
    if(d<5.8){
      const h=1.55*(1-smooth(3.2,5.8,d));
      if(h>hgt[gi(i,k)])hgt[gi(i,k)]=h;
      if(h>0.7&&grid[gi(i,k)]!==T_PATH&&grid[gi(i,k)]!==T_MTN)grid[gi(i,k)]=T_PLAT;
    }
  }

  /* ---- mountains rim + hillocks ---- */
  for(let k=0;k<MH;k++)for(let i=0;i<MW;i++){
    const x=tileX(i),z=tileX(k),ax=Math.abs(x),az=Math.abs(z);
    if(ax>29.5||az>29.5){
      grid[gi(i,k)]=T_MTN;
      hgt[gi(i,k)]=1.1+vn(i*0.5,k*0.5)*2.6+Math.max(ax-29.5,az-29.5)*1.1+Math.max(ax,az)*0.045;
    }else if((ax>27.5||az>27.5)&&vn(i*0.6,k*0.6)>0.25){
      hgt[gi(i,k)]=Math.max(hgt[gi(i,k)],0.35+vn(i*0.9,k*0.9)*0.9);
    }
  }

  /* ---- distance-to-path grid ---- */
  const dPath=new Float32Array(MW*MH);
  for(let k=0;k<MH;k++)for(let i=0;i<MW;i++){
    const x=tileX(i),z=tileX(k);let m=1e9;
    for(let j=0;j<res.length;j+=2){
      const d=d2(x,z,res[j].x,res[j].z);if(d<m)m=d;
    }
    dPath[gi(i,k)]=Math.sqrt(m);
  }
  w.dPath=dPath;

  /* ---- decorative mounds ---- */
  for(let k=2;k<MH-2;k++)for(let i=2;i<MW-2;i++){
    if(grid[gi(i,k)]!==T_GRASS)continue;
    if(dPath[gi(i,k)]<8)continue;
    if(vn(i*0.55,k*0.55)>0.88)hgt[gi(i,k)]=0.5+vn(i*0.9,k*0.9)*1.3;
  }

  /* ---- surface heights ---- */
  for(let k=0;k<MH;k++)for(let i=0;i<MW;i++){
    const t=grid[gi(i,k)];
    let s=hgt[gi(i,k)];
    if(t===T_PATH)s=hgt[gi(i,k)]+0.05;
    else if(t===T_BRIDGE)s=0.15;
    else if(t===T_WATER)s=-0.55;
    surf[gi(i,k)]=s;
  }
  w.surf=surf;w.grid=grid;

  /* ---- village ---- */
  let vc=null;
  for(let a=0;a<600;a++){
    const i=irand(4,MW-5),k=irand(4,MH-5);
    if(grid[gi(i,k)]!==T_GRASS||hgt[gi(i,k)]>0.2)continue;
    if(dPath[gi(i,k)]<6.5)continue;
    if(Math.abs(i-rI)<rw+6)continue;
    if(Math.abs(tileX(i))>23||Math.abs(tileX(k))>23)continue;
    vc={x:tileX(i),z:tileX(k)};break;
  }
  if(!vc)vc={x:-14,z:-14};
  w.village=vc;
  const houses=[[0,0,1.75,1.45],[2.35,0.5,1.5,1.3],[-0.5,2.6,1.9,1.5],[-2.4,-1.2,1.6,1.35]];
  const housePts=[];
  for(const h of houses){
    const hx=vc.x+h[0],hz=vc.z+h[1],hw=h[2],hd=h[3];
    housePts.push({x:hx,z:hz});
    for(let k=tileOf(hz-hd/2)-1;k<=tileOf(hz+hd/2)+1;k++)
      for(let i=tileOf(hx-hw/2)-1;i<=tileOf(hx+hw/2)+1;i++)grid[gi(i,k)]=T_BLOCK;
  }
  grid[gi(tileOf(vc.x+1.2),tileOf(vc.z-1.9))]=T_BLOCK; // campfire
  w.campfire={x:vc.x+1.2,z:vc.z-1.9,y:groundAtStandalone(grid,surf,vc.x+1.2,vc.z-1.9)};

  /* ---- trees & rocks ---- */
  const treeSpots=[];
  for(let a=0;a<260&&treeSpots.length<58;a++){
    const i=irand(2,MW-3),k=irand(2,MH-3);
    if(grid[gi(i,k)]!==T_GRASS||hgt[gi(i,k)]>1.6)continue;
    if(dPath[gi(i,k)]<3.4)continue;
    if(Math.abs(i-rI)<rw+2)continue;
    let ok=true;
    for(const t of treeSpots)if(d2(tileX(i),tileX(k),t.x,t.z)<5)ok=false;
    if(ok){treeSpots.push({x:tileX(i),z:tileX(k),y:surf[gi(i,k)],pine:rng()<0.42,s:rng()});grid[gi(i,k)]=T_BLOCK;}
  }
  w.treeSpots=treeSpots;
  const rockSpots=[];
  for(let a=0;a<120&&rockSpots.length<20;a++){
    const i=irand(2,MW-3),k=irand(2,MH-3);
    if(grid[gi(i,k)]!==T_GRASS||hgt[gi(i,k)]>1.6)continue;
    if(dPath[gi(i,k)]<2.8)continue;
    let ok=true;
    for(const t of rockSpots.concat(treeSpots))if(d2(tileX(i),tileX(k),t.x,t.z)<3.6)ok=false;
    if(ok){rockSpots.push({x:tileX(i),z:tileX(k),y:surf[gi(i,k)],s:rng()});grid[gi(i,k)]=T_BLOCK;}
  }

  /* ---- lanterns along the road ---- */
  for(let li=0;li<6;li++){
    const s=w.pathLen*(0.1+li*0.155);
    const p=samplePathStandalone(res,s);
    const off=1.15*(li%2?1:-1);
    const lx=p.x-p.dz*off, lz=p.z+p.dx*off;
    const i=tileOf(lx),k=tileOf(lz);
    if(grid[gi(i,k)]!==T_GRASS)continue;
    w.lanterns.push({x:tileX(i),z:tileX(k),y:surf[gi(i,k)]});
    grid[gi(i,k)]=T_BLOCK;
  }

  /* ---- terrain blocks ---- */
  const entries=[];
  const _mtc=new THREE.Color();
  for(let k=0;k<MH;k++)for(let i=0;i<MW;i++){
    const t=grid[gi(i,k)],x=tileX(i),z=tileX(k);
    let top,c;
    if(t===T_WATER||t===T_BRIDGE){
      top=-0.55;
      c=vary(new THREE.Color(P.waterD).lerp(new THREE.Color(P.sand),0.45),0.08);
    }else{
      top=hgt[gi(i,k)];
      if(t===T_MTN){
        const f=clamp((top-1.2)/2.4,0,1);
        c=top>3.9?vary(0xe3e9f2,0.05):vary(new THREE.Color(0x4e8746).lerp(_mtc.set(P.stone),f),0.12);
      }
      else if(t===T_PATH){top=hgt[gi(i,k)]+0.05;c=vary(P.dirt,0.1);}
      else if(t===T_SAND)c=vary(P.sand,0.08);
      else if(t===T_PLAT)c=vary(0x66ad46,0.06);
      else{
        const n=vn(i*0.31,k*0.31);
        c=vary(n<0.4?P.grass2:n<0.72?P.grass1:P.grass3,0.05);
        if(top>0.3)c=vary(0x4f9a36,0.08);
      }
    }
    entries.push({x,z,top,c});
  }
  const tGeo=new THREE.BoxGeometry(1,1,1);w.geos.push(tGeo);
  const tMat=new THREE.MeshLambertMaterial();w.mats.push(tMat);
  const terrain=new THREE.InstancedMesh(tGeo,tMat,entries.length);
  terrain.castShadow=true;terrain.receiveShadow=true;terrain.frustumCulled=false;
  for(let i=0;i<entries.length;i++){
    const e=entries[i],sy=e.top+1.05;
    _dm.position.set(e.x,e.top-sy/2,e.z);_dm.scale.set(1,sy,1);_dm.rotation.set(0,0,0);_dm.updateMatrix();
    terrain.setMatrixAt(i,_dm.matrix);terrain.setColorAt(i,e.c);
  }
  scene.add(terrain);w.terrain=terrain;

  /* ---- water surface ---- */
  for(let k=0;k<MH;k++)for(let i=0;i<MW;i++){
    if(grid[gi(i,k)]===T_WATER||grid[gi(i,k)]===T_BRIDGE)w.waterTiles.push({x:tileX(i),z:tileX(k),ph:i*0.9+k*0.55,near:Math.abs(i-rI)<=rw});
  }
  const wGeo=new THREE.BoxGeometry(0.96,0.12,0.96);w.geos.push(wGeo);
  const wMat=new THREE.MeshLambertMaterial({color:0xffffff});w.mats.push(wMat);
  const water=new THREE.InstancedMesh(wGeo,wMat,w.waterTiles.length);
  water.frustumCulled=false;water.receiveShadow=true;
  w.waterTiles.forEach((t,i)=>water.setColorAt(i,vary(t.near?P.water:P.waterD,0.07)));
  scene.add(water);w.water=water;

  /* ---- merged decorations ---- */
  const statMat=new THREE.MeshLambertMaterial({vertexColors:true});w.mats.push(statMat);
  const addMerged=(parts,opts={})=>{
    const geo=mergeParts(parts);w.geos.push(geo);
    const mat=opts.mat||statMat;if(opts.mat)w.mats.push(opts.mat);
    const mesh=new THREE.Mesh(geo,mat);
    mesh.castShadow=opts.cast!==false;mesh.receiveShadow=opts.recv!==false;
    scene.add(mesh);w.decor.push(mesh);
    return mesh;
  };
  // trees
  {
    const parts=[];
    for(const t of treeSpots){
      const gy=t.y;
      if(t.pine){
        B(parts,0.18,0.55,0.18,t.x,gy+0.27,t.z,vary(P.woodD,0.1));
        const c=vary(P.pine,0.1);
        B(parts,1.15,0.62,1.15,t.x,gy+0.75,t.z,c);
        B(parts,0.85,0.55,0.85,t.x,gy+1.28,t.z,vary(c,0.12));
        B(parts,0.5,0.5,0.5,t.x,gy+1.75,t.z,vary(c,0.18));
      }else{
        B(parts,0.24,0.6,0.24,t.x,gy+0.3,t.z,vary(P.wood,0.12));
        const c=vary(t.s<0.5?P.leaf1:P.leaf2,0.1);
        B(parts,1.35,0.8,1.35,t.x,gy+0.95,t.z,c);
        B(parts,0.95,0.6,0.95,t.x+0.1,gy+1.55,t.z-0.08,vary(c,0.12));
        B(parts,0.55,0.42,0.55,t.x-0.12,gy+1.95,t.z+0.1,vary(c,0.2));
      }
    }
    addMerged(parts);
  }
  // rocks
  {
    const parts=[];
    for(const r of rockSpots){
      const c=vary(P.stone,0.12);
      B(parts,0.7,0.45,0.6,r.x,r.y+0.2,r.z,c,r.s*3);
      B(parts,0.4,0.3,0.42,r.x+0.25,r.y+0.5,r.z-0.15,vary(c,0.15),r.s*1.4);
      if(r.s>0.5)B(parts,0.32,0.24,0.3,r.x-0.3,r.y+0.35,r.z+0.2,vary(c,0.2),r.s*2.2);
    }
    addMerged(parts);
  }
  // village
  {
    const parts=[],winParts=[];
    for(let hi=0;hi<housePts.length;hi++){
      const h=housePts[hi],gy=groundAtStandalone(grid,surf,h.x,h.z);
      const wallC=vary(hi%2?P.wall:P.wallD,0.06),roofC=vary(P.roof,0.1);
      const hw=houses[hi][2],hd=houses[hi][3];
      B(parts,hw,0.85,hd,h.x,gy+0.43,h.z,wallC);
      B(parts,hw+0.28,0.34,hd+0.28,h.x,gy+1.02,h.z,roofC);
      B(parts,hw*0.55,0.3,hd*0.55,h.x,gy+1.3,h.z,vary(roofC,0.15));
      B(parts,0.34,0.5,0.08,h.x-hw*0.2,gy+0.26,h.z+hd/2+0.02,0x4a3520); // door
      B(parts,0.1,0.55,0.1,h.x+hw/2-0.18,gy+1.55,h.z-hd/2+0.2,0x6b6b70); // chimney post
      B(parts,0.24,0.42,0.24,h.x+hw/2-0.18,gy+1.85,h.z-hd/2+0.2,0x7d5a48); // chimney stack
      w.chimneys.push({x:h.x+hw/2-0.18,z:h.z-hd/2+0.2,y:gy+2.1,t:rand(0.2,1.6)});
      winParts.push({w:0.24,h:0.22,d:0.06,x:h.x+hw*0.22,y:gy+0.5,z:h.z+hd/2+0.02,c:0xffc266});
      winParts.push({w:0.06,h:0.22,d:0.24,x:h.x+hw/2+0.02,y:gy+0.5,z:h.z-hd*0.15,c:0xffc266});
    }
    // well
    const wy=groundAtStandalone(grid,surf,vc.x-1.6,vc.z+2.1);
    B(parts,0.8,0.35,0.8,vc.x-1.6,wy+0.17,vc.z+2.1,vary(P.stone,0.1));
    B(parts,0.62,0.2,0.62,vc.x-1.6,wy+0.32,vc.z+2.1,0x22303e);
    B(parts,0.08,0.7,0.08,vc.x-1.85,wy+0.7,vc.z+2.1,P.woodD);
    B(parts,0.08,0.7,0.08,vc.x-1.35,wy+0.7,vc.z+2.1,P.woodD);
    B(parts,0.7,0.12,0.55,vc.x-1.6,wy+1.05,vc.z+2.1,vary(P.roof,0.08));
    // campfire
    const cf=w.campfire;
    for(let s=0;s<6;s++){const a=s/6*TAU;B(parts,0.16,0.14,0.16,cf.x+Math.cos(a)*0.42,cf.y+0.06,cf.z+Math.sin(a)*0.42,vary(P.stone,0.15),a);}
    B(parts,0.7,0.14,0.14,cf.x,cf.y+0.08,cf.z,P.woodD,0.5);
    B(parts,0.14,0.14,0.7,cf.x,cf.y+0.1,cf.z,P.wood,0.4);
    B(parts,0.3,0.14,0.3,cf.x,cf.y+0.06,cf.z,0x2b1a10);
    addMerged(parts);
    const winMat=new THREE.MeshLambertMaterial({color:0x352a18,emissive:0xffc266,emissiveIntensity:0.15});w.mats.push(winMat);
    w.winMat=winMat;
    addMerged(winParts,{mat:winMat,cast:false});
  }
  // bridge (planks on every bridge tile; rails along straight runs)
  {
    const parts=[];
    const tiles=[];
    for(let k=0;k<MH;k++)for(let i=0;i<MW;i++)if(grid[gi(i,k)]===T_BRIDGE)tiles.push({i,k});
    for(const t of tiles)B(parts,1.04,0.1,1.04,tileX(t.i),0.1,tileX(t.k),vary(P.plank,0.12));
    const railRun=(idxs,fixedVal,horizontal)=>{
      if(idxs.length<2)return;
      idxs.sort((a,b)=>a-b);
      const v0=tileX(idxs[0])-0.5,v1=tileX(idxs[idxs.length-1])+0.5;
      const mid=(v0+v1)/2,len=v1-v0;
      for(const side of[-0.46,0.46]){
        if(horizontal)B(parts,len,0.09,0.1,mid,0.42,fixedVal+side,vary(P.woodD,0.08));
        else B(parts,0.1,0.09,len,fixedVal+side,0.42,mid,vary(P.woodD,0.08));
        for(let n=0;;n++){
          const pv=v0+0.5+n;
          if(pv>v1)break;
          if(horizontal)B(parts,0.12,0.55,0.12,pv,0.28,fixedVal+side,vary(P.wood,0.1));
          else B(parts,0.12,0.55,0.12,fixedVal+side,0.28,pv,vary(P.wood,0.1));
        }
        if(horizontal){
          B(parts,0.18,1.3,0.18,v0+0.05,-0.15,fixedVal+side,vary(P.woodD,0.1));
          B(parts,0.18,1.3,0.18,v1-0.05,-0.15,fixedVal+side,vary(P.woodD,0.1));
        }else{
          B(parts,0.18,1.3,0.18,fixedVal+side,-0.15,v0+0.05,vary(P.woodD,0.1));
          B(parts,0.18,1.3,0.18,fixedVal+side,-0.15,v1-0.05,vary(P.woodD,0.1));
        }
      }
    };
    const byRow={},byCol={};
    for(const t of tiles){(byRow[t.k]=byRow[t.k]||[]).push(t.i);(byCol[t.i]=byCol[t.i]||[]).push(t.k);}
    for(const k in byRow)railRun(byRow[k],tileX(+k),true);
    for(const i in byCol)railRun(byCol[i],tileX(+i),false);
    if(tiles.length)addMerged(parts);
  }
  // lanterns
  {
    const lamMat=new THREE.MeshLambertMaterial({color:0x3a3a40,emissive:0xffc46a,emissiveIntensity:0.15});w.mats.push(lamMat);
    w.lanternMat=lamMat;
    const parts=[],lampParts=[];
    for(const l of w.lanterns){
      B(parts,0.13,0.95,0.13,l.x,l.y+0.47,l.z,vary(P.woodD,0.1));
      B(lampParts,0.26,0.26,0.26,l.x,l.y+1.02,l.z,0xffd9a0);
    }
    addMerged(parts);
    addMerged(lampParts,{mat:lamMat,cast:false});
  }
  // spawn gate
  {
    const parts=[];
    const gy=groundAt(gate.x,gate.z);
    B(parts,0.55,3.1,0.55,gate.x,gy+1.55,gate.z-1.35,vary(P.stoneD,0.08));
    B(parts,0.55,3.1,0.55,gate.x,gy+1.55,gate.z+1.35,vary(P.stoneD,0.08));
    B(parts,0.65,0.6,3.4,gate.x,gy+3.25,gate.z,vary(P.stoneD,0.05));
    B(parts,0.3,2.7,2.3,gate.x-0.12,gy+1.35,gate.z,0x1a1424);
    B(parts,0.4,1.3,0.1,gate.x-0.05,gy+2.5,gate.z-1.0,P.banner);
    B(parts,0.4,1.3,0.1,gate.x-0.05,gy+2.5,gate.z+1.0,P.banner);
    addMerged(parts);
  }

  /* ---- castle ---- */
  {
    const py=groundAt(castleCX,castleCZ);
    const group=new THREE.Group();group.position.set(castleCX,py,castleCZ);
    w.castleGroup=group;scene.add(group);
    const parts=[],winP=[],rubble=[];
    const wallC=()=>vary(P.castle,0.05),darkC=()=>vary(P.castleD,0.05);
    B(parts,7.0,2.3,0.9,0,1.15,3.05,wallC());
    B(parts,7.0,2.3,0.9,0,1.15,-3.05,wallC());

function enemiesUpdate(dt){

    const px=p.x-p.dz*e.lane,pz=p.z+p.dx*e.lane;
    const gy=groundAt(px,pz);

    if(e.def.fly)y=gy+e.def.fly+Math.sin(gameTime*2+e.phase)*0.35;
    else{
      const rate=e.type==='brute'||e.type==='boss'?1.6:2.4;
      e.phase+=dt*spd*rate;
      y=gy+Math.abs(Math.sin(e.phase))*0.09*e.def.size;
      const stp=Math.floor(e.phase/Math.PI);
      if(stp!==e.stepPh){e.stepPh=stp;
        if(e.def.size>=1&&Math.random()<0.5)smoke({x:px,y:gy+0.05,z:pz},{n:1,c:0x9a8a72,size:0.12,ttl:0.6,up:0.6});}

        {vx:0,vy:0.7,vz:0,s0:0.12,s1:0.02,ttl:0.6,c0:0x9a5cff,c1:0x2c1060});}}

    e.fg.material.color.setHSL(0.33*ratio,0.85,0.5);
  }
}

function towerStats(t){
  const L=t.level,m=1+0.5*(L-1),rm=1-0.07*(L-1),rM=1+0.06*(L-1);
  return {dmg:t.def.dmg*m,rate:t.def.rate*rm,range:t.def.range*rM};

function registerCoverage(type,level,x,z){
  const R=TOWER_DEFS[type].range*(1+0.06*(level-1));
  const mult=1+0.3*(level-1);
  const sm=world.samples,cov=world.covered;
  for(let i=0;i<sm.length;i++){
    const d=Math.hypot(sm[i].x-x,sm[i].z-z);
    if(d>=R)continue;
    const w=(1-d/R);const v=w*w*mult;
    if(v>cov[i])cov[i]=v;
  }
}
function spotValue(type,x,z){
  const R=TOWER_DEFS[type].range;
  const sm=world.samples,cov=world.covered;
  let v=0;
  for(let i=0;i<sm.length;i++){
    const d=Math.hypot(sm[i].x-x,sm[i].z-z);
    if(d>=R)continue;
    const w=1-d/R;
    const g2=w*w-cov[i];
    if(g2>0)v+=g2;
  }
  return v;
}
function spotLate(type,x,z){
  const R=TOWER_DEFS[type].range;let late=0,tot=0;
  for(const sm of world.samples){
    const d=Math.hypot(sm.x-x,sm.z-z);if(d>=R)continue;
    const w=1-d/R;tot+=w;
    if(sm.s>world.pathLen*0.62)late+=w;
  }
  return tot>0?late/tot:0;
}

function fireZap(t,st,tg){

/* ================= projectiles ================= */
const projPool={arrow:[],shard:[],ball:[]};
const PROJ_GEO={arrow:new THREE.BoxGeometry(0.07,0.07,0.55),shard:new THREE.BoxGeometry(0.16,0.16,0.4),ball:new THREE.BoxGeometry(0.34,0.34,0.34)};
const PROJ_MAT={arrow:new THREE.MeshLambertMaterial({color:0xd8cfa8}),shard:new THREE.MeshBasicMaterial({color:0x9fe8ff}),ball:new THREE.MeshLambertMaterial({color:0x2e2e36})};
function initProjPools(){
  for(const k of ['arrow','shard','ball']){
    for(const it of projPool[k])scene.remove(it.mesh);
    projPool[k].length=0;
    const n=k==='ball'?14:k==='shard'?26:46;
    for(let i=0;i<n;i++){
      const m=new THREE.Mesh(PROJ_GEO[k],PROJ_MAT[k]);
      m.visible=false;m.rotation.order='YXZ';m.castShadow=k==='ball';
      scene.add(m);
      projPool[k].push({mesh:m,active:false,vx:0,vy:0,vz:0,life:0,dmg:0,aoe:2.4,target:null,t:0,T:1,h:1,p0:null,p1:null,homing:0,grav:0});
    }
  }
}
function clearProj(){for(const k in projPool){for(const it of projPool[k])scene.remove(it.mesh);projPool[k].length=0;}}
function nearestEnemy(x,y,z,r){
  let best=null,bd=r*r;
  for(const e of enemies){
    if(e.dead)continue;
    const d=d2(x,z,e.x,e.z);
    if(d<bd){bd=d;best=e;}
  }
  return best;
}
function spawnProj(kind,from,target,dmg,t){
  const arr=projPool[kind];
  let it=null;
  for(const c of arr)if(!c.active){it=c;break;}
  if(!it)return;
  it.active=true;it.mesh.visible=true;
  it.mesh.position.copy(from);
  it.dmg=dmg;it.target=target;it.tower=t;
  if(kind==='ball'){
    const dist0=Math.hypot(target.x-from.x,target.z-from.z);
    const T=clamp(0.5+dist0*0.05,0.55,1.3);
    const spd=target.def.spd*(target.slowT>0?1-target.slowAmt:1)*(1+0.018*waves.num);
    const p=samplePath(target.s+spd*T*0.8);
    const tx=p.x-p.dz*target.lane,tz=p.z+p.dx*target.lane;
    it.p0=from.clone();it.p1=new THREE.Vector3(tx,groundAt(tx,tz)+0.05,tz);
    it.T=T;it.t=0;it.h=dist0*0.22+1.4;it.aoe=t.def.aoe;
  }else{
    const dx=target.x-from.x,dy=(target.y+target.def.h*0.4)-from.y,dz=target.z-from.z;
    const d=Math.hypot(dx,dy,dz)||1;
    const spd=kind==='arrow'?24:17;
    it.vx=dx/d*spd;it.vy=dy/d*spd;it.vz=dz/d*spd;
    it.life=2.2;it.grav=kind==='arrow'?5:0;it.homing=kind==='arrow'?4:10;
  }
}
function projsUpdate(dt){
  for(const kind of ['arrow','shard','ball']){
    for(const it of projPool[kind]){
      if(!it.active)continue;
      const m=it.mesh;
      if(kind==='ball'){
        it.t+=dt;const u=it.t/it.T;
        if(u>=1){it.active=false;m.visible=false;
          explode(it.p1.x,it.p1.y+0.1,it.p1.z,it.dmg,it.aoe);continue;}
        m.position.set(lerp(it.p0.x,it.p1.x,u),lerp(it.p0.y,it.p1.y,u)+it.h*4*u*(1-u),lerp(it.p0.z,it.p1.z,u));
        m.rotation.y+=dt*7;
      }else{
        it.life-=dt;
        if(it.life<=0){it.active=false;m.visible=false;continue;}
        let tg=it.target;
        if(tg&&tg.dead){tg=it.target=nearestEnemy(m.position.x,m.position.y,m.position.z,4);}
        if(tg&&!tg.dead){
          const dx=tg.x-m.position.x,dy=(tg.y+tg.def.h*0.4)-m.position.y,dz=tg.z-m.position.z;
          const d=Math.hypot(dx,dy,dz)||1;
          const spd=Math.hypot(it.vx,it.vy,it.vz)||1;
          const hk=Math.min(1,it.homing*dt);
          it.vx+=(dx/d*spd-it.vx)*hk;it.vy+=(dy/d*spd-it.vy)*hk;it.vz+=(dz/d*spd-it.vz)*hk;
          if(d<0.55+tg.def.size*0.3){
            it.active=false;m.visible=false;
            damageEnemy(tg,it.dmg);
            if(kind==='arrow')sparks(m.position,{n:4,c:0xffe08a,spd:3,size:0.05,ttl:0.3});
            else{applySlow(tg,0.5,1.9);sparks(m.position,{n:6,c:0x9fe8ff,spd:3,size:0.06,ttl:0.4});}
            continue;
          }
        }
        it.vy-=it.grav*dt;
        m.position.x+=it.vx*dt;m.position.y+=it.vy*dt;m.position.z+=it.vz*dt;
        const sp=Math.hypot(it.vx,it.vy,it.vz)||1;
        m.rotation.y=Math.atan2(it.vx,it.vz);
        m.rotation.x=-Math.asin(clamp(it.vy/sp,-1,1));
        if(kind==='arrow'&&m.position.y<groundAt(m.position.x,m.position.z)-0.1){
          it.active=false;m.visible=false;
          smoke(m.position,{n:1,c:0x9a8a72,size:0.1,ttl:0.5,up:0.5});
        }
      }
    }
  }
}

/* ================= waves ================= */
const waves={num:0,queue:[],state:'break',spawnT:0,breakT:2,spawnAcc:0};
const hpMult=n=>1+0.34*(n-1)+0.058*n*n;
function waveComp(n){
  const r=mulberry32((world.seed+n*7919)|0);
  const list=[];
  const push=(t,c)=>{for(let i=0;i<c;i++)list.push(t);};
  push('scout',3+Math.min(14,Math.round(n*1.3)));
  if(n>=2)push('brute',1+Math.floor(n/2.6));
  if(n>=3&&(n%2===1||n>=6))push('flyer',1+Math.floor((n-1)*0.8));
  if(n>=4)push('armored',1+Math.floor((n-3)*0.75));
  if(n%4===0)push('boss',n>=8?2:1);
  for(let i=list.length-1;i>0;i--){const j=(r()*(i+1))|0;const tmp=list[i];list[i]=list[j];list[j]=tmp;}
  return list;
}
function startWave(n){
  waves.num=n;waves.queue=waveComp(n);waves.state='spawning';waves.spawnT=0.6;waves.spawnAcc=0;
  const comp=waves.queue;
  const flyers=comp.filter(x=>x==='flyer').length;
  const boss=comp.indexOf('boss')>=0;
  const msg=boss?'Wave '+n+' — the WARLORD marches!':
    flyers>3?'Wave '+n+' — winged horrors incoming!':
    comp.length>16?'Wave '+n+' — a horde pours from the gate!':
    'Wave '+n+' — the horde grows bolder.';
  status(msg,boss?4:2.6,!!boss);
  logMsg('Wave '+n+' incoming ('+comp.length+' foes)');
}
function wavesUpdate(dt){
  if(waves.state==='spawning'){
    waves.spawnAcc+=dt;
    const interval=Math.max(0.32,1.05-waves.num*0.045);
    while(waves.spawnAcc>interval&&waves.queue.length){
      waves.spawnAcc-=interval;
      const type=waves.queue.shift();
      spawnEnemy(type,0,hpMult(waves.num));
      if(type==='boss'){
        director.force={mode:'boss',until:gameTime+4.5};
        const g0=world.res[0];
        ring({x:g0.x,y:1,z:g0.z,s0:1,s1:5,ttl:0.6,c:0xc25cff});
      }
    }
    if(!waves.queue.length)waves.state='clearing';
  }else if(waves.state==='clearing'){
    if(enemies.length===0){
      const bonus=34+waves.num*11;
      gold+=bonus;
      status('Wave '+waves.num+' cleared! +'+bonus+'g',2.6);
      logMsg('Wave '+waves.num+' repelled (+'+bonus+'g)');
      if(waves.num>=MAX_WAVES){endRun(true);return;}
      waves.state='break';waves.breakT=3.5;
    }
  }else{
    waves.breakT-=dt;
    if(waves.breakT<=0)startWave(waves.num+1);
  }
}

/* ================= AI player ================= */
let aiT=0;
function bestSpotFor(type){
  let bs=null,bv=0.02;
  for(const s of world.spots){
    if(s.used)continue;
    const v=spotValue(type,s.x,s.z)+rand(0,0.2);
    if(v>bv){bv=v;bs=s;}
  }
  return bs;
}
function aiUpdate(dt){
  aiT-=dt;if(aiT>0)return;aiT=0.6;
  const targetTowers=Math.min(6+waves.num*1.1,16);
  const comp=waveComp(waves.num+1);
  const flyers=comp.filter(x=>x==='flyer').length;
  const swarm=comp.filter(x=>x==='scout').length+comp.filter(x=>x==='armored').length;
  const boss=comp.indexOf('boss')>=0;
  const emerg=castleHP<castleMax*0.4;
  const cnt={arrow:0,frost:0,cannon:0,flame:0,tesla:0};
  for(const t of towers)cnt[t.type]++;
  const wts={
    arrow:1+(flyers?0.75:0)+(cnt.arrow<2?0.5:0),
    tesla:1+(boss?0.85:0)+(flyers?0.5:0)+(cnt.tesla>=3?-0.55:0),
    cannon:0.95+(swarm>8?0.65:0)+(cnt.cannon>=3?-0.45:0),
    flame:0.9+(swarm>8?0.6:0)+(cnt.flame>=2?-0.45:0),
    frost:(cnt.frost<2&&waves.num>=2?1.05:0.15)+(swarm>6?0.25:0),
  };
  let action=null;
  if(towers.length<targetTowers){
    let bestType=null,bestSpot=null,bestVal=0;
    for(const type of ['tesla','arrow','cannon','flame','frost']){
      const cost=TOWER_DEFS[type].cost;
      if(gold<cost+(emerg?0:30))continue;
      let bs=null,bv=0;
      for(const s of world.spots){
        if(s.used)continue;
        let v=spotValue(type,s.x,s.z);
        if(v<=0.02)continue;
        if(emerg)v*=1+spotLate(type,s.x,s.z)*0.8;
        v+=rand(0,0.25);
        if(v>bv){bv=v;bs=s;}
      }
      if(!bs)continue;
      const val=bv*wts[type];
      if(val>bestVal){bestVal=val;bestType=type;bestSpot=bs;}
    }
    if(bestType)action={type:'build',tower:bestType,spot:bestSpot};
  }
  if(!action){
    let best=null,bestScore=0;
    for(const t of towers){
      if(t.level>=4)continue;
      const cost=upCost(t);
      if(gold<cost+(emerg?0:40))continue;
      let sc=(4-t.level)*1.2+towerStats(t).dmg/60;
      if(t.lastFire>gameTime-3)sc+=0.8;
      if(t.type==='tesla'&&boss)sc+=0.6;
      sc+=rand(0,0.3);
      if(sc>bestScore){bestScore=sc;best=t;}
    }
    if(best)action={type:'upgrade',tower:best};
  }
  if(!action)return;
  if(action.type==='build'){
    const def=TOWER_DEFS[action.tower];
    gold-=def.cost;
    spawnTower(action.tower,action.spot,1);
  }else{
    const c=upCost(action.tower);
    gold-=c;
    upgradeTower(action.tower,c);
  }
}

/* ================= run / prewarm ================= */
let gold=0,kills=0,waveNum=0,castleHP=1000,castleMax=1000;
let gameState='boot',winResult=false,overT=0,fwT=0,gameTime=0;
const heat=[];
function heatAdd(x,z,e){heat.push({x,z,e});if(heat.length>70)heat.splice(0,heat.length-70);}
function fightFocus(){
  let front=null;
  for(const e of enemies)if(!e.dead&&(!front||e.s>front.s))front=e;
  if(!front){
    let x=0,z=0,w=0;
    for(const h of heat){x+=h.x*h.e;z+=h.z*h.e;w+=h.e;}
    if(w>0.4)return{x:x/w,z:z/w,y:2};
    return null;
  }
  let x=0,z=0,y=0,n=0;
  for(const e of enemies){
    if(e.dead)continue;
    if(d2(e.x,e.z,front.x,front.z)<64){x+=e.x;z+=e.z;y+=e.y;n++;}
  }
  if(!n)return null;
  return{x:x/n,z:z/n,y:y/n};
}
function prewarm(){
  gold=310;kills=18;castleHP=930;castleMax=1000;waves.num=2;
  const order=['arrow','cannon','frost','tesla','flame','arrow'];
  let firstArrow=true;
  for(const type of order){
    const spot=bestSpotFor(type);
    if(!spot)continue;
    let lv=1;
    if(type==='arrow'&&firstArrow){lv=2;firstArrow=false;}
    spawnTower(type,spot,lv,true);
  }
  const comp=waveComp(3);
  const m=hpMult(3);
  for(let i=0;i<Math.min(10,comp.length);i++)spawnEnemy(comp[i],rand(3,Math.max(8,world.pathLen-12)),m);
  waves.num=3;waves.queue=comp.slice(10);
  waves.state=waves.queue.length?'spawning':'clearing';waves.spawnT=1.2;waves.spawnAcc=0;
  status('Battle joined — Wave 3 is on the road',3.5);
  logMsg('You arrive mid-battle. Hold the line!');
}
function endRun(win){
  if(gameState!=='play')return;
  gameState='over';winResult=win;overT=0;fwT=0;
  if(win){
    status('ALL '+MAX_WAVES+' WAVES REPELLED — the realm endures!',99);
    logMsg('Victory! A new tale begins soon…');
  }else{
    status('THE CASTLE HAS FALLEN — a new realm rises…',99,true);

    const c=world.castle;

    smoke({x:c.cx,y:c.y+3,z:c.cz},{n:10,c:0x6a6f76,spd:1.5,size:0.7,ttl:2.5,up:2.5});
    ring({x:c.cx,y:c.y+0.2,z:c.cz,s0:1,s1:14,ttl:0.9,c:0xff8a5a});

    for(const e of enemies){
      if(e.dead)continue;

function overUpdate(dt){
  overT+=dt;
  if(winResult){
    fwT-=dt;
    if(fwT<=0){
      fwT=rand(0.35,0.7);
      const c=world.castle,a=rand(TAU),r=rand(2,8);

      burst({x,y,z},{n:18,c:choice([0xffd75e,0x7fd0ff,0xff8a8a,0x9dff8a]),spd:5,size:0.12,ttl:0.9,up:3});
      sparks({x,y,z},{n:8,c:0xfff2c0,spd:4,size:0.06,ttl:0.5});
    }

      {n:2,c:0x565b63,size:0.6,ttl:2.2,up:1.6});

function startRun(){
  if(world)disposeWorld(world);

/* ================= camera director ================= */
const director={mode:'orbit',t:0,dur:6,phase:rand(TAU),force:null,lastMode:'',snap:true,fov:52,
  look:new THREE.Vector3()};
function pickShot(){
  const D=director;
  const f=fightFocus();
  const opts=[];
  const add=(m,wt)=>{if(m!==D.lastMode)opts.push([m,wt]);};
  add('orbit',1.1);
  if(f){add('combat',2.4);add('fly',1.7);add('high',0.8);}
  let anyTower=false,rec=null,bestFire=-99;
  for(const t of towers)if(t.lastFire>bestFire){bestFire=t.lastFire;rec=t;anyTower=true;}
  if(anyTower)add('tower',1.2);
  add('castle',0.9);
  let tot=0;for(const o of opts)tot+=o[1];
  let r=Math.random()*tot,pick=opts[0][0];
  for(const o of opts){r-=o[1];if(r<=0){pick=o[0];break;}}
  D.mode=pick;D.t=0;D.dur=rand(5,8);D.phase=rand(TAU);D.lastMode=pick;D.snap=true;
  D.fov=pick==='combat'||pick==='tower'||pick==='boss'?46:pick==='fly'?55:50;
}
const _cv1=new THREE.Vector3(),_cv2=new THREE.Vector3();
function updateCamera(dt){
  const D=director;D.t+=dt;
  if(gameState==='over'){
    const m=winResult?'orbit':'castle';
    if(D.mode!==m){D.mode=m;D.snap=true;D.t=0;D.fov=50;}
  }else if(D.force&&gameTime<D.force.until){
    if(D.mode!==D.force.mode){D.mode=D.force.mode;D.t=0;D.snap=true;D.fov=46;}
  }else{
    D.force=null;
    if(D.t>D.dur)pickShot();
  }
  const f=fightFocus();
  const aspect=camera.aspect;
  const wide=aspect<1?1+(1-aspect)*0.5:aspect>2.1?1.08:1;
  let px=0,py=20,pz=0,lx=0,ly=2,lz=0;
  let ok=true;
  switch(D.mode){
    case 'orbit':{
      const a=D.t*0.1+D.phase;
      px=Math.cos(a)*34*wide;pz=Math.sin(a)*34*wide;py=23;
      lx=f?f.x*0.3:0;ly=2;lz=f?f.z*0.3:0;
      break;}
    case 'high':{
      if(!f){ok=false;break;}
      const a=D.t*0.22+D.phase;
      px=f.x+Math.cos(a)*9;pz=f.z+Math.sin(a)*9;py=20;
      lx=f.x;ly=f.y;lz=f.z;
      break;}
    case 'combat':{
      if(!f){ok=false;break;}
      const a=D.phase+D.t*0.12;
      px=f.x+Math.cos(a)*10.5;pz=f.z+Math.sin(a)*10.5;py=4.3+Math.sin(D.t*0.5)*0.5;
      lx=f.x;ly=f.y+1.5;lz=f.z;
      break;}
    case 'fly':{
      let front=null,fs=-1;
      for(const e of enemies)if(!e.dead&&e.s>fs){fs=e.s;front=e;}
      if(!front){ok=false;break;}
      const p=samplePath(Math.max(0,fs-7));
      px=p.x-p.dz*2.4;pz=p.z+p.dx*2.4;py=4.8;
      const p2=samplePath(Math.min(fs+7,world.pathLen));
      lx=p2.x;ly=groundAt(p2.x,p2.z)+1.2;lz=p2.z;
      break;}
    case 'tower':{
      let tw=null,bf=-99;
      for(const t of towers)if(t.lastFire>bf){bf=t.lastFire;tw=t;}
      if(!tw){ok=false;break;}
      const a=D.phase+D.t*0.2;
      px=tw.x+Math.cos(a)*7.5;pz=tw.z+Math.sin(a)*7.5;py=groundAt(tw.x,tw.z)+3.6;
      lx=tw.x;ly=groundAt(tw.x,tw.z)+2.2;lz=tw.z;
      break;}
    case 'boss':{
      let boss=null;
      for(const e of enemies)if(!e.dead&&e.type==='boss'){boss=e;break;}
      if(!boss){ok=false;break;}
      const a=D.phase+D.t*0.3;
      px=boss.x+Math.cos(a)*6.5;pz=boss.z+Math.sin(a)*6.5;py=boss.y+3;
      lx=boss.x;ly=boss.y+1.2;lz=boss.z;
      break;}
    case 'castle':{
      const c=world.castle;
      const a=D.phase+D.t*0.07;
      px=c.cx+Math.cos(a)*17;pz=c.cz+Math.sin(a)*17;py=c.y+7.5;
      lx=c.cx;ly=c.y+3.2;lz=c.cz;
      break;}
  }
  if(!ok){
    const a=D.t*0.1+D.phase;
    px=Math.cos(a)*34*wide;pz=Math.sin(a)*34*wide;py=23;lx=0;ly=2;lz=0;
  }
  px+=Math.sin(D.t*0.7+D.phase)*0.3;
  py+=Math.sin(D.t*0.9)*0.18;
  pz+=Math.cos(D.t*0.6)*0.3;
  const minY=groundAt(px,pz)+1.3;
  if(py<minY)py=minY;
  _cv1.set(px,py,pz);_cv2.set(lx,ly,lz);
  if(D.snap){camera.position.copy(_cv1);D.look.copy(_cv2);D.snap=false;}
  else{
    const k=1-Math.exp(-4.2*dt);
    camera.position.lerp(_cv1,k);
    D.look.lerp(_cv2,k);
  }
  camera.lookAt(D.look);
  camera.fov+=(D.fov-camera.fov)*Math.min(1,dt*3);
  camera.updateProjectionMatrix();
}

/* ================= environment ================= */
const SKY=[[0,0xffab66,0xffd0a0],[0.1,0x9ad0f5,0xc6def0],[0.35,0x8ecdf2,0xc2d8ea],[0.52,0xa3b8d6,0xbac6d8],[0.62,0xf08a4e,0xf2b183],[0.72,0x4e4370,0x655a84],[0.8,0x1c2340,0x27304e],[0.92,0x101627,0x1a2236],[1,0xffab66,0xffd0a0]];
const _tc1=new THREE.Color(),_tc2=new THREE.Color();
const CLOUD_DAY=new THREE.Color(0xffffff),CLOUD_NIGHT=new THREE.Color(0x2a3145),CLOUD_SET=new THREE.Color(0xffc9a2);
let sparkleT=0,castleSmokeT=0;
function updateEnv(dt){
  const w=world;if(!w)return;
  w.dayT=(w.dayT+dt/CYCLE)%1;
  const dayT=w.dayT;
  for(let i=1;i<SKY.length;i++){

      break;
    }
  }
  const sunEl=Math.sin(Math.PI*clamp(dayT/0.75,0,1));
  const moonEl=Math.sin(Math.PI*clamp((dayT-0.72)/0.28,0,1));
  const nightF=1-smooth(0.03,0.24,sunEl);
  const sa=(dayT/0.75)*Math.PI,ma=((dayT-0.72)/0.28)*Math.PI;
  w.sunMesh.position.set(Math.cos(sa)*70,Math.sin(sa)*55+2,-26);
  w.sunMesh.visible=sunEl>-0.05;
  w.moonMesh.position.set(Math.cos(ma)*70,Math.sin(ma)*52+2,30);
  w.moonMesh.visible=moonEl>-0.05&&sunEl<0.1;

    w.sun.position.set(Math.cos(sa)*60,Math.max(Math.sin(sa)*52,6),-24);

    w.sun.position.set(Math.cos(ma)*55,Math.max(Math.sin(ma)*48,8),24);

  }
  w.hemi.color.set(0x2a3a5e).lerp(_tc1.set(0xbfd8ff),1-nightF);
  w.hemi.intensity=0.22+0.4*(1-nightF);
  w.amb.intensity=0.07+0.08*(1-nightF);
  w.fog.near=lerp(36,60,1-nightF);
  w.fog.far=lerp(100,140,1-nightF);
  w.stars.material.opacity=nightF*(0.55+0.3*Math.sin(gameTime*2.3));
  const glow=0.15+nightF*1.35;

  if(w.castleWinMat)w.castleWinMat.emissiveIntensity=glow;
  if(w.lanternMat)w.lanternMat.emissiveIntensity=glow;

  w.torchLight.intensity=(0.3+nightF*1.3)*(0.85+Math.sin(gameTime*13+1)*0.12+Math.random()*0.08);
  // water
  const water=w.water;
  for(let i=0;i<w.waterTiles.length;i++){
    const t=w.waterTiles[i];
    _dm.position.set(t.x,-0.2+Math.sin(gameTime*1.7+t.ph)*0.045,t.z);
    _dm.rotation.set(0,0,0);_dm.scale.set(1,1,1);_dm.updateMatrix();
    water.setMatrixAt(i,_dm.matrix);
  }
  water.instanceMatrix.needsUpdate=true;

  if(sparkleT<=0){
    sparkleT=0.4;
    const t=w.waterTiles[(Math.random()*w.waterTiles.length)|0];
    if(t)pool.spark.spawn(t.x+rand(-0.3,0.3),-0.08,t.z+rand(-0.3,0.3),{vy:0.4,s0:0.06,s1:0.02,ttl:0.5,c:0xcfe8ff});
  }
  // clouds
  for(const c of w.clouds){
    c.position.x+=c.userData.spd*dt;
    if(c.position.x>40)c.position.x=-40;
    c.position.y+=Math.sin(gameTime*0.4+c.userData.ph)*dt*0.2;
    const col=c.material.color;
    col.copy(CLOUD_DAY).lerp(CLOUD_NIGHT,nightF);
    const ss=Math.max(0,Math.sin(Math.PI*clamp((dayT-0.55)/0.22,0,1)));
    if(ss>0)col.lerp(CLOUD_SET,ss*0.45);
  }
  // birds
  for(const b of w.birds){
    const u=b.userData;u.a+=u.spd*dt;u.ph+=dt*10;
    b.position.set(u.cx+Math.cos(u.a)*u.r,u.h+Math.sin(u.ph)*0.4,u.cz+Math.sin(u.a)*u.r);
    const s=u.spd>0?1:-1;
    b.rotation.y=Math.atan2(-Math.sin(u.a)*s,Math.cos(u.a)*s);
    const fl2=Math.sin(u.ph)*0.6;
    u.wl.rotation.z=fl2;u.wr.rotation.z=-fl2;
  }
  // flags
  for(const fl of w.flags){
    fl.p1.rotation.y=Math.sin(gameTime*3+fl.ph)*0.5*fl.amp;
    fl.p2.rotation.y=Math.sin(gameTime*3+fl.ph+0.7)*0.6*fl.amp;
  }
  // fire/torch/chimney spawners
  for(const s of w.spawners){
    s.t-=dt;
    if(s.t<=0){
      if(s.type==='campfire'){
        s.t=rand(0.05,0.11);
        ember({x:s.x+rand(-0.15,0.15),y:s.y+0.1,z:s.z+rand(-0.15,0.15)},{n:1});
        if(Math.random()<0.06)smoke({x:s.x,y:s.y+0.5,z:s.z},{n:1,c:0xb9bec6,size:0.2,ttl:2,up:1.1});
      }else{
        s.t=rand(0.1,0.2);
        pool.flame.spawn(s.x+rand(-0.06,0.06),s.y,s.z+rand(-0.06,0.06),
          {vx:0,vy:rand(0.8,1.4),vz:0,s0:0.09,s1:0.02,ttl:0.35,c0:0xffd97a,c1:0xd4490f});
      }
    }
  }
  for(const ch of w.chimneys){
    ch.t-=dt;
    if(ch.t<=0){ch.t=rand(1.2,2.4);
      smoke({x:ch.x,y:ch.y,z:ch.z},{n:1,c:0xb9bec6,size:0.22,ttl:2.2,up:0.9});}
  }
  // castle shake + damage smoke
  castleShake=Math.max(0,castleShake-dt);
  w.castleGroup.position.set(
    w.castle.cx+(Math.random()-0.5)*castleShake*0.2,
    w.castle.y,
    w.castle.cz+(Math.random()-0.5)*castleShake*0.2);
  if(castleHP<castleMax*0.5&&gameState==='play'){
    castleSmokeT-=dt;
    if(castleSmokeT<=0){castleSmokeT=rand(0.5,1.1);
      smoke({x:w.castle.cx+rand(-1,1),y:w.castle.y+5.2,z:w.castle.cz+rand(-1,1)},
        {n:1,c:0x6a6f76,size:0.35,ttl:1.6,up:1.2});}
  }
}

/* ================= HUD ================= */
const H={
  wave:document.getElementById('hWave'),gold:document.getElementById('hGold'),
  bar:document.getElementById('hBar'),hp:document.getElementById('hHp'),
  kills:document.getElementById('hKills'),status:document.getElementById('status'),
  log:document.getElementById('log'),seed:document.getElementById('seed'),
};
const logLines=[];
let hudT=0,statusT=0;
function status(msg,dur=3,alert=false){
  H.status.textContent=msg;
  H.status.className=alert?'alert':'';
  statusT=dur;
}
function logMsg(msg){
  logLines.push(msg);
  if(logLines.length>3)logLines.shift();
  H.log.textContent=logLines.join('  ·  ');
}
function updateHUD(dt){
  hudT-=dt;statusT-=dt;
  if(statusT<=0&&H.status.textContent)H.status.textContent='';
  if(hudT>0)return;
  hudT=0.2;
  H.wave.textContent=Math.max(waves.num,1)+'/'+MAX_WAVES;
  H.gold.textContent=gold;
  H.kills.textContent=kills;
  H.hp.textContent=Math.ceil(castleHP);
  const pct=clamp(castleHP/castleMax,0,1);
  H.bar.style.width=(pct*100).toFixed(1)+'%';
  H.bar.style.background=pct>0.5?'#6fd35d':pct>0.25?'#e8c34a':'#e05a4a';
}

/* ================= perf adapt ================= */
let perfAcc=0,perfN=0,perfT=0,shadowsHigh=true;
function perfAdapt(dt){
  perfAcc+=dt;perfN++;perfT+=dt;
  if(perfT>2.5){
    const avg=perfAcc/perfN;
    perfAcc=0;perfN=0;perfT=0;
    if(avg>0.024&&pixRatio>1){
      pixRatio=Math.max(1,pixRatio-0.25);
      renderer.setPixelRatio(pixRatio);
    }else if(avg>0.034&&shadowsHigh){
      shadowsHigh=false;
      if(world&&world.sun){
        world.sun.shadow.mapSize.set(1024,1024);
        if(world.sun.shadow.map){world.sun.shadow.map.dispose();world.sun.shadow.map=null;}
      }
    }
  }
}

/* ================= main loop ================= */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000;last=now;
  dt=Math.min(dt,0.05);
  if(gameState==='play'){
    gameTime+=dt;
    wavesUpdate(dt);
    if(gameState==='play'){ // endRun may have fired
      enemiesUpdate(dt);
      towersUpdate(dt);
      projsUpdate(dt);
      aiUpdate(dt);
    }
  }else if(gameState==='over'){
    gameTime+=dt;
    overUpdate(dt);
  }
  for(let i=heat.length-1;i>=0;i--){
    heat[i].e-=heat[i].e*dt*0.55;
    if(heat[i].e<0.05)heat.splice(i,1);
  }
  pool.debris.update(dt);pool.smoke.update(dt);pool.spark.update(dt);
  pool.flame.update(dt);pool.coin.update(dt);
  updateRings(dt);updateBolts(dt);
  updateEnv(dt);
  updateCamera(dt);
  updateHUD(dt);
  perfAdapt(dt);
  renderer.render(scene,camera);
}

/* ================= boot ================= */
buildEGeos();
const bootEl=document.getElementById('boot');
try{
  startRun();
  document.getElementById('hud').style.display='block';
  bootEl.remove();
  requestAnimationFrame(loop);
}catch(err){
  bootEl.textContent='Something broke the realm: '+err.message;
  console.error(err);
  throw err;
}
