<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOLLOWMARCH — a voxel siege that fights itself</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23121712'/%3E%3Cpath d='M16 3l11 9-4 17H9L5 12z' fill='%23e2b357'/%3E%3Crect x='13' y='15' width='6' height='9' fill='%23121712'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#f4ead6;
    --dim:#c8bba2;
    --gold:#f5c25c;
    --gold-hot:#ffe29a;
    --blood:#c9513d;
    --panel:rgba(15,19,17,.78);
    --line:rgba(255,232,190,.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;background:#0a0f13;}
  body{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    color:var(--ink);-webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #app{position:fixed;inset:0;}
  #app canvas{display:block;width:100%;height:100%;}
  #vignette{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 42%,rgba(3,6,9,.20) 72%,rgba(3,6,9,.52) 100%);
  }
  #grain{
    position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.055;
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.9) 0px,rgba(255,255,255,.9) 1px,transparent 1px,transparent 3px);
    mix-blend-mode:overlay;
  }
  #hud{
    position:fixed;z-index:6;top:clamp(10px,2.1vh,22px);left:clamp(10px,2.1vw,22px);
    width:clamp(228px,23vw,300px);
    pointer-events:none;
    font-size:11px;letter-spacing:.06em;
    filter:drop-shadow(0 9px 22px rgba(0,0,0,.34));
    animation:hudIn 1.2s ease both;
  }
  @keyframes hudIn{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
  .panel{
    position:relative;padding:12px 13px 11px;
    background:
      linear-gradient(155deg,rgba(40,49,41,.64),rgba(11,15,14,.84) 55%,rgba(9,13,12,.9));
    border:1px solid var(--line);
    border-radius:2px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 34px rgba(0,0,0,.34),0 10px 28px rgba(0,0,0,.35);
    backdrop-filter:blur(10px) saturate(.85);
    -webkit-backdrop-filter:blur(10px) saturate(.85);
    overflow:hidden;
  }
  .panel:before{
    content:"";position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold) 18%,#fff0c4 50%,var(--gold) 82%,transparent);
    opacity:.65;
  }
  .panel:after{
    content:"";position:absolute;inset:4px;border:1px solid rgba(255,240,210,.045);
    pointer-events:none;
  }
  .corner{position:absolute;width:5px;height:5px;border-color:rgba(255,220,160,.55);border-style:solid;z-index:2;}
  .corner.tl{left:4px;top:4px;border-width:1px 0 0 1px;}
  .corner.tr{right:4px;top:4px;border-width:1px 1px 0 0;}
  .corner.bl{left:4px;bottom:4px;border-width:0 0 1px 1px;}
  .corner.br{right:4px;bottom:4px;border-width:0 1px 1px 0;}
  .brand{display:flex;align-items:center;gap:7px;line-height:1;margin-bottom:10px;}
  .sigil{
    position:relative;width:13px;height:13px;flex:none;transform:rotate(45deg);
    background:linear-gradient(135deg,#f7ca6f,#a8752b);
    box-shadow:0 0 10px rgba(245,194,92,.35),inset 0 0 0 2px rgba(25,22,15,.72);
  }
  .brandname{font-size:12px;font-weight:700;letter-spacing:.19em;color:#f8efd9;font-weight:700;}
  .auto{
    margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--gold);
    font-size:8px;letter-spacing:.14em;opacity:.9;
  }
  .auto i{width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 7px var(--gold);animation:pulse 2.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .hairline{height:1px;background:linear-gradient(90deg,rgba(255,235,196,.23),rgba(255,235,196,.06) 80%,transparent);margin:0 0 9px;}
  .hairline.soft{opacity:.55;margin:9px 0 8px;}
  .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
  .wave{font-size:10px;color:var(--dim);letter-spacing:.14em;white-space:nowrap;}
  .wave b{font-family:inherit;font-size:22px;line-height:.86;color:#fff5e0;letter-spacing:.02em;margin-left:3px;text-shadow:0 0 18px rgba(255,225,160,.18);}
  .wave .total{font-size:9px;color:rgba(216,202,177,.6);letter-spacing:.06em;margin-left:2px;}
  .kills{text-align:right;line-height:1;color:var(--ink);}
  .kills b{display:inline-block;font-size:16px;font-weight:600;color:#e9dec7;min-width:20px;}
  .kills small{display:block;margin-top:3px;font-size:7.5px;letter-spacing:.18em;color:rgba(207,193,168,.58);font-weight:400;}
  .goldrow{display:flex;align-items:center;gap:7px;margin-top:9px;line-height:1;}
  .coin{
    position:relative;width:11px;height:11px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 35% 30%,#ffe9a8,#f0b43a 45%,#a56b19 100%);
    box-shadow:0 0 6px rgba(245,194,92,.35),inset 0 0 0 1px rgba(91,57,6,.5);
  }
  .coin:after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid rgba(120,73,8,.55);}
  .goldrow b{font-size:17px;color:var(--gold-hot);font-weight:600;letter-spacing:.02em;text-shadow:0 0 12px rgba(245,194,92,.2);}
  .goldrow span:last-child{font-size:7.5px;letter-spacing:.2em;color:rgba(207,193,168,.55);margin-left:2px;}
  .castle{margin-top:11px;}
  .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:8px;letter-spacing:.17em;color:rgba(218,204,178,.7);margin-bottom:5px;}
  .lbl span:last-child{font-size:9px;color:#efe2ca;letter-spacing:.08em;}
  .bar{position:relative;height:5px;background:rgba(0,0,0,.56);border:1px solid rgba(255,236,199,.13);overflow:hidden;}
  .bar:after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 1px,transparent 1px 13px);pointer-events:none;}
  .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7ea84f,#b7ce75);box-shadow:0 0 10px rgba(159,204,104,.35);transition:width .4s ease,background .4s ease;}
  .boss{margin-top:8px;}
  .boss.hidden{display:none;}
  .bossbar i{background:linear-gradient(90deg,#b84034,#ef7e54);box-shadow:0 0 11px rgba(235,91,60,.4);}
  .ticker{
    min-height:14px;display:flex;align-items:center;gap:6px;
    font-size:8.5px;letter-spacing:.08em;color:rgba(238,223,195,.82);line-height:1.35;
    transition:opacity .5s ease;
  }
  .ticker .arrow{color:var(--gold);font-size:9px;flex:none;}
  .ticker.dim{opacity:.45;}
  @media (max-height:560px){
    #hud{width:228px;font-size:10px;}
    .panel{padding:9px 11px;}
    .brand{margin-bottom:7px;}
    .goldrow{margin-top:7px;}
    .castle{margin-top:8px;}
  }
  @media (max-width:480px){
    #hud{width:216px;top:9px;left:9px;}
    .panel{padding:10px 11px;}
    .wave b{font-size:19px;}
  }
</style>
<script type="importmap">
{
  "imports": {

      <div class="wave">WAVE<b id="waveNow">01</b><span class="total">/ <span id="waveMax">10</span></span></div>

    <div class="goldrow"><span class="coin"></span><b id="gold">0</b><span>GOLD</span></div>

      <div class="lbl"><span>CASTLE</span><span id="hpText">100</span></div>
      <div class="bar"><i id="hpFill"></i></div>

    <div id="bossRow" class="boss hidden">
      <div class="lbl"><span>THE HOLLOW KING</span><span id="bossHpText"></span></div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =========================================================================
   HOLLOWMARCH
   A self-playing voxel siege. Everything procedural, no external assets.
   ========================================================================= */

// ---------------------------------------------------------------- constants
const TILE = 2;
const GRID = 44;
const HALF = (GRID - 1) / 2;
const T_GX0 = -20, T_GX1 = 63, T_GZ0 = -20, T_GZ1 = 63;
const TER_W = T_GX1 - T_GX0 + 1;
const TER_H = T_GZ1 - T_GZ0 + 1;
const DAY_LENGTH = 210;
const START_DAY_T = 0.38;
const MAX_WAVES = 10;
const MAX_TOWERS = 13;
const CASTLE_MAX_HP = 100;

const worldX = gx => (gx - HALF) * TILE;
const worldZ = gz => (gz - HALF) * TILE;
const tileX = x => x / TILE + HALF;
const tileZ = z => z / TILE + HALF;

const VILLAGE = new THREE.Vector3(worldX(11.5), 0, worldZ(32));
const CASTLE = new THREE.Vector3(worldX(42), 0, worldZ(14));
const CASTLE_GATE = new THREE.Vector3(worldX(38), 0.1, worldZ(14));

// ---------------------------------------------------------------- randoms
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(0x51f3a7);
const rand = (a=0,b=1) => a + (b-a)*rng();
const pick = arr => arr[(rng()*arr.length)|0];
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const smoothstep = (a,b,x) => { const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const lerp = (a,b,t) => a+(b-a)*t;

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc0d4);
scene.fog = new THREE.Fog(0xc4d7df, 120, 400);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth/window.innerHeight, 0.1, 900);
camera.position.set(48, 46, 58);
camera.lookAt(0, 2, 0);

// ---------------------------------------------------------------- lights
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x58703f, 1.15);
scene.add(hemi);
const ambient = new THREE.AmbientLight(0xffffff, 0.19);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffe1af, 3.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -72;
sun.shadow.camera.right = 72;
sun.shadow.camera.top = 72;
sun.shadow.camera.bottom = -72;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 280;
sun.shadow.bias = -0.00035;
sun.shadow.normalBias = 0.035;
scene.add(sun);
scene.add(sun.target);
sun.position.set(80, 120, 50);

const moon = new THREE.DirectionalLight(0x88aaff, 0.0);
scene.add(moon);

// ---------------------------------------------------------------- colors / materials
const colorCache = new Map();
function C(hex){
  let c = colorCache.get(hex);
  if(!c){ c = new THREE.Color(hex); colorCache.set(hex,c); }
  return c;
}
const GRASS = ['#70a842','#6a9f3d','#78b149','#649839'];
const DIRT = '#7a5b3a';
const SAND = ['#c8a46b','#bc9760','#d1ae77','#b88e57'];
const WOOD = ['#8b5e37','#7f5430','#96683f','#744a2b'];
const STONE = ['#9b9a91','#8b8a82','#a5a39a','#85847c'];
const LEAF = ['#3f8b4e','#4c9b56','#357d46','#58a35e'];

const MAT = {
  voxel: new THREE.MeshLambertMaterial({vertexColors:true}),
  glowSmoke: new THREE.MeshLambertMaterial({transparent:true, opacity:0.34, depthWrite:false, color:0xffffff}),
  window: new THREE.MeshBasicMaterial({color:0x38291c}),
  water: null,
};

// ---------------------------------------------------------------- geometry helpers
const shadeAxis = { posX:0.93, negX:0.80, posZ:0.985, negZ:0.875, top:1.0, bottom:0.56 };

function paintBox(g, topHex, sideHex){
  const top = C(topHex);
  const side = C(sideHex === undefined ? topHex : sideHex);
  const normals = g.attributes.normal;
  const count = normals.count;
  const colors = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const nx = normals.getX(i), ny = normals.getY(i), nz = normals.getZ(i);
    let src = side, shade = 1;
    if(ny > 0.5){ src = top; shade = shadeAxis.top; }
    else if(ny < -0.5){ shade = shadeAxis.bottom; }
    else if(Math.abs(nx) > 0.5){ shade = nx > 0 ? shadeAxis.posX : shadeAxis.negX; }
    else { shade = nz > 0 ? shadeAxis.posZ : shadeAxis.negZ; }
    colors[i*3] = src.r*shade;
    colors[i*3+1] = src.g*shade;
    colors[i*3+2] = src.b*shade;
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return g;
}

// Add a box sitting on yBottom, centered on x/z.
function vox(arr, x, yBottom, z, sx, sy, sz, topHex, sideHex = topHex, rotY = 0){
  const g = new THREE.BoxGeometry(sx, sy, sz);
  paintBox(g, topHex, sideHex);
  if(rotY) g.rotateY(rotY);
  g.translate(x, yBottom + sy*0.5, z);
  arr.push(g);
  return g;
}

function makeMerged(arr, material = MAT.voxel, cast = true, receive = true){
  if(!arr.length) return null;
  const geo = mergeGeometries(arr, false);
  arr.forEach(g => g.dispose());
  if(!geo) throw new Error('merge failed');
  geo.computeBoundingSphere();
  const mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  return mesh;
}

// A box whose origin is its pivot (used for limbs / animation parts)
function voxPivot(arr, w, h, d, topHex, sideHex = topHex, oy = 0, oz = 0, ox = 0){
  const g = new THREE.BoxGeometry(w, h, d);
  paintBox(g, topHex, sideHex);
  g.translate(ox, oy - h*0.5, oz);
  arr.push(g);
  return g;
}

// merge local geometry arrays into one static mesh at given transforms
function meshOf(arr, cast=true, receive=true){
  return makeMerged(arr, MAT.voxel, cast, receive);
}

// ---------------------------------------------------------------- glow texture
function makeGlowTexture(){
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const grd = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.12, 'rgba(255,255,255,.95)');
  grd.addColorStop(0.34, 'rgba(255,255,255,.42)');
  grd.addColorStop(0.68, 'rgba(255,255,255,.08)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,s,s);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function makeScorchTexture(){
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const grd = ctx.createRadialGradient(s/2,s/2,4,s/2,s/2,s/2);
  grd.addColorStop(0,'rgba(20,14,9,.9)');
  grd.addColorStop(.5,'rgba(30,22,14,.55)');
  grd.addColorStop(.78,'rgba(35,26,17,.16)');
  grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = grd; ctx.fillRect(0,0,s,s);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const GLOW_TEX = makeGlowTexture();
const SCORCH_TEX = makeScorchTexture();

// ---------------------------------------------------------------- sky
const skyUniforms = {
  uTop: { value: new THREE.Color(0x5a9bc9) },
  uHorizon: { value: new THREE.Color(0xe7d1aa) },
  uSunDir: { value: new THREE.Vector3(0.5,0.7,0.3) },
  uSunColor: { value: new THREE.Color(0xfff1cf) },
  uNight: { value: 0 }
};
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  uniforms: skyUniforms,
  vertexShader: `
    varying vec3 vDir;
    void main(){
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    varying vec3 vDir;
    uniform vec3 uTop, uHorizon, uSunColor, uSunDir;
    uniform float uNight;
    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y*1.35 + 0.06, 0.0, 1.0);
      vec3 col = mix(uHorizon, uTop, pow(h, 0.56));
      float sun = max(dot(d, normalize(uSunDir)), 0.0);
      col += uSunColor * pow(sun, 140.0) * 0.9;
      col += uSunColor * pow(sun, 12.0) * 0.10 * (1.0-uNight);
      float band = pow(1.0 - abs(d.y), 5.0);
      col = mix(col, uHorizon, band*0.22);
      gl_FragColor = vec4(col,1.0);
    }`
});
const skyRig = new THREE.Group();
scene.add(skyRig);
const skyGeo = new THREE.SphereGeometry(520, 32, 20);
const skyDome = new THREE.Mesh(skyGeo, skyMat);
skyDome.renderOrder = -20;
skyRig.add(skyDome);

const sunSpriteMat = new THREE.SpriteMaterial({map:GLOW_TEX, color:0xfff2cd, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false, depthTest:true, fog:false});
const sunSprite = new THREE.Sprite(sunSpriteMat);
sunSprite.scale.setScalar(74);
sunSprite.renderOrder = -19;
skyRig.add(sunSprite);
const sunCoreMat = new THREE.SpriteMaterial({map:GLOW_TEX, color:0xffffff, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false, depthTest:true, fog:false});
const sunCore = new THREE.Sprite(sunCoreMat);
sunCore.scale.setScalar(20);
sunCore.renderOrder = -18;
skyRig.add(sunCore);

const moonMat = new THREE.SpriteMaterial({map:GLOW_TEX, color:0xdfe9ff, transparent:true, opacity:0.0, blending:THREE.AdditiveBlending, depthWrite:false, depthTest:true, fog:false});
const moonSprite = new THREE.Sprite(moonMat);
moonSprite.scale.setScalar(34);
moonSprite.renderOrder = -18;
skyRig.add(moonSprite);

// stars
const starCount = 620;
const starPos = new Float32Array(starCount*3);
for(let i=0;i<starCount;i++){
  const az = rand(0, Math.PI*2);
  const el = Math.asin(rand(0.08, 0.98));
  const r = 430;
  starPos[i*3] = Math.cos(el)*Math.cos(az)*r;
  starPos[i*3+1] = Math.sin(el)*r;
  starPos[i*3+2] = Math.cos(el)*Math.sin(az)*r;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
const starMat = new THREE.PointsMaterial({color:0xf4f2df, size:1.7, sizeAttenuation:false, transparent:true, opacity:0, depthWrite:false, fog:false});
const stars = new THREE.Points(starGeo, starMat);
stars.renderOrder = -17;
stars.frustumCulled = false;
skyRig.add(stars);

// ---------------------------------------------------------------- path
const pathCornersT = [
  [-2, 8], [9, 8], [9, 22], [24, 22], [24, 33],
  [35, 33], [35, 14], [37.5, 14]
];
function chaikin(points, iterations){
  let pts = points;
  for(let it=0; it<iterations; it++){
    const out = [pts[0]];
    for(let i=0;i<pts.length-1;i++){
      const a = pts[i], b = pts[i+1];
      out.push(a.clone().lerp(b, 0.25), a.clone().lerp(b, 0.75));
    }
    out.push(pts[pts.length-1]);
    pts = out;
  }
  return pts;
}

const path = (() => {
  const ctrl = pathCornersT.map(([gx,gz]) => new THREE.Vector3(worldX(gx), 0.13, worldZ(gz)));
  const smooth = chaikin(ctrl, 3);
  const samples = [];
  const tangents = [];
  const dists = [];
  let acc = 0;
  const spacing = 0.5;
  for(let i=0;i<smooth.length-1;i++){
    const a = smooth[i], b = smooth[i+1];
    const seg = a.distanceTo(b);
    if(seg < 1e-5) continue;
    const n = Math.max(1, Math.ceil(seg / spacing));
    for(let j=0;j<n;j++){
      const t = j/n;
      samples.push(new THREE.Vector3().lerpVectors(a,b,t));
      tangents.push(new THREE.Vector3().subVectors(b,a).normalize());
      dists.push(acc + seg*t);
    }
    acc += seg;
  }
  samples.push(smooth[smooth.length-1].clone());
  tangents.push(tangents[tangents.length-1].clone());
  dists.push(acc);

  const coarse = [];
  for(let i=0;i<samples.length;i+=8) coarse.push(samples[i]);

  function at(d){
    d = clamp(d, 0, acc);
    let lo=0, hi=dists.length-1;
    while(lo < hi-1){
      const mid = (lo+hi)>>1;
      if(dists[mid] <= d) lo = mid; else hi = mid;
    }
    const span = Math.max(1e-6, dists[hi]-dists[lo]);
    const t = (d-dists[lo])/span;
    return {
      pos: samples[lo].clone().lerp(samples[hi], t),
      tan: tangents[lo].clone().lerp(tangents[hi], t).normalize()
    };
  }
  function distTo(x,z){
    let best = 1e9;
    for(const p of coarse){
      const dx = p.x-x, dz = p.z-z;
      const d2 = dx*dx+dz*dz;
      if(d2 < best) best = d2;
    }
    return Math.sqrt(best);
  }
  return { samples, tangents, dists, length: acc, at, distTo, coarse };
})();

// ---------------------------------------------------------------- slots
const slotFractions = [0.075, 0.155, 0.245, 0.33, 0.435, 0.525, 0.615, 0.705, 0.795, 0.865, 0.925, 0.965, 0.99];
const slots = [];
for(let i=0;i<slotFractions.length;i++){
  let d = slotFractions[i] * path.length;
  let s = path.at(d);
  let perp = new THREE.Vector3(s.tan.z, 0, -s.tan.x);
  let pos = s.pos.clone().addScaledVector(perp, 6.15 * (i%2===0?1:-1));
  let guard = 0;
  while((inRiverWorld(pos.x,pos.z) || Math.hypot(pos.x-CASTLE.x,pos.z-CASTLE.z) < 7) && guard++ < 12){
    d += 6;
    s = path.at(Math.min(d, path.length-1));
    perp = new THREE.Vector3(s.tan.z, 0, -s.tan.x);
    pos = s.pos.clone().addScaledVector(perp, 6.15 * (i%2===0?1:-1));
  }
  // avoid two slots occupying the same patch of ground
  guard = 0;
  while(slots.some(o=>o.pos.distanceTo(pos) < 7.5) && guard++ < 12){
    d += 4.5;
    s = path.at(Math.min(d, path.length-1));
    perp = new THREE.Vector3(s.tan.z, 0, -s.tan.x);
    pos = s.pos.clone().addScaledVector(perp, 6.15 * (i%2===0?1:-1));
  }
  pos.y = 0;
  slots.push({ id:i, def:{d, side:(i%2===0?1:-1)}, d, pos, topY:0, tower:null, platform:null });
}

// ---------------------------------------------------------------- river
function riverCenterTile(gz){
  return 18.15 + Math.sin(gz*0.255 + 0.9)*2.05 + Math.sin(gz*0.09 + 1.7)*0.9;
}
function riverHalfTile(gz){
  return 1.38 + Math.sin(gz*0.21 - 0.4)*0.16;
}
function inRiverGT(gx, gz){
  return Math.abs(gx - riverCenterTile(gz)) < riverHalfTile(gz);
}
function inRiverWorld(x, z){
  return inRiverGT(tileX(x), tileZ(z));
}

// ---------------------------------------------------------------- terrain meta
const meta = new Array(TER_W*TER_H);
function metaIdx(gx,gz){ return (gz-T_GZ0)*TER_W + (gx-T_GX0); }
function metaAt(gx,gz){
  const ix = clamp(gx-T_GX0, 0, TER_W-1);
  const iz = clamp(gz-T_GZ0, 0, TER_H-1);
  return meta[iz*TER_W+ix];
}
function terrainTopAt(x,z){
  const m = metaAt(Math.round(tileX(x)), Math.round(tileZ(z)));
  return m ? m.top : 0;
}
function slotDist(x,z){
  let best = 1e9;
  for(const s of slots){
    const dx = s.pos.x-x, dz = s.pos.z-z;
    const d2 = dx*dx+dz*dz;
    if(d2<best) best=d2;
  }
  return Math.sqrt(best);
}

const SIDE_DIRT = new THREE.Color('#765537');
const SIDE_STONE = new THREE.Color('#777269');

for(let gz=T_GZ0; gz<=T_GZ1; gz++){
  for(let gx=T_GX0; gx<=T_GX1; gx++){
    const x = worldX(gx), z = worldZ(gz);
    const dPath = path.distTo(x,z);
    const dVill = Math.hypot(x-VILLAGE.x, z-VILLAGE.z);
    const dCastle = Math.hypot(x-CASTLE.x, z-CASTLE.z);
    const dSlot = slotDist(x,z);
    const river = inRiverGT(gx,gz);
    const riverEdge = Math.abs(gx - riverCenterTile(gz)) - riverHalfTile(gz);
    let top = 0;
    let kind = 'grass';

    if(river){
      top = -1.35;
      kind = 'riverbed';
    } else {
      let n = 0.50
        + 0.31*Math.sin(gx*0.33 + 1.2)
        + 0.27*Math.cos(gz*0.27 - 0.55)
        + 0.20*Math.sin((gx*0.8+gz*0.6)*0.21 + 2.0);
      let level = n > 0.74 ? 2 : (n > 0.46 ? 1 : 0);
      // outer ring: fold the board up into wooded hills so the map has no visible edge
      const dxOut = Math.abs(x), dzOut = Math.abs(z);
      const rim = Math.max(0, Math.max(dxOut,dzOut) - 48);
      if(rim > 0){
        const rough = 0.5 + 0.5*Math.sin(gx*0.31 + gz*0.18 + 1.3)*Math.cos(gz*0.27 - 0.4);
        level = Math.max(level, Math.min(7, Math.floor(1 + rim*0.22 + rough*2.4 + n*1.3)));
      }
      top = level * 0.9;

      const flatten = dPath < 3.75 || dVill < 19.5 || dCastle < 13.5 || dSlot < 3.25;
      const bank = riverEdge < 2.3;
      if(flatten || bank) top = 0;

      if(dPath < 2.6) kind = 'path';
    }

    const gn = 0.5 + 0.5*Math.sin(gx*0.43 + 0.8)*Math.cos(gz*0.37 - 0.4);
    const gi = clamp(Math.floor(gn*4) + ((gx*7+gz*13)%2), 0, GRASS.length-1);
    let grassHex = GRASS[gi];
    if(kind === 'path') grassHex = '#a48656';
    if(top >= 1.5) grassHex = GRASS[(gi+1)%GRASS.length];
    if(kind === 'riverbed') grassHex = '#5d6b54';

    meta[metaIdx(gx,gz)] = {
      gx, gz, x, z, top, river, kind,
      side: top >= 1.4 ? SIDE_STONE : SIDE_DIRT,
      grass: grassHex
    };
  }
}

// ---------------------------------------------------------------- path ribbon
const pathBorderPositions = [];
let bridgeInfo = null;
{
  const verts = [];
  const cols = [];
  const step = 2; // samples ~1 world unit
  const halfW = 1.82;
  const bridgeSamples = [];
  function push(v,c){ verts.push(v.x,v.y,v.z); cols.push(c.r,c.g,c.b); }

  const items = [];
  for(let i=0;i<path.samples.length-1;i+=step){
    const a = path.samples[i], b = path.samples[Math.min(i+step,path.samples.length-1)];
    const ta = path.tangents[i];
    const mid = a.clone().lerp(b,0.5);
    const overWater = inRiverWorld(mid.x, mid.z);
    if(overWater) bridgeSamples.push(i);
    const pa = new THREE.Vector3(ta.z,0,-ta.x);
    const al = a.clone().addScaledVector(pa,-halfW);
    const ar = a.clone().addScaledVector(pa, halfW);
    const bl = b.clone().addScaledVector(pa,-halfW);
    const br = b.clone().addScaledVector(pa, halfW);
    al.y = ar.y = bl.y = br.y = 0.145;
    const palette = overWater ? WOOD : SAND;
    const c = C(palette[(i*7 + i>>2) % palette.length]);
    const c2 = C(palette[(i*3 + 2) % palette.length]);
    push(al,c); push(ar,c); push(bl,c2);
    push(bl,c2); push(ar,c); push(br,c2);

    if(!overWater && i%(step*3)===0){
      const sgn = (i%2===0) ? 1 : -1;
      const edge = (sgn>0?ar.clone():al.clone());
      edge.y = 0.10;
      pathBorderPositions.push({x:edge.x, z:edge.z, s:rand(0.16,0.34), c:pick(STONE)});
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols,3));
  const normals = new Float32Array(verts.length);
  for(let i=0;i<normals.length;i+=3){ normals[i]=0; normals[i+1]=1; normals[i+2]=0; }
  geo.setAttribute('normal', new THREE.BufferAttribute(normals,3));
  geo.computeBoundingSphere();
  const mat = new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide});
  const ribbon = new THREE.Mesh(geo, mat);
  ribbon.receiveShadow = true;
  scene.add(ribbon);

  if(bridgeSamples.length){
    const i0 = bridgeSamples[0];
    const i1 = bridgeSamples[bridgeSamples.length-1];
    const p0 = path.samples[i0].clone();
    const p1 = path.samples[Math.min(i1+step, path.samples.length-1)].clone();
    bridgeInfo = { p0, p1, mid:p0.clone().lerp(p1,0.5) };
  }
}

  };
  const waterMat = new THREE.ShaderMaterial({
    uniforms:waterUniforms,
    transparent:true,
    side:THREE.DoubleSide,
    depthWrite:true,
    vertexShader:`
      uniform float uTime;
      varying vec3 vWorld;
      varying float vFogDepth;
      void main(){
        vec3 p = position;
        p.y += sin(p.x*0.9 + uTime*1.6)*0.045 + sin(p.z*0.55 - uTime*1.1)*0.04;
        vec4 wp = modelMatrix * vec4(p,1.0);
        vWorld = wp.xyz;
        vec4 mv = viewMatrix * wp;
        vFogDepth = -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:`
      uniform float uTime;
      uniform vec3 uFogColor;
      uniform float uFogNear, uFogFar;
      varying vec3 vWorld;
      varying float vFogDepth;
      void main(){
        float ripple = sin(vWorld.x*1.15 + vWorld.z*0.75 + uTime*1.5)*0.5+0.5;
        float ripple2 = sin(vWorld.z*2.1 - uTime*2.2 + sin(vWorld.x*0.9))*0.5+0.5;
        vec3 deep = vec3(0.085,0.26,0.36);
        vec3 shallow = vec3(0.20,0.48,0.53);
        vec3 c = mix(deep, shallow, ripple*0.4 + 0.28);
        float foam = smoothstep(0.86, 1.0, ripple2) * 0.34;
        c = mix(c, vec3(0.72,0.86,0.85), foam);
        float sparkle = pow(max(0.0,sin(vWorld.x*7.0 + uTime*3.0)*sin(vWorld.z*6.3 - uTime*2.0)), 12.0)*0.3;
        c += sparkle;
        float fogF = smoothstep(uFogNear, uFogFar, vFogDepth);
        c = mix(c, uFogColor, fogF);
        gl_FragColor = vec4(c, 0.94);
      }`
  });
  MAT.water = waterMat;
  const water = new THREE.Mesh(geo, waterMat);

  const foam = new THREE.InstancedMesh(foamGeo,foamMat,46);

  }

      f.z += f.spd*dt*2.0;
      if(f.z>53){ f.z=-53; f.off=rand(-2.1,2.1); }
      const gz = tileZ(f.z);

      fd.scale.set(f.s,1,f.s);

const treeVariants = [0,1,2,3].map(k => ({kind:k, geo:treeGeometry(k), mats:[]}));
function placeTrees(){
  const variantSlots = [[],[],[],[]];
  const occupied = [];
  function valid(x,z,minPath=5.2){
    if(path.distTo(x,z) < minPath) return false;
    if(inRiverWorld(x,z)) return false;
    if(Math.hypot(x-VILLAGE.x,z-VILLAGE.z) < 18.0) return false;
    if(Math.hypot(x-CASTLE.x,z-CASTLE.z) < 13) return false;
    if(slotDist(x,z) < 6.4) return false;
    for(const o of occupied){ if(Math.hypot(x-o.x,z-o.z) < 2.6) return false; }
    return true;
  }
  let attempts = 0;
  while(attempts++ < 2600 && occupied.length < 280){
    const gx = rand(T_GX0+2, T_GX1-2);
    const gz = rand(T_GZ0+2, T_GZ1-2);
    const x = worldX(gx), z = worldZ(gz);
    const outer = Math.max(Math.abs(x), Math.abs(z)) > 56;
    const edge = (gx<T_GX0+5||gx>T_GX1-5||gz<T_GZ0+5||gz>T_GZ1-5);
    if(!valid(x,z, edge?2.8:5.6)) continue;
    const m = metaAt(Math.round(gx), Math.round(gz));
    if(!m || m.river) continue;
    let kind = (rng()<0.34)?0:((rng()<0.66)?1:((rng()<0.82)?2:3));
    if(z > 28 || x < -38) kind = rng()<0.65?2:0;
    const scale = rand(0.68,1.25) * (kind===0?1.1:1.0) * (outer?rand(1.1,1.5):1);
    occupied.push({x,z});
    variantSlots[kind].push({x,y:m.top, z, scale, rot:rand(0,Math.PI*2)});
  }
  // dark forest belt around the horizon
  for(let i=0;i<130;i++){
    const a = rand(0,Math.PI*2);
    const r = rand(58,84);
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    if(path.distTo(x,z) < 3.6 || inRiverWorld(x,z)) continue;
    if(Math.hypot(x-CASTLE.x,z-CASTLE.z) < 12.5) continue;
    if(Math.hypot(x-VILLAGE.x,z-VILLAGE.z) < 18) continue;
    const gx = Math.round(tileX(x)), gz = Math.round(tileZ(z));
    const m = metaAt(gx,gz);
    if(!m || m.river) continue;
    const kind = rng()<0.5?0:2;
    variantSlots[kind].push({x, y:m.top, z, scale:rand(1.2,2.1), rot:rand(0,6.28)});
  }
  // wild outer woods on the meadow shelf
  for(let i=0;i<150;i++){
    const a=rand(0,Math.PI*2);
    const r=rand(86,138);
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    const kind=rng()<0.5?0:(rng()<0.72?2:(rng()<0.9?1:3));
    variantSlots[kind].push({x, y:-0.03, z, scale:rand(1.35,2.35), rot:rand(0,6.28)});
  }
  const dummy = new THREE.Object3D();
  treeVariants.forEach((v,vi)=>{
    const items = variantSlots[vi];
    if(!items.length) return;
    const mat = new THREE.MeshLambertMaterial({vertexColors:true});
    const mesh = new THREE.InstancedMesh(v.geo, mat, items.length);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.frustumCulled = false;
    items.forEach((it,i)=>{
      dummy.position.set(it.x,it.y,it.z);
      dummy.rotation.set(0,it.rot,0);
      dummy.scale.setScalar(it.scale);
      dummy.updateMatrix();
      mesh.setMatrixAt(i,dummy.matrix);
      const tint = 0.92 + rand(0,0.16);
      mesh.setColorAt(i, new THREE.Color(tint, tint*rand(.98,1.03), tint));
    });
    mesh.instanceMatrix.needsUpdate = true;
    if(mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    scene.add(mesh);
  });
}

const cloudGroups = (()=>{
  const groups=[];
  for(let i=0;i<cloudMesh.data.length;){

    while(i<cloudMesh.data.length && cloudMesh.data[i].cy===b.cy && cloudMesh.data[i].cx===b.cx && cloudMesh.data[i].cz===b.cz){

// distant mountains — blocky height-field ridges on the horizon
{
  const arr=[];
  const peaks=[];
  for(let i=0;i<26;i++){
    const a=(i/26)*Math.PI*2 + rand(-.07,.07);
    const r=rand(170,265);
    const cx=Math.cos(a)*r, cz=Math.sin(a)*r;
    const baseH=rand(24,52);
    const baseR=rand(30,46);
    const centers=[{x:cx,z:cz,H:baseH,R:baseR}];
    const subCount=1+((rng()*2)|0);
    for(let s=0;s<subCount;s++){
      const aa=rand(0,Math.PI*2);
      const dist=rand(baseR*.25,baseR*.7);
      centers.push({
        x:cx+Math.cos(aa)*dist, z:cz+Math.sin(aa)*dist,
        H:baseH*rand(.4,.72), R:baseR*rand(.5,.8)
      });
    }
    peaks.push({center:{x:cx,z:cz}, R:baseR, H:baseH, centers});
  }
  const step=6;
  for(const peak of peaks){
    const center=peak.center;
    for(let ox=-peak.R*1.6; ox<=peak.R*1.6; ox+=step){
      for(let oz=-peak.R*1.6; oz<=peak.R*1.6; oz+=step){
        const wx=center.x+ox, wz=center.z+oz;
        let h=0;
        for(const c of peak.centers){
          const d=Math.hypot(wx-c.x, wz-c.z);
          if(d<c.R){
            const hh=c.H*Math.pow(1-d/c.R,1.38);
            if(hh>h) h=hh;
          }
        }
        if(h<1.8) continue;
        h*=rand(.88,1.12);
        const rel=h/peak.H;
        let topCol,sideCol;
        if(rel>0.7){ topCol=pick(['#dfe7e2','#d4ded9','#e6ece7']); sideCol='#8c9da3'; }
        else if(rel>0.48){ topCol=pick(['#a3b2b5','#98a9ae','#adb9bb']); sideCol='#738792'; }
        else if(rel>0.25){ topCol=pick(['#8699a3','#7d919c','#90a0a8']); sideCol='#607581'; }
        else { topCol='#70848f'; sideCol='#526874'; }
        vox(arr, wx, -4.2, wz, step+0.15, h+0.2, step+0.15, topCol, sideCol, rand(0,0.2));
      }
    }
  }
  const mesh = meshOf(arr, false, false);
  mesh.frustumCulled=false;
  scene.add(mesh);
}

const dayOut = {
  top:new THREE.Color(), hor:new THREE.Color(), sun:new THREE.Color(), fog:new THREE.Color(),
  hemiSky:new THREE.Color(), hemiGround:new THREE.Color(), sunI:0, night:0, exp:1
};
function sampleDay(t){
  t = ((t%1)+1)%1;
  let a=dayKeys[0], b=dayKeys[1];
  for(let i=0;i<dayKeys.length-1;i++){
    if(t>=dayKeys[i].t && t<=dayKeys[i+1].t){ a=dayKeys[i]; b=dayKeys[i+1]; break; }
  }
  const f = smoothstep(a.t, b.t, t);
  dayOut.top.copy(a.topC).lerp(b.topC,f);
  dayOut.hor.copy(a.horC).lerp(b.horC,f);
  dayOut.sun.copy(a.sunC).lerp(b.sunC,f);
  dayOut.fog.copy(a.fogC).lerp(b.fogC,f);
  dayOut.hemiSky.copy(a.hemiSkyC).lerp(b.hemiSkyC,f);
  dayOut.hemiGround.copy(a.hemiGroundC).lerp(b.hemiGroundC,f);
  dayOut.sunI = lerp(a.sunI,b.sunI,f);
  dayOut.night = lerp(a.night,b.night,f);
  dayOut.exp = lerp(a.exp,b.exp,f);
  return dayOut;
}

const env = { time:0, dayT:START_DAY_T };
const sunDir = new THREE.Vector3();
const moonDir = new THREE.Vector3();
let dayShift = 0;

function updateEnvironment(t, dt){
  env.time = t;
  const dayT = (START_DAY_T + (t+dayShift)/DAY_LENGTH) % 1;
  env.dayT = dayT;
  const p = sampleDay(dayT);
  const angle = dayT*Math.PI*2;
  const elev = Math.sin(angle);
  const dayFactor = smoothstep(-0.06, 0.22, elev);
  const night = smoothstep(0.20, -0.18, elev);

  sunDir.set(Math.cos(angle+0.16)*0.75, Math.sin(angle), Math.sin(angle+0.16)*0.62).normalize();
  moonDir.copy(sunDir).multiplyScalar(-1);

  sun.position.copy(sunDir).multiplyScalar(125);
  sun.position.y = Math.max(sun.position.y, -40);
  sun.color.copy(p.sun);
  sun.intensity = p.sunI * (0.55 + 0.45*dayFactor);
  sun.castShadow = sun.intensity > 0.08;

  moon.position.copy(moonDir).multiplyScalar(130);
  moon.color.set(0x9db4e8);
  moon.intensity = 1.15*night;

  hemi.color.copy(p.hemiSky);
  hemi.groundColor.copy(p.hemiGround);
  hemi.intensity = lerp(0.75, 0.92, dayFactor);
  ambient.intensity = lerp(0.46, 0.15, dayFactor);

  renderer.toneMappingExposure = p.exp * (1 + night*0.05);

  skyUniforms.uTop.value.copy(p.top);
  skyUniforms.uHorizon.value.copy(p.hor);
  skyUniforms.uSunDir.value.copy(sunDir);
  skyUniforms.uSunColor.value.copy(p.sun);
  skyUniforms.uNight.value = night;

  scene.fog.color.copy(p.fog);
  scene.background.copy(p.fog);
  MAT.waterUniforms.uFogColor.value.copy(p.fog);

  const sunVis = smoothstep(-0.03, 0.03, elev);
  sunSprite.position.copy(sunDir).multiplyScalar(460);
  sunCore.position.copy(sunDir).multiplyScalar(460);
  sunSpriteMat.opacity = 0.82*sunVis;
  sunCoreMat.opacity = 0.85*sunVis;
  sunSpriteMat.color.copy(p.sun);
  sunCoreMat.color.set(0xfff8e4);
  moonSprite.position.copy(moonDir).multiplyScalar(440);
  moonMat.opacity = 0.8*night;
  starMat.opacity = night*0.88;

  skyRig.position.copy(camera.position);

  MAT.window.color.setRGB(
    lerp(0.22, 1.0, night)*0.95,
    lerp(0.16, 0.73, night)*0.95,
    lerp(0.11, 0.34, night)*0.95
  );
  MAT.window.color.multiplyScalar(1.05);

  // clouds drift
  cloudGroups.forEach(g => { g.x += g.speed*dt*2.2; if(g.x > 250) g.x = -250; });
  cloudClusters.length = 0;
  const dummy = cloudMesh.dummy;
  cloudGroups.forEach(g=>{
    g.indices.forEach(i=>{
      const b=cloudMesh.data[i];
      b.cx = g.x;
      dummy.position.set(g.x+b.ox, b.cy+b.oy, b.cz+b.oz);
      dummy.scale.set(b.sx,b.sy,b.sz);
      dummy.updateMatrix();
      cloudMesh.mesh.setMatrixAt(i,dummy.matrix);
    });
  });
  cloudMesh.mesh.instanceMatrix.needsUpdate = true;

  // birds
  birds.forEach((b,i)=>{
    b.a += b.speed*dt;
    birdDummy.position.set(Math.cos(b.a)*b.r, b.y+Math.sin(t*.4+b.ph)*2.0, Math.sin(b.a)*b.r);
    birdDummy.rotation.set(0, -b.a+Math.PI/2, Math.sin(t*2+b.ph)*0.15);
    birdDummy.scale.setScalar(b.s);
    birdDummy.updateMatrix();
    window.__birdsMesh.setMatrixAt(i,birdDummy.matrix);
  });
  window.__birdsMesh.instanceMatrix.needsUpdate = true;

  MAT.waterUniforms.uTime.value = t;
  if(window.__updateFoam) window.__updateFoam(t, dt);

  if(portalGlowMat){
    portalGlowMat.opacity = 0.16 + 0.13*Math.sin(t*2.4) + night*0.11;
  }

  // windmill
  animatedBlades.forEach(g=>{ g.rotation.z -= dt*0.55; });
}

// ---------------------------------------------------------------- particle fields
class ParticleField {
  constructor(count, material, castShadow=false){
    this.count=count;
    this.cursor=0;
    this.colorDirty=false;
    this.dummy=new THREE.Object3D();
    this.geo=new THREE.BoxGeometry(1,1,1);
    this.mesh=new THREE.InstancedMesh(this.geo, material, count);
    this.mesh.frustumCulled=false;
    this.mesh.castShadow=castShadow;
    this.mesh.receiveShadow=false;
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(count*3),3);
    for(let i=0;i<count;i++){
      this.mesh.setColorAt(i,WHITE);
      this.dummy.position.set(0,-999,0);
      this.dummy.scale.setScalar(0);
      this.dummy.updateMatrix();
      this.mesh.setMatrixAt(i,this.dummy.matrix);
    }
    this.mesh.instanceMatrix.needsUpdate=true;
    this.mesh.instanceColor.needsUpdate=true;
    this.pool=[];
    for(let i=0;i<count;i++){
      this.pool.push({idx:i, active:false, pos:new THREE.Vector3(), vel:new THREE.Vector3(),
        rot:new THREE.Vector3(), rotVel:new THREE.Vector3(), color:new THREE.Color(),
        size:1, grow:0, life:0, maxLife:1, gravity:0, drag:0, bounce:0, floorY:null, shrink:1});
    }
    scene.add(this.mesh);
  }
  spawn(o){
    const p=this.pool[this.cursor];
    this.cursor=(this.cursor+1)%this.count;
    p.active=true;
    p.pos.copy(o.pos);
    p.vel.copy(o.vel || tmpV.set(0,0,0));
    p.rot.set(o.rx ?? rand(0,6.28), o.ry ?? rand(0,6.28), o.rz ?? rand(0,6.28));
    p.rotVel.set(o.rvx ?? rand(-4,4), o.rvy ?? rand(-4,4), o.rvz ?? rand(-4,4));
    p.color.copy(o.color || WHITE);
    p.size=o.size ?? 0.3;
    p.grow=o.grow ?? 0;
    p.life=o.life ?? 1;
    p.maxLife=p.life;
    p.gravity=o.gravity ?? 0;
    p.drag=o.drag ?? 0;
    p.bounce=o.bounce ?? 0;
    p.floorY=o.floorY ?? null;
    p.shrink=o.shrink ?? 1;
    p.stretch=o.stretch || 1;
    this.mesh.setColorAt(p.idx,p.color);
    this.colorDirty=true;
  }
  clear(){
    for(const p of this.pool){
      p.active=false;
      this.dummy.position.set(0,-999,0); this.dummy.scale.setScalar(0); this.dummy.updateMatrix();
      this.mesh.setMatrixAt(p.idx,this.dummy.matrix);
    }
    this.mesh.instanceMatrix.needsUpdate=true;
  }
  update(dt){
    let any=false;
    for(const p of this.pool){
      if(!p.active) continue;
      any=true;
      p.life-=dt;
      if(p.life<=0){
        p.active=false;
        this.dummy.position.set(0,-999,0); this.dummy.scale.setScalar(0); this.dummy.updateMatrix();
        this.mesh.setMatrixAt(p.idx,this.dummy.matrix);
        continue;
      }
      p.vel.y -= p.gravity*dt;
      if(p.drag>0) p.vel.multiplyScalar(Math.exp(-p.drag*dt));
      p.pos.addScaledVector(p.vel,dt);
      if(p.floorY!==null && p.pos.y<p.floorY){
        p.pos.y=p.floorY;
        if(p.bounce>0){ p.vel.y=Math.abs(p.vel.y)*p.bounce; p.vel.x*=0.72; p.vel.z*=0.72; }
        else { p.vel.y=0; p.vel.x*=0.72; p.vel.z*=0.72; }
      }
      p.rot.x+=p.rotVel.x*dt; p.rot.y+=p.rotVel.y*dt; p.rot.z+=p.rotVel.z*dt;
      const age=1-p.life/p.maxLife;
      let s=p.size*(1 + p.grow*age);
      const fade=0.3;
      if(age>1-fade) s*=Math.max(0,(1-age)/fade);
      p.shrink=s;
      this.dummy.position.copy(p.pos);
      this.dummy.rotation.set(p.rot.x,p.rot.y,p.rot.z);
      this.dummy.scale.set(s, s*(p.stretch||1), s);
      this.dummy.updateMatrix();
      this.mesh.setMatrixAt(p.idx,this.dummy.matrix);
    }
    if(any) this.mesh.instanceMatrix.needsUpdate=true;
    if(this.colorDirty){ this.mesh.instanceColor.needsUpdate=true; this.colorDirty=false; }
  }
}

function updateVillagers(t){
  for(const v of villagers){

    const x=VILLAGE.x+Math.cos(ang)*v.rad;
    const z=VILLAGE.z+Math.sin(ang)*v.rad;
    v.grp.position.set(x, 0.06+Math.abs(Math.sin(t*3.2+v.phase))*0.025, z);
    const dx=-Math.sin(ang)*Math.sign(v.speed), dz=Math.cos(ang)*Math.sign(v.speed);
    v.grp.rotation.y=Math.atan2(dx,dz);
    const s=Math.sin(t*5.5+v.phase)*.45;
    v.legL.rotation.x=s;
    v.legR.rotation.x=-s;
  }
}

function updateAtmosphere(t,dt){
  const night=env.night ?? 0;
  const nf=clamp(1-Math.abs((env.dayT*2)%2-1),0,1);
  const darkness=smoothstep(0.35,0.9,1-Math.max(0,Math.sin(env.dayT*Math.PI*2)));
  let fireCount=0;
  for(const e of torchEmitters){
    e.accum+=dt;
    const rate=e.rate*(1.2);
    if(e.accum>rate){
      e.accum=0;
      fireCount++;
      if(fireCount<6){
        fireField.spawn({
          pos:new THREE.Vector3(e.pos.x+rand(-.08,.08), e.pos.y+rand(-.05,.08), e.pos.z+rand(-.08,.08)),
          vel:new THREE.Vector3(rand(-.25,.25),rand(.8,1.7),rand(-.25,.25)),
          color:C(pick(['#ff7b2e','#ffb347','#ffd47a','#ff9f3c'])),
          size:rand(.12,.25)*e.scale, life:rand(.35,.75), gravity:-0.5, drag:1.3, shrink:1
        });
        if(rng()<0.12) smokePuff(e.pos,1,.35,'#a09787',1.2);
      }
    }
  }
  for(const e of chimneyEmitters){
    e.accum+=dt;
    if(e.accum>e.rate){
      e.accum=0;
      smokePuff(e.pos,1,rand(.5,.9),'#a6a196',rand(2.5,4.0));
    }
  }
  // campfire
  if(rng()<dt*12){
    fireField.spawn({
      pos:new THREE.Vector3(campfirePos.x+rand(-.4,.4), campfirePos.y+rand(-.1,.25), campfirePos.z+rand(-.4,.4)),
      vel:new THREE.Vector3(rand(-.7,.7),rand(1.6,3.4),rand(-.7,.7)),
      color:C(pick(['#ff7b2e','#ffb347','#ffd47a','#ff5a1f'])),
      size:rand(.28,.66), life:rand(.45,1.0), gravity:-.8, drag:1.1, shrink:1
    });
    if(rng()<0.13) smokePuff(campfirePos,1,rand(.8,1.4),'#9e9385',3.6);
  }
  campfireLight.intensity=0.6+0.35*Math.sin(t*9.3)+0.15*Math.sin(t*23.1);
  campfireLight.color.setHSL(0.065,0.85,0.55);
  campfireGlowMat.opacity=0.2+darkness*0.35+0.08*Math.sin(t*11.3);
  campfireGlow.scale.setScalar(5.0+0.5*Math.sin(t*8.7));
  gateLight.intensity=0.35+0.18*Math.sin(t*7.1+1.2);
  const glowStrength=0.32+0.56*darkness;
  torchGlows.forEach((g,i)=>{
    g.mat.opacity=glowStrength*(0.86+0.18*Math.sin(t*8.5+g.phase))+0.05;
    g.spr.scale.setScalar(g.base*(0.92+0.1*Math.sin(t*11+g.phase)));
  });

  // fireflies
  fireflies.material.opacity=darkness*0.85;
  fireflies.visible=darkness>0.02;
  for(let i=0;i<fireflyData.length;i++){
    const f=fireflyData[i];
    fireflyDummy.position.set(
      f.base.x+Math.sin(t*f.sp+f.ph)*f.amp,
      f.base.y+Math.sin(t*f.sp*1.7+f.ph*2)*.5,
      f.base.z+Math.cos(t*f.sp*.8+f.ph)*f.amp
    );
    const size=0.6+0.4*Math.sin(t*3+f.ph);
    fireflyDummy.scale.setScalar(size);
    fireflyDummy.updateMatrix();
    fireflies.setMatrixAt(i,fireflyDummy.matrix);
  }
  fireflies.instanceMatrix.needsUpdate=true;

  // flags
  for(let i=0;i<flagMeshes.length;i++){
    const f=flagMeshes[i];
    const pos=f.mesh.geometry.attributes.position;
    for(let v=0;v<pos.count;v++){
      const x=f.base[v*3];
      const y=f.base[v*3+1];
      const wave=Math.sin(x*3.1 - t*4.5 + f.phase) * 0.13 * clamp(x,0,3);
      pos.setZ(v, f.base[v*3+2] + wave);
    }
    pos.needsUpdate=true;
  }

  // portal pulse handled in environment; add occasional spawn rune glow
}

const contactScale={runner:.48,brute:.95,knight:.62,bat:.52,boss:1.8};
function updateContactShadows(){
  let n=0;
  for(const e of enemies){
    if(!e.alive || n>=80) continue;
    const s=contactScale[e.type]||.5;
    contactDummy.position.set(e.group.position.x, groundYAt(e.group.position.x,e.group.position.z)+0.035, e.group.position.z);
    contactDummy.rotation.set(-Math.PI/2,0,0);
    contactDummy.scale.set(s,s,s);
    contactDummy.updateMatrix();
    contactShadowMesh.setMatrixAt(n,contactDummy.matrix);
    n++;
  }
  contactShadowMesh.count=n;
  contactShadowMesh.instanceMatrix.needsUpdate=true;
}
function updateHealthBars(){
  let n=0;
  camera.updateMatrixWorld();
  barRight.setFromMatrixColumn(camera.matrixWorld,0).normalize();
  for(const e of enemies){
    if(!e.alive) continue;
    if(n>=80) break;
    const frac=clamp(e.hp/e.hpMax,0,1);
    const w=e.barW, h=e.barH;
    const center=e.group.position.clone();
    center.y += e.barOffset;
    const bgPos=center;
    barDummy.position.copy(bgPos);
    barDummy.quaternion.copy(camera.quaternion);
    barDummy.scale.set(w+0.13,h+0.09,1);
    barDummy.updateMatrix();
    barBG.setMatrixAt(n,barDummy.matrix);
    barBG.setColorAt(n, new THREE.Color(0x0d0c0a));

    const fw=w*frac;
    const fillPos=center.clone().addScaledVector(barRight, -w*0.5 + fw*0.5);
    barDummy.position.copy(fillPos);
    barDummy.quaternion.copy(camera.quaternion);
    barDummy.scale.set(Math.max(0.001,fw),h,1);
    barDummy.updateMatrix();
    barFill.setMatrixAt(n,barDummy.matrix);
    const col=new THREE.Color();
    if(frac>0.55) col.setHex(0x66c447);
    else if(frac>0.28) col.setHex(0xe6b23d);
    else col.setHex(0xe35339);
    barFill.setColorAt(n,col);
    n++;
  }
  barBG.count=n; barFill.count=n;
  barBG.instanceMatrix.needsUpdate=true; barFill.instanceMatrix.needsUpdate=true;
  if(barBG.instanceColor) barBG.instanceColor.needsUpdate=true;
  if(barFill.instanceColor) barFill.instanceColor.needsUpdate=true;
}

function spawnEnemy(type, startD, wave, opts={}){
  const def=ENEMY_TYPES[type];

  if(!def) throw new Error('bad enemy '+type);
  const group=new THREE.Group();

  mat.emissive.setHex(def.emissive);
  const body=new THREE.Mesh(asset.bodyGeo, mat);
  body.castShadow=true;
  group.add(body);
  const legs=[], arms=[];
  if(asset.legGeo){
    for(const s of [-1,1]){
      const m=new THREE.Mesh(asset.legGeo,mat);
      m.position.set(asset.legX*s,asset.legY,0);
      m.castShadow=false;
      group.add(m); legs.push(m);
    }
  }
  if(asset.armGeo){
    for(const s of [-1,1]){
      const m=new THREE.Mesh(asset.armGeo,mat);
      m.position.set(asset.armX*s,asset.armY,0);
      m.castShadow=false;
      group.add(m); arms.push(m);
    }
  }
  let wingL=null, wingR=null;
  if(asset.wingGeo){
    wingR=new THREE.Mesh(asset.wingGeo,mat);
    wingR.position.set(.22,.12,0);
    group.add(wingR);
    wingL=new THREE.Mesh(asset.wingGeo,mat);
    wingL.position.set(-.22,.12,0);
    wingL.scale.x=-1;
    group.add(wingL);
  }
  if(asset.eyeGeo){
    const eyes=new THREE.Mesh(asset.eyeGeo,EYE_MAT);
    group.add(eyes);
  }
  let aura=null;
  if(type==='boss'){
    aura=addGlowSprite(group,'#b25cff',9,0.2,2.4);
  }
  const hpScale=1 + 0.40*(wave-1) + 0.110*(wave-1)*(wave-1);
  const hp=def.hp*hpScale*(opts.hpMul||1);
  const baseScale=type==='boss'?1.22:1;
  const enemy={
    id:++enemyIdCounter, type, group, mat, legs, arms, wingL, wingR, def, asset, baseScale, aura,
    hp, hpMax:hp, speed:def.speed*(1+Math.min(0.12,(wave-1)*0.012)),
    pathDist:startD, offset: def.fly ? rand(-1.7,1.7) : rand(-.72,.72),
    gold:Math.round(def.gold*(1+(wave-1)*0.10)), damage:def.damage,
    fly:def.fly, alive:true, anim:rand(0,6), hitFlash:0,
    slowTime:0, slowFactor:0, burnTime:0, burnDps:0, burnTick:0,
    barW:def.barW*baseScale, barH:0.21*baseScale, barOffset:def.barOffset*baseScale, spawnT:opts.instant?0:0.4,
    phase:rand(0,6.28), wave, tangent:new THREE.Vector3(0,0,1), material:mat
  };
  if(opts.damaged) enemy.hp *= opts.damaged;
  group.scale.setScalar(opts.instant?baseScale:0.25*baseScale);
  enemies.push(enemy);
  scene.add(group);
  placeEnemy(enemy,0,true);
  if(opts.portal){
    const pos=group.position.clone();
    spawnGlow(pos,'#b58cff',4.5,0.5,0.7);
    burstSparks(pos,'#a77bff',7,4,.5,6);
  }
  return enemy;
}

function placeEnemy(e, dt, instant=false){
  const s=path.at(e.pathDist);
  e.tangent.copy(s.tan);
  const perpX=s.tan.z, perpZ=-s.tan.x;
  const x=s.pos.x+perpX*e.offset;
  const z=s.pos.z+perpZ*e.offset;
  let y=0.14;
  if(e.fly) y += 3.25 + Math.sin(env.time*2.2+e.phase)*0.32;
  e.group.position.set(x,y,z);
  const yaw=Math.atan2(s.tan.x,s.tan.z);
  e.group.rotation.y = instant ? yaw : angleLerp(e.group.rotation.y,yaw,1-Math.exp(-dt*8));
}

function removeEnemyObject(e){
  scene.remove(e.group);
  e.material.dispose();
  if(e.aura) e.aura.material.dispose();
}

function killEnemy(e){
  if(!e.alive) return;
  e.alive=false;
  run.kills++;
  const reward=Math.max(1,Math.round(e.gold*(1+run.wave*0.03)));
  run.gold += reward;
  const pos=e.group.position.clone();
  pos.y += e.type==='boss'?2.5:0.9;
  const floorY=groundYAt(pos.x,pos.z)+0.06;
  burstDebris(pos, e.def.palette, e.type==='boss'?48:(e.type==='brute'?26:17), e.type==='boss'?9:5.2, floorY);
  popCoins(pos, e.type==='boss'?18:(e.type==='brute'?8:4));
  burstSparks(pos,'#ffd77e',e.type==='boss'?36:8,e.type==='boss'?14:6,.6,9);
  smokePuff(pos,e.type==='boss'?8:2,e.type==='boss'?2.4:0.9,'#a69a8c',2.2);
  spawnGlow(pos,e.type==='boss'?'#ff8a4a':'#ffd184',e.type==='boss'?12:3.2,e.type==='boss'?0.8:0.3,0.8);
  if(e.type==='boss'){
    addShake(1.0);
    spawnRing(pos,'#ff8d52',12,0.8);
    for(let i=0;i<4;i++){
      setTimeout(()=>{ if(run.phase==='running') burstFire(new THREE.Vector3(pos.x+rand(-3,3),pos.y+rand(-2,2),pos.z+rand(-3,3)),'#ff8a3c',12,6,.7,.6); }, i*90);
    }
  } else if(e.type==='brute'){
    addShake(0.22);
  }
  if(enemies.length<2) setTicker('lane cleared · +'+reward+' gold','✦');
  removeEnemyObject(e);
}

function leakEnemy(e){
  if(!e.alive) return;
  e.alive=false;
  const gate=new THREE.Vector3(CASTLE_GATE.x-1.1, 1.7, CASTLE_GATE.z);
  burstDebris(e.group.position, e.def.palette, 15, 5.5, groundYAt(e.group.position.x,e.group.position.z)+0.06);
  burstFire(gate,'#ff7b3a',14,7,.7,.7);
  burstSparks(gate,'#ffca7a',16,10,.65,12);
  smokePuff(gate,5,1.7,'#8c8175',2.2);
  spawnGlow(gate,'#ff7138',7.5,0.55,0.9);
  spawnRing(new THREE.Vector3(CASTLE_GATE.x-2,0.2,CASTLE_GATE.z),'#ff6a3a',7,0.6);
  addShake(e.type==='boss'?1.1:0.45);
  damageCastle(e.damage, e);
  removeEnemyObject(e);
}

function damageEnemy(e, dmg, source){
  if(!e.alive) return;
  e.hp -= dmg;
  e.hitFlash=Math.max(e.hitFlash,0.16);
  if(e.hp<=0){
    killEnemy(e);
  }
}

function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(!e.alive){ enemies.splice(i,1); continue; }
    if(e.spawnT>0){
      e.spawnT-=dt;
      e.group.scale.setScalar(lerp(e.group.scale.x,e.baseScale,1-Math.exp(-dt*10)));
    }
    // statuses
    if(e.slowTime>0){ e.slowTime-=dt; }
    if(e.burnTime>0){
      e.burnTime-=dt;
      e.burnTick-=dt;
      if(e.burnTick<=0){
        e.burnTick=0.45;
        damageEnemy(e, e.burnDps*0.45, 'burn');
        if(!e.alive){ enemies.splice(i,1); continue; }
        if(rng()<0.5){
          burstFire(new THREE.Vector3(e.group.position.x+rand(-.3,.3),e.group.position.y+rand(.2,1.2),e.group.position.z+rand(-.3,.3)),'#ff9b45',1,1.5,.4,.28,-1);
        }
      }
    }
    const slowMult=e.slowTime>0 ? (1-e.slowFactor) : 1;
    e.pathDist += e.speed*slowMult*dt;
    if(e.pathDist>=path.length-0.7){ leakEnemy(e); enemies.splice(i,1); continue; }
    placeEnemy(e,dt);
    e.anim += dt*e.def.animRate*(e.type==='boss'?1:1+slowMult*0.3);
    const amp=e.type==='brute'?0.45:(e.type==='boss'?0.22:0.6);
    const swing=Math.sin(e.anim)*(e.fly?0.2:amp);
    if(e.legs.length){ e.legs[0].rotation.x=swing; e.legs[1].rotation.x=-swing; }
    if(e.arms.length){ e.arms[0].rotation.x=-swing*0.7; e.arms[1].rotation.x=swing*0.7; }
    if(e.wingL){
      const flap=0.25+Math.sin(e.anim*2.1)*0.7;
      e.wingL.rotation.z=flap;
      e.wingR.rotation.z=-flap;
    }
    // bob body / group
    let bobY=0;
    if(e.fly) bobY=Math.sin(e.anim*1.7+e.phase)*0.08;
    else bobY=Math.abs(Math.sin(e.anim))*e.def.bob;
    e.group.position.y += bobY;
    e.hitFlash=Math.max(0,e.hitFlash-dt);
    let er=0,eg=0,eb=0;
    if(e.hitFlash>0){
      const f=e.hitFlash/0.16;
      er=eg=eb=f*0.85;
    } else if(e.burnTime>0){
      er=0.32; eg=0.10; eb=0.02;
    } else if(e.slowTime>0){
      er=0.01; eg=0.03; eb=0.12;
    } else if(e.type==='boss'){
      er=0.06; eg=0.01; eb=0.03;
    }
    e.mat.emissive.setRGB(er,eg,eb);
    if(e.aura) e.aura.material.opacity=0.13+0.07*Math.sin(elapsed*3.4+e.phase);
  }
}

  vox(crystal,0,-.3,0,.65,.6,.65,ice,iceD,Math.PI/4);
  vox(crystal,0,.3,0,.5,.48,.5,'#d9f4fa',iceD,Math.PI/4);
  vox(crystal,0,.78,0,.3,.42,.3,'#ecfbff',iceD,Math.PI/4);
  const crystalMesh=meshOf(crystal,true,false);
  crystalGroup.add(crystalMesh);
  pivot.add(crystalGroup);
  const spinNodes=[];
  const ringCount=level>=4?3:(level>=3?2:1);
  for(let r=0;r<ringCount;r++){
    const ringGroup=new THREE.Group();
    const rp=[];
    const rad=.95+r*.28;
    for(let i=0;i<8;i++){
      const a=(i/8)*Math.PI*2;
      vox(rp,Math.cos(a)*rad,Math.sin(a)*rad,0,.34,.12,.12,ice,iceD,a);
    }
    const rm=meshOf(rp,false,false);
    ringGroup.add(rm);
    ringGroup.rotation.z=rand(0,3);
    ringGroup.rotation.x=rand(-.4,.4);
    pivot.add(ringGroup);
    spinNodes.push({node:ringGroup,speed:rand(.7,1.4)*(r%2?-1:1)});
  }
  // hanging shards
  for(let i=0;i<(level>=3?6:3);i++){
    const a=(i/Math.max(3,level>=3?6:3))*Math.PI*2;
    vox(head,Math.cos(a)*1.15,-.15+Math.sin(a*2)*.2,Math.sin(a)*1.15,.16,.6,.16,ice,iceD,rand(0,3));
  }
  const headMesh=meshOf(head,false,false);
  pivot.add(headMesh);
  const glow=addGlowSprite(pivot,'#b9efff',3.2,0.75,0);
  const muzzle=new THREE.Object3D(); muzzle.position.set(0,0,0); pivot.add(muzzle);
  group.add(meshOf(base));
  group.add(pivot);
  return {group, head:pivot, muzzle, crystalGroup, spinNodes, glow, glowMat:glow.material, level, height:H+2.0, type:'frost'};
}

  for(const s of [-1,1]){

    vox(base,s*.38,.7,0,.1,1.0,.1,copperD,'#54321f');

  for(let i=0;i<4;i++){

    vox(prongs,Math.cos(a)*.72,0,Math.sin(a)*.72,.13,.7,.13,copper,copperD);

  const muzzle=new THREE.Object3D(); muzzle.position.set(0,0,0); pivot.add(muzzle);
  group.add(meshOf(base));
  group.add(pivot);
  return {group, head:pivot, muzzle, orb, orbMat, glow, glowMat:glow.material, level, height:H+1.8, type:'tesla'};
}
