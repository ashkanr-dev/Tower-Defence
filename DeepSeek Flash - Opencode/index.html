const TOWER_BUILDERS = {arrow:buildArrowTower, cannon:buildCannonTower, frost:buildFrostTower, tesla:buildTeslaTower, flame:buildFlameTower};

let towers=[];
let towerIdCounter=0;

function makeTower(type, level, slot){
  const built=TOWER_BUILDERS[type](level);
  const group=built.group;
  group.position.set(slot.pos.x,0.5,slot.pos.z);
  group.scale.setScalar(1.12);
  scene.add(group);
  group.traverse(o=>{
    if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; }
  });
  const def=TOWER_TYPES[type];
  const tower={
    id:++towerIdCounter, type, level, slot, group, head:built.head, muzzle:built.muzzle,
    barrel:built.barrel, crystalGroup:built.crystalGroup, spinNodes:built.spinNodes,
    orb:built.orb, orbMat:built.orbMat, glow:built.glow, glowMat:built.glowMat,
    cd:0.25+rand(0,0.35), target:null, yaw:rand(-Math.PI,Math.PI),
    def, range:def.range[level-1], damage:def.damage?def.damage[level-1]:0,
    cooldown:def.cooldown?def.cooldown[level-1]:0,
    recoil:0, firePulse:0, idle:rand(0,6.28), flameTick:0,
    totalDamage:0
  };
  slot.tower=tower;
  towers.push(tower);
  return tower;
}

function disposeTower(tower){
  scene.remove(tower.group);
  tower.group.traverse(o=>{
    if(o.isMesh && o.geometry) o.geometry.dispose();
    if(o.isSprite && o.material) o.material.dispose();
  });
  if(tower.orbMat) tower.orbMat.dispose();
  tower.slot.tower=null;
}

function rebuildTower(tower){
  const type=tower.type, level=tower.level, slot=tower.slot;
  disposeTower(tower);
  towers=towers.filter(t=>t!==tower);
  makeTower(type, level, slot);
}

function upgradeCost(tower){
  return Math.round(TOWER_TYPES[tower.type].cost * (0.75 + tower.level*0.5));
}

function findTarget(tower){
  let best=null, bestScore=-1;
  for(const e of enemies){
    if(!e.alive) continue;
    if(!tower.def.air && e.fly) continue;
    const dx=e.group.position.x-tower.slot.pos.x;
    const dz=e.group.position.z-tower.slot.pos.z;
    const dy=(e.fly?e.group.position.y+0:e.group.position.y+1)-2;
    const d2=dx*dx+dz*dz+dy*dy;
    if(d2>tower.range*tower.range) continue;
    let score=e.pathDist + (e.type==='boss'?12:0);
    if(tower.type==='frost' && e.slowTime>0) score-=30;
    if(tower.type==='flame' && e.burnTime>0) score-=4;
    if(score>bestScore){ bestScore=score; best=e; }
  }
  return best;
}

function aimHead(tower, target, dt){
  let desiredYaw;
  if(target && target.alive){
    desiredYaw=Math.atan2(target.group.position.x-tower.slot.pos.x, target.group.position.z-tower.slot.pos.z);
  } else {
    tower.idle+=dt*0.22;
    desiredYaw=Math.atan2(path.at(tower.slot.d).tan.x, path.at(tower.slot.d).tan.z)+Math.sin(tower.idle)*0.4;
  }
  tower.head.rotation.y=angleLerp(tower.head.rotation.y,desiredYaw,1-Math.exp(-dt*7));
}

function muzzleWorld(tower,out){
  return tower.muzzle.getWorldPosition(out);
}

function updateTowers(dt){
  for(const tower of towers){
    const target=findTarget(tower);
    tower.target=target;
    aimHead(tower,target,dt);
    tower.cd-=dt;
    tower.firePulse=Math.max(0,tower.firePulse-dt*4);
    if(tower.recoil>0) tower.recoil=Math.max(0,tower.recoil-dt*5);
    if(tower.barrel){ tower.barrel.position.z=-tower.recoil*0.25; }
    if(tower.type==='frost'){
      if(tower.crystalGroup){
        tower.crystalGroup.rotation.y+=dt*0.9;
        tower.crystalGroup.position.y=Math.sin(elapsed*2.2+tower.idle)*0.12;
        tower.crystalGroup.rotation.z=Math.sin(elapsed*1.5+tower.idle)*0.08;
      }
      if(tower.spinNodes){
        for(const sn of tower.spinNodes){ sn.node.rotation.z+=sn.speed*dt; sn.node.rotation.y+=dt*0.3; }
      }
      if(tower.glowMat) tower.glowMat.opacity=0.55+0.16*Math.sin(elapsed*3+tower.idle);
    }
    if(tower.type==='tesla' && tower.orb){
      const pulse=1+Math.sin(elapsed*6+tower.idle)*0.1;
      tower.orb.scale.setScalar(pulse);
      tower.orbMat.color.setHSL(0.5+0.03*Math.sin(elapsed*2+tower.idle),1,0.65+0.1*Math.sin(elapsed*7));
      if(tower.glowMat) tower.glowMat.opacity=0.5+0.2*Math.sin(elapsed*8);
      if(rng()<dt*1.1){
        burstSparks(tower.muzzle.getWorldPosition(tmpV),'#8bf6ff',1,2.6,.35,4);
      }
    }
    if(tower.type==='flame'){
      if(tower.glowMat) tower.glowMat.opacity=0.45+0.15*Math.sin(elapsed*11+tower.idle);
    }
    if(run.phase!=='running') continue;
    if(!target){
      if(tower.type==='flame' && rng()<dt*7){
        const p=tower.muzzle.getWorldPosition(tmpV);
        fireField.spawn({pos:p.clone(),vel:new THREE.Vector3(rand(-.4,.4),rand(.6,1.6),rand(-.4,.4)),
          color:C(pick(['#ff8b3a','#ffc15e','#ff6b2e'])),size:rand(.12,.25),life:rand(.3,.6),gravity:-.6,drag:1.2,shrink:1});
      } else if(tower.type==='cannon' && rng()<dt*0.8){
        smokePuff(tower.muzzle.getWorldPosition(tmpV),1,.5,'#9e988b',1.6);
      } else if(tower.type==='frost' && rng()<dt*1.6){
        const p=tower.muzzle.getWorldPosition(tmpV);
        sparkField.spawn({pos:p.clone(),vel:new THREE.Vector3(rand(-.8,.8),rand(-.4,.8),rand(-.8,.8)),
          color:C('#bdf3ff'),size:rand(.06,.14),life:rand(.3,.7),gravity:0,shrink:1});
      }
      continue;
    }
    if(tower.type==='flame'){
      tower.flameTick-=dt;
      const origin=tower.muzzle.getWorldPosition(tmpV2);
      const dir=new THREE.Vector3().subVectors(target.group.position,origin);
      dir.y=0;
      if(dir.lengthSq()<1e-4) continue;
      dir.normalize();
      if(tower.flameTick<=0){
        tower.flameTick=0.13;
        for(const e of enemies){
          if(!e.alive || e.fly) continue;
          const ep=e.group.position;
          const dx=ep.x-tower.slot.pos.x, dz=ep.z-tower.slot.pos.z;
          const dist=Math.hypot(dx,dz);
          if(dist>tower.range) continue;
          const dot=(dx*dir.x+dz*dir.z)/(dist||1);
          if(dot<tower.def.cone) continue;
          const dmg=tower.def.dps[tower.level-1]*0.13;
          tower.totalDamage+=dmg;
          damageEnemy(e,dmg,'flame');
          if(e.alive){ e.burnTime=2.4; e.burnDps=Math.max(e.burnDps,tower.def.burnDps[tower.level-1]); e.burnTick=Math.min(e.burnTick,0.3); }
        }
      }
      // flame cone particles
      tower.fxTick=(tower.fxTick??0)-dt;
      if(tower.fxTick<=0){
        tower.fxTick=0.038;
        const up=target.group.position.y+0.5;
        for(let i=0;i<2;i++){
          const spreadX=rand(-.2,.2), spreadY=rand(-.12,.12);
          const vx=dir.x+spreadX, vz=dir.z+spreadX*0.7, vy=spreadY+(up-origin.y)*0.1;
          fireField.spawn({
            pos:new THREE.Vector3(origin.x+dir.x*0.35, origin.y+rand(-.05,.05), origin.z+dir.z*0.35),
            vel:new THREE.Vector3(vx*rand(10,15), vy*8, vz*rand(10,15)),
            color:C(pick(['#ff5a1c','#ff7b22','#ff9d2e','#ffbf45'])),
            size:rand(.14,.27), life:rand(.26,.44), gravity:-2.0, drag:2.6, shrink:1, stretch:rand(1,2)
          });
        }
        if(rng()<.35) smokePuff(new THREE.Vector3(origin.x+dir.x*1.5,origin.y+.3,origin.z+dir.z*1.5),1,.5,'#6d6258',1.4);
      }
      tower.firePulse=1;
      continue;
    }
    if(tower.cd>0) continue;
    if(tower.type==='arrow'){
      tower.cd=tower.cooldown;
      tower.recoil=1;
      const shots=tower.level>=4?3:(tower.level>=3?2:1);
      const candidates=enemies.filter(e=>e.alive && e.group.position.distanceTo(tower.slot.pos)<tower.range+(e.fly?0:0));
      for(let i=0;i<shots;i++){
        const tgt=candidates[i%Math.max(1,candidates.length)] || target;
        if(!tgt) break;
        fireArrow(tower,tgt);
      }
      spawnGlow(muzzleWorld(tower,tmpV),'#ffdca0',1.7,.16,0.7);
      burstSparks(muzzleWorld(tower,tmpV),'#ffe2a0',3,3,.25,4);
    } else if(tower.type==='cannon'){
      tower.cd=tower.cooldown;
      tower.recoil=1;
      fireCannon(tower,target);
    } else if(tower.type==='frost'){
      tower.cd=tower.cooldown;
      fireFrost(tower,target);
    } else if(tower.type==='tesla'){
      tower.cd=tower.cooldown;
      fireTesla(tower,target);
      tower.firePulse=1;
    }
  }
}

// ---------------------------------------------------------------- projectiles
const arrowGeo=(()=>{
  const arr=[];
  vox(arr,0,0,-.55,.07,.07,.9,'#6d4b2d','#4d321d');
  vox(arr,0,0,.38,.12,.12,.28,'#c9c5b3','#8f8d80');
  vox(arr,0,.05,-.58,.26,.03,.2,'#b7553f');
  vox(arr,0,-.05,-.58,.26,.03,.2,'#d7c9a2');
  return mergeParts(arr);
})();
const ARROW_MAT=new THREE.MeshLambertMaterial({vertexColors:true});
const shellGeo=new THREE.IcosahedronGeometry(0.34,1);
const shellMat=new THREE.MeshLambertMaterial({color:0x292b2d, flatShading:true});
const shardGeo=(()=>{
  const arr=[];
  vox(arr,0,-.35,0,.26,.7,.26,'#bff1fb','#72b7c8');
  vox(arr,0,.2,0,.16,.35,.16,'#e8fdff','#8fd5e2');
  vox(arr,0,.52,0,.08,.18,.08,'#ffffff','#c2f0f8');
  return mergeParts(arr);
})();
const SHARD_MAT=new THREE.MeshBasicMaterial({vertexColors:true});
const arrows=[], shells=[], shards=[];
const arcMeshes=[];

function makeArcMesh(points,color,thickness=0.08){
  const parts=[];
  for(let i=0;i<points.length-1;i++){
    const a=points[i], b=points[i+1];
    const dir=new THREE.Vector3().subVectors(b,a);
    const len=dir.length();
    if(len<0.001) continue;
    dir.normalize();
    const g=new THREE.BoxGeometry(thickness,thickness,len);
    g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(Z_AXIS,dir));
    g.translate((a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2);
    parts.push(g);
  }
  if(!parts.length) return null;
  const geo=mergeGeometries(parts,false);
  parts.forEach(g=>g.dispose());
  const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.frustumCulled=false;
  scene.add(mesh);
  return {mesh,mat,life:0.22,maxLife:0.22};
}
function jaggedPoints(a,b,jag=0.5,segments=4){
  const pts=[a.clone()];
  const dir=new THREE.Vector3().subVectors(b,a);
  const perp1=new THREE.Vector3(-dir.z,0,dir.x).normalize();
  const perp2=new THREE.Vector3(0,1,0);
  for(let i=1;i<segments;i++){
    const t=i/segments;
    const p=a.clone().addScaledVector(dir,t);
    p.addScaledVector(perp1,rand(-jag,jag));
    p.addScaledVector(perp2,rand(-jag,jag));
    pts.push(p);
  }
  pts.push(b.clone());
  return pts;
}

function fireArrow(tower,target){
  const mesh=new THREE.Mesh(arrowGeo,ARROW_MAT);
  mesh.castShadow=false;
  const origin=muzzleWorld(tower,new THREE.Vector3());
  origin.x+=rand(-.12,.12); origin.y+=rand(-.08,.08); origin.z+=rand(-.12,.12);
  mesh.position.copy(origin);
  scene.add(mesh);
  arrows.push({mesh,target,damage:tower.damage,speed:56,life:2.0,trail:0});
}

function fireCannon(tower,target){
  const origin=muzzleWorld(tower,new THREE.Vector3());
  const flight=clamp(0.55+origin.distanceTo(target.group.position)*0.012,0.65,1.15);
  const predictedD=Math.min(path.length-0.5,target.pathDist+target.speed*flight*0.85);
  const p=path.at(predictedD);
  const perpX=p.tan.z, perpZ=-p.tan.x;
  const to=new THREE.Vector3(p.pos.x+perpX*target.offset,0.2,p.pos.z+perpZ*target.offset);
  const mesh=new THREE.Mesh(shellGeo,shellMat);
  mesh.castShadow=true;
  mesh.position.copy(origin);
  scene.add(mesh);
  shells.push({mesh,from:origin.clone(),to,dur:flight,t:0,arc:3.2+origin.distanceTo(to)*0.18,radius:tower.def.splash[tower.level-1],damage:tower.damage,trail:0});
  spawnGlow(origin,'#ffd18a',2.2,.18,0.8);
  burstSparks(origin,'#ffd08a',7,5,.3,8);
  smokePuff(origin,2,1.2,'#a39a8a',1.8);
  addShake(0.06);
}

function fireFrost(tower,target){
  const mesh=new THREE.Mesh(shardGeo,SHARD_MAT);
  mesh.position.copy(muzzleWorld(tower,new THREE.Vector3()));
  scene.add(mesh);
  shards.push({mesh,target,damage:tower.damage,speed:34,life:2.4,slow:tower.def.slow[tower.level-1],slowTime:tower.def.slowTime[tower.level-1],trail:0});
  spawnGlow(mesh.position,'#b8f0ff',2.0,.2,.7);
  spawnRing(new THREE.Vector3(tower.slot.pos.x,0.16,tower.slot.pos.z),'#9fe7f5',tower.range*.45,.55);
}

function fireTesla(tower,primary){
  tower.cd=tower.cooldown;
  const start=tower.muzzle.getWorldPosition(new THREE.Vector3());
  const hitTargets=[primary];
  let current=primary;
  const maxChains=Math.min(tower.def.chains[tower.level-1],6);
  for(let i=1;i<maxChains;i++){
    let best=null, bestD=Infinity;
    for(const e of enemies){
      if(!e.alive || hitTargets.includes(e)) continue;
      const d=e.group.position.distanceTo(current.group.position);
      if(d<tower.def.jump && d<bestD){ bestD=d; best=e; }
    }
    if(!best) break;
    hitTargets.push(best); current=best;
  }
  const points=[];
  let prev=start;
  for(let i=0;i<hitTargets.length;i++){
    const e=hitTargets[i];
    const targetPos=enemyCenter(e).clone();
    targetPos.y+=0.35;
    const pts=jaggedPoints(prev,targetPos,0.55,4);
    points.push(...(i===0?pts:pts.slice(1)));
    const dmg=tower.damage*Math.pow(0.86,i);
    tower.totalDamage+=dmg;
    damageEnemy(e,dmg,'tesla');
    if(e.alive){
      burstSparks(targetPos,'#8ff0ff',4,4.5,.35,4);
      spawnGlow(targetPos,'#8ff0ff',1.6,.18,.8);
    }
    prev=targetPos;
  }
  // doubled arc + jitter
  const arc1=makeArcMesh(points,'#8ff4ff',0.075);
  if(arc1) arcMeshes.push(arc1);
  const points2=jaggedPoints(start,hitTargets[hitTargets.length-1]?enemyCenter(hitTargets[hitTargets.length-1]).clone():start,0.7,5);
  const arc2=makeArcMesh(points2,'#d5ffff',0.045);
  if(arc2){ arc2.life=0.14; arc2.maxLife=0.14; arc2.mat.opacity=0.7; arcMeshes.push(arc2); }
  spawnGlow(tower.muzzle.getWorldPosition(tmpV),'#9ff7ff',3.4,.2,.9);
  tower.orbMat.color.setHSL(0.52,1,0.85);
  addShake(0.08);
}

const scorchPos=new THREE.Vector3();
function explodeCannon(shell){
  const pos=shell.to.clone();
  const floor=groundYAt(pos.x,pos.z);
  burstFire(pos,'#ffb15a',18,6.5,.65,.7,-1.4);
  burstSparks(pos,'#ffca7a',22,12,.6,12);
  smokePuff(pos,7,1.7,'#8b8173',2.6);
  burstDebris(pos,['#6d665b','#8e8474','#554e45'],14,6,floor+0.06);
  spawnGlow(pos,'#ff9e54',7.5,.45,.9);
  spawnRing(new THREE.Vector3(pos.x,floor+0.05,pos.z),'#ffab5c',shell.radius*1.3,.45);
  spawnScorch(pos,shell.radius*1.2);
  addShake(0.18);
  for(const e of enemies){
    if(!e.alive || e.fly) continue;
    const dx=e.group.position.x-pos.x, dz=e.group.position.z-pos.z;
    if(dx*dx+dz*dz<shell.radius*shell.radius){
      damageEnemy(e,shell.damage,'cannon');
    }
  }
}

function updateProjectiles(dt){
  for(let i=arrows.length-1;i>=0;i--){
    const a=arrows[i];
    if(!a.target || !a.target.alive){
      a.life-=dt;
      a.mesh.position.addScaledVector(a.mesh.getWorldDirection(tmpV),0);
      a.mesh.visible=a.life>0;
      if(a.life<=0){ scene.remove(a.mesh); arrows.splice(i,1); }
      continue;
    }
    const targetPos=enemyCenter(a.target);
    const dir=tmpV3.copy(targetPos).sub(a.mesh.position);
    const dist=dir.length();
    if(dist<0.6 || a.life<=0){
      damageEnemy(a.target,a.damage,'arrow');
      burstSparks(targetPos,'#e8d8b0',4,4,.3,6);
      scene.remove(a.mesh);
      arrows.splice(i,1);
      continue;
    }
    dir.multiplyScalar(1/dist);
    a.mesh.position.addScaledVector(dir,a.speed*dt);
    a.mesh.lookAt(targetPos);
    a.life-=dt;
    a.trail-=dt;
    if(a.trail<=0){
      a.trail=0.055;
      sparkField.spawn({pos:a.mesh.position.clone(),vel:new THREE.Vector3(rand(-.4,.4),rand(-.2,.3),rand(-.4,.4)),color:C('#ffe0a0'),size:rand(.09,.18),life:.24,gravity:0,shrink:1});
      spawnGlow(a.mesh.position,C('#ffd88a'),1.0,.13,.36);
    }
  }
  for(let i=shells.length-1;i>=0;i--){
    const s=shells[i];
    s.t+=dt;
    const t=Math.min(1,s.t/s.dur);
    const p=new THREE.Vector3().lerpVectors(s.from,s.to,t);
    p.y+=Math.sin(t*Math.PI)*s.arc;
    s.mesh.position.copy(p);
    s.mesh.rotation.x+=dt*5; s.mesh.rotation.z+=dt*3;
    s.trail-=dt;
    if(s.trail<=0){
      s.trail=0.05;
      smokePuff(p,1,.55,'#ada79b',1.4);
      sparkField.spawn({pos:p.clone(),vel:new THREE.Vector3(rand(-.4,.4),rand(0,.6),rand(-.4,.4)),color:C('#ffbf78'),size:rand(.08,.16),life:.3,gravity:-1,shrink:1});
      spawnGlow(p,C('#ffb066'),1.3,.16,.36);
    }
    if(t>=1){
      scene.remove(s.mesh);
      shells.splice(i,1);
      explodeCannon(s);
    }
  }
  for(let i=shards.length-1;i>=0;i--){
    const s=shards[i];
    if(!s.target || !s.target.alive){
      scene.remove(s.mesh); shards.splice(i,1); continue;
    }
    const targetPos=enemyCenter(s.target);
    const dir=tmpV3.copy(targetPos).sub(s.mesh.position);
    const dist=dir.length();
    s.life-=dt;
    if(dist<0.8 || s.life<=0){
      const hit=targetPos.clone();
      burstSparks(hit,'#c6f5ff',10,5,.45,5);
      spawnGlow(hit,'#a9efff',3.2,.3,.8);
      spawnRing(new THREE.Vector3(hit.x,Math.max(0.2,hit.y-1),hit.z),'#b4ecfa',3.6,.5);
      for(const e of enemies){
        if(!e.alive) continue;
        if(e.group.position.distanceTo(hit)<3.0){
          damageEnemy(e,s.damage,'frost');
          if(e.alive){
            const resist=e.type==='boss'?0.5:(e.type==='brute'?0.8:1);
            e.slowTime=Math.max(e.slowTime,s.slowTime*resist);
            e.slowFactor=Math.max(e.slowFactor,s.slow*resist);
          }
        }
      }
      scene.remove(s.mesh); shards.splice(i,1); continue;
    }
    dir.multiplyScalar(1/dist);
    s.mesh.position.addScaledVector(dir,s.speed*dt);
    s.mesh.rotation.y+=dt*7; s.mesh.rotation.z+=dt*4;
    s.trail-=dt;
    if(s.trail<=0){
      s.trail=0.05;
      sparkField.spawn({pos:s.mesh.position.clone(),vel:new THREE.Vector3(rand(-.5,.5),rand(-.5,.5),rand(-.5,.5)),color:C('#bdf3ff'),size:rand(.07,.15),life:.35,gravity:0,shrink:1});
      spawnGlow(s.mesh.position,C('#9defff'),1.2,.14,.34);
    }
  }
  for(let i=arcMeshes.length-1;i>=0;i--){
    const a=arcMeshes[i];
    a.life-=dt;
    if(a.life<=0){ scene.remove(a.mesh); a.mesh.geometry.dispose(); a.mat.dispose(); arcMeshes.splice(i,1); continue; }
    a.mat.opacity=Math.max(0,a.life/a.maxLife);
  }
}

// ---------------------------------------------------------------- castle damage / shake
function addShake(v){
  shakeAmp=Math.min(1.2,Math.max(shakeAmp,v));
}
let shakeAmp=0;
let hudDirty=true;
function setHudDirty(){ hudDirty=true; }
const padded = n => String(n).padStart(2,'0');

// =========================================================================
// RUN STATE, WAVES, AI
// =========================================================================
const run = {
  phase:'running', wave:1, gold:240, kills:0, castleHp:CASTLE_MAX_HP,
  time:0, waveCleared:false, spawnQueue:[], spawnIndex:0, intermission:0, stragglerTimer:8,
  endTimer:0, endElapsed:0, id:1, lastTickerT:-10, fireworkAccum:0, defeatAccum:0,
  incomeAccum:0, bossSeen:false
};
castleHp = CASTLE_MAX_HP;

const initialTowerSet = [
  {slot:0, type:'arrow', level:2},
  {slot:3, type:'cannon', level:2},
  {slot:4, type:'frost', level:2},
  {slot:7, type:'tesla', level:2},
  {slot:9, type:'flame', level:2},
  {slot:12, type:'arrow', level:1}
];

function towerById(id){ return towers.find(t=>t.id===id); }

function chooseBuildType(){
  const counts={arrow:0,cannon:0,frost:0,tesla:0,flame:0};
  let air=0;
  for(const t of towers){ counts[t.type]=(counts[t.type]||0)+1; if(TOWER_TYPES[t.type].air) air++; }
  const ratios={arrow:0.27,cannon:0.20,frost:0.16,tesla:0.21,flame:0.16};
  const total=towers.length+1;
  const options=[];
  for(const type of Object.keys(TOWER_TYPES)){
    const def=TOWER_TYPES[type];
    if(run.gold<def.cost) continue;
    if(counts[type]>=5) continue;
    let need=ratios[type]*total-counts[type];
    if(def.air && air/total<0.58) need+=1.6;
    if(!def.air && air/total<0.45) need-=0.6;
    options.push({type,need, cost:def.cost});
  }
  if(!options.length) return null;
  options.sort((a,b)=>b.need-a.need || a.cost-b.cost);
  return options[0].type;
}

function slotCoverage(slot, type){
  const range=TOWER_TYPES[type].range[0];
  let score=0;
  for(let d=0; d<path.length; d+=5){
    const p=path.at(d);
    const dist=Math.hypot(p.pos.x-slot.pos.x,p.pos.z-slot.pos.z);
    if(dist<range){
      score += 1 + (d/path.length)*1.9;
    }
  }
  for(const t of towers){
    const dist=Math.hypot(t.slot.pos.x-slot.pos.x,t.slot.pos.z-slot.pos.z);
    if(dist<8.5) score-=2.2;
  }
  return score;
}

function chooseBuildSlot(type){
  let best=null,bestScore=-Infinity;
  for(const s of slots){
    if(s.tower) continue;
    const sc=slotCoverage(s,type)+rand(0,0.5);
    if(sc>bestScore){bestScore=sc;best=s;}
  }
  return best;
}

function builtFx(slot){
  const p=new THREE.Vector3(slot.pos.x,0.7,slot.pos.z);
  burstSparks(p,'#ffd894',14,6,.6,10);
  smokePuff(p,4,1.1,'#a99982',1.8);
  spawnRing(new THREE.Vector3(p.x,0.16,p.z),'#f2cb7a',2.2,.6);
}

function buildTowerAI(type,slot){
  const cost=TOWER_TYPES[type].cost;
  if(run.gold<cost) return false;
  run.gold-=cost;
  const t=makeTower(type,1,slot);
  t.cd=.15;
  builtFx(slot);
  setTicker('built '+TOWER_TYPES[type].name.toLowerCase()+' · −'+cost+'g','⚒');
  hudDirty=true;
  return true;
}

function upgradeTowerAI(tower){
  if(tower.level>=4) return false;
  const cost=upgradeCost(tower);
  if(run.gold<cost) return false;
  run.gold-=cost;
  const type=tower.type, level=tower.level+1, slot=tower.slot;
  const wasTarget=tower.target;
  disposeTower(tower);
  towers=towers.filter(t=>t!==tower);
  const nt=makeTower(type,level,slot);
  nt.cd=.2;
  builtFx(slot);
  setTicker(TOWER_TYPES[type].name.toLowerCase()+' → lv.'+level+' · −'+cost+'g','▲');
  hudDirty=true;
  return true;
}

function updateAI(dt){
  if(run.phase!=='running') return;
  run.aiTimer-=dt;
  if(run.aiTimer>0) return;
  run.aiTimer=0.72;
  const want=Math.min(MAX_TOWERS, 7 + Math.floor((run.wave-1)*0.7));
  if(towers.length<want){
    const type=chooseBuildType();
    if(type){
      const slot=chooseBuildSlot(type);
      if(slot && buildTowerAI(type,slot)) return;
    }
  }
  // upgrade the cheapest useful tower, prioritizing low levels and high impact
  const candidates=towers.filter(t=>t.level<4 && run.gold>=upgradeCost(t));
  if(candidates.length){
    const value={tesla:3.0,cannon:2.4,flame:2.1,arrow:1.8,frost:1.4};
    candidates.sort((a,b)=>{
      const sa=(4-a.level)*value[a.type]+a.level*.4;
      const sb=(4-b.level)*value[b.type]+b.level*.4;
      return sb-sa;
    });
    upgradeTowerAI(candidates[0]);
  }
}

// ---------------------------------------------------------------- wave composition
function waveComp(w){
  return {
    runner: Math.round(4 + w*1.35),
    bat: w>=2 ? Math.round(1 + w*0.8) : 0,
    brute: w>=3 ? Math.floor((w-1)/2) : 0,
    knight: w>=5 ? Math.floor((w-3)/2) : 0,
    boss: (w%4===0 || w===MAX_WAVES) ? (w===MAX_WAVES?2:1) : 0
  };
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=(rng()*(i+1))|0;
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function startWave(n){
  run.wave=n;
  run.waveCleared=false;
  run.spawnIndex=0;
  run.spawnQueue=[];
  run.intermission=0;
  run.stragglerTimer=8.0;
  const comp=waveComp(n);
  let types=[];
  for(const k of ['runner','bat','brute','knight']){
    for(let i=0;i<(comp[k]||0);i++) types.push(k);
  }
  shuffle(types);
  for(let i=0;i<comp.boss;i++){
    // boss at the back of the horde, with a gap before it
    types.push('boss');
  }
  let at=run.time+1.25;
  run.spawnQueue=types.map((type)=>{
    at += type==='boss'?2.1:rand(.27,.52);
    return {type, at};
  });
  const isBoss=comp.boss>0;
  if(n===1){
    setTicker('wave 01 · the horde advances','›');
  } else if(isBoss){
    setTicker('wave '+padded(n)+' · the hollow king rides','☠');
  } else {
    setTicker('wave '+padded(n)+' · '+types.length+' hostiles','›');
  }
  hudDirty=true;
}

function spawnFromQueue(){
  while(run.spawnIndex<run.spawnQueue.length){
    const item=run.spawnQueue[run.spawnIndex];
    if(run.time<item.at) break;
    if(enemies.length>=54){ item.at=run.time+0.8; break; }
    spawnEnemy(item.type, 0, run.wave, {portal:true});
    run.spawnIndex++;
  }
}

function updateWaves(dt){
  if(run.phase!=='running') return;
  run.gold += dt*(1.5 + run.wave*0.18);

  if(run.intermission>0){
    run.intermission-=dt;
    if(run.intermission<=0){
      if(run.wave>=MAX_WAVES){
        if(enemies.length===0) triggerVictory();
      } else {
        startWave(run.wave+1);
      }
    }
    return;
  }

  spawnFromQueue();

  // once the whole roster has entered the field, the next wave can follow
  // even if a slow boss is still stalking the lane
  if(!run.waveCleared && run.spawnIndex>=run.spawnQueue.length){
    run.waveCleared=true;
    const bonus=35+run.wave*7;
    run.gold+=bonus;
    if(run.wave>=MAX_WAVES){
      setTicker('the final horde · +'+bonus+' gold','✦');
    } else if(enemies.length===0){
      setTicker('wave '+padded(run.wave)+' cleared · +'+bonus+' gold','✦');
      run.intermission=2.4;
      return;
    } else {
      setTicker('wave '+padded(run.wave)+' · +'+bonus+' gold','✦');
      run.stragglerTimer=7.0;
    }
    hudDirty=true;
  }

  if(!run.waveCleared) return;

  if(run.wave>=MAX_WAVES){
    if(enemies.length===0) triggerVictory();
    return;
  }

  if(enemies.length===0){
    if(run.intermission<=0) run.intermission=2.4;
    return;
  }

  run.stragglerTimer-=dt;
  if(run.stragglerTimer<=0){
    startWave(run.wave+1);
  }
}

// ---------------------------------------------------------------- battle seeding
function seedBattle(){
  for(const it of initialTowerSet){
    const slot=slots[it.slot];
    if(!slot || slot.tower) continue;
    const t=makeTower(it.type,it.level,slot);
    t.cd=0;
  }
  startWave(1);
  // enemies already deep in the lane, in range of every starting tower
  const seeds=[
    {d:slots[0].d+4, type:'runner', dmg:.78},
    {d:slots[3].d+5, type:'brute', dmg:.62},
    {d:slots[4].d+4.2, type:'bat', dmg:.66},
    {d:slots[7].d+4, type:'knight', dmg:.7},
    {d:slots[9].d+3.6, type:'runner', dmg:.55},
    {d:slots[12].d-12, type:'runner', dmg:.7},
    {d:slots[1].d+8, type:'runner', dmg:.9},
    {d:slots[6].d+7, type:'bat', dmg:.85},
    {d:slots[5].d-4, type:'runner', dmg:.9}
  ];
  for(const s of seeds){
    const e=spawnEnemy(s.type, clamp(s.d, 4, path.length-3), 1, {instant:true, damaged:s.dmg, hpMul:1.05});
    e.spawnT=0;
    e.group.scale.setScalar(e.baseScale);
  }
}

// ---------------------------------------------------------------- defeat / victory / reset
function triggerDefeat(){
  if(run.phase==='defeat' || run.phase==='victory') return;
  run.phase='defeat';
  run.endTimer=7.2;
  run.endElapsed=0;
  castleHp=0;
  addShake(1.1);
  setTicker('the keep has fallen · rebuilding the realm','✖');
  const gate=new THREE.Vector3(CASTLE_GATE.x-1,2,CASTLE_GATE.z);
  burstFire(gate,'#ff7c3d',34,10,.9,1.0,-1);
  burstSparks(gate,'#ffcf8a',40,15,.9,12);
  burstDebris(gate,['#8c887d','#6a665d','#a09b8f','#4d4a44'],34,9,gate.y);
  smokePuff(gate,14,2.6,'#8f8578',4);
  spawnGlow(gate,'#ff7a3c',14,.9,.95);
  spawnRing(new THREE.Vector3(gate.x,0.2,gate.z),'#ff7444',13,.9);
  hudDirty=true;
}

function triggerVictory(){
  if(run.phase==='victory' || run.phase==='defeat') return;
  run.phase='victory';
  run.endTimer=8.5;
  run.endElapsed=0;
  run.fireworkAccum=0;
  setTicker('the siege is broken · the realm endures','✦');
  hudDirty=true;
}

function updateEndState(dt){
  if(run.phase==='running') return;
  run.endElapsed+=dt;
  run.endTimer-=dt;
  if(run.phase==='defeat'){
    if(run.endElapsed>1.25 && !castleHidden){
      castleHidden=true;
      castleGroup.visible=true;
      if(castleRoofMesh) castleRoofMesh.visible=false;
      if(castleWindowMesh) castleWindowMesh.visible=false;
      castleRubble.visible=true;
      flagMeshes.forEach(f=>f.mesh.visible=false);
      for(let i=0;i<6;i++){
        const pos=new THREE.Vector3(CASTLE.x+rand(-7,7),rand(2,10),CASTLE.z+rand(-6,6));
        burstFire(pos,'#ff823c',12,6,.7,.8,-1);
        smokePuff(pos,4,2,'#7f776d',3);
        burstDebris(pos,['#7f7b71','#969186','#5a574f'],10,7,0);
      }
      addShake(0.8);
    }
    run.defeatAccum+=dt;
    if(run.castleHp!==0) run.castleHp=0;
    if(run.defeatAccum>0.42 && castleHidden){
      run.defeatAccum=0;
      const pos=new THREE.Vector3(CASTLE.x+rand(-7,7),rand(1,9),CASTLE.z+rand(-6,6));
      burstFire(pos,'#ff8a43',10,5,.6,.7,-1);
      smokePuff(pos,3,2.4,'#8b8276',3.2);
      burstDebris(pos,['#817d73','#9c978b','#5d5a53'],5,5,0);
      spawnGlow(pos,'#ff8440',6,.4,.7);
      if(rng()<.3) addShake(.14);
    }
  } else if(run.phase==='victory'){
    run.fireworkAccum-=dt;
    if(run.fireworkAccum<=0){
      run.fireworkAccum=rand(.22,.5);
      const color=pick(['#9de2ff','#ffe08a','#ff9e7a','#c2a4ff','#a4ffd1']);
      const color2=pick(['#ffe08a','#ff9e7a','#8fd8ff','#ffd2ec']);
      const pos=new THREE.Vector3(CASTLE.x+rand(-12,12),rand(10,23),CASTLE.z+rand(-9,9));
      for(let i=0;i<38;i++){
        const a=rand(0,Math.PI*2), b=rand(-.8,.8);
        sparkField.spawn({pos:pos.clone(),
          vel:new THREE.Vector3(Math.cos(a)*Math.cos(b)*rand(3,11),Math.sin(b)*rand(4,12),Math.sin(a)*Math.cos(b)*rand(3,11)),
          color:C(rng()<.35?color2:color), size:rand(.12,.32), life:rand(.8,1.6), gravity:2.8, drag:.45, shrink:1});
      }
      spawnGlow(pos,color,12,.6,.85);
      spawnGlow(pos.clone().add(new THREE.Vector3(rand(-3,3),rand(-2,2),rand(-3,3))),color2,7,.45,.6);
      burstFire(pos,color2,5,3.5,.7,.5,2.2);
    }
  }
  if(run.endTimer<=0){ resetRun(); }
}

function clearDynamic(){
  for(const e of enemies) removeEnemyObject(e);
  enemies=[];
  for(const t of towers) disposeTower(t);
  towers=[];
  for(const s of slots) s.tower=null;
  for(const a of arrows){ scene.remove(a.mesh); }
  arrows.length=0;
  for(const s of shells){ scene.remove(s.mesh); }
  shells.length=0;
  for(const s of shards){ scene.remove(s.mesh); }
  shards.length=0;
  for(const a of arcMeshes){ scene.remove(a.mesh); a.mesh.geometry.dispose(); a.mat.dispose(); }
  arcMeshes.length=0;
  for(const p of allParticles) p.clear();
  for(const g of glowPool){ g.spr.visible=false; g.mat.opacity=0; }
  for(const r of ringPool){ r.mesh.visible=false; }
  for(const d of decalPool){ d.mesh.visible=false; }
  hideAllBars();
}

function resetRun(){
  clearDynamic();
  run.phase='running';
  run.wave=1;
  run.gold=240;
  run.kills=0;
  run.time=0;
  run.waveCleared=false;
  run.spawnQueue=[];
  run.spawnIndex=0;
  run.intermission=0;
  run.endTimer=0;
  run.endElapsed=0;
  run.id++;
  run.lastTickerT=-10;
  run.defeatAccum=0;
  run.fireworkAccum=0;
  castleSmokeAccum=0;
  lastLeakTicker=-10;
  castleHp=CASTLE_MAX_HP;
  castleHidden=false;
  castleGroup.visible=true;
  if(castleRoofMesh) castleRoofMesh.visible=true;
  if(castleWindowMesh) castleWindowMesh.visible=true;
  castleRubble.visible=false;
  flagMeshes.forEach(f=>f.mesh.visible=true);
  MAT.window.color.setRGB(0.22,0.16,0.11);
  seedBattle();
  hudDirty=true;
  displayGold=run.gold;
  director.follow.copy(battleHotspot().center);
  camState.shotType=null;
  setTicker('a new siege begins','›');
  updateHUD(true);
}

  shotType:null, age:0, duration:6, transition:false, transT:0, transDur:1.4,
  fromPos:new THREE.Vector3(), fromLook:new THREE.Vector3(),
  look:new THREE.Vector3(5,2,-2), follow:new THREE.Vector3(0,1,0),
  hot:null, hotTimer:0, data:{}, lastType:'', orbitAngle:rand(0,6.28)
};

function battleHotspot(){
  let best=null,bestScore=-1;
  for(const e of enemies){
    if(!e.alive) continue;
    let count=0;
    for(const o of enemies){
      if(!o.alive) continue;
      const dx=o.group.position.x-e.group.position.x;
      const dz=o.group.position.z-e.group.position.z;
      if(dx*dx+dz*dz<24*24) count++;
    }
    let score=count*2.2 + e.pathDist/path.length*2 + (e.type==='boss'?5:0);
    if(score>bestScore){bestScore=score;best=e;}
  }
  if(!best){
    const d=path.length*0.58;
    const p=path.at(d);
    return {center:new THREE.Vector3(p.pos.x,1,p.pos.z), tangent:p.tan.clone(), d};
  }
  let cx=0,cz=0,cy=0,n=0;
  for(const o of enemies){
    if(!o.alive) continue;
    const dx=o.group.position.x-best.group.position.x;
    const dz=o.group.position.z-best.group.position.z;
    if(dx*dx+dz*dz<26*26){
      cx+=o.group.position.x; cz+=o.group.position.z; cy+=o.group.position.y; n++;
    }
  }
  n=Math.max(1,n);
  const p=path.at(best.pathDist);
  return {
    center:new THREE.Vector3(cx/n, Math.max(1.4, (cy/n)+0.7), cz/n),
    tangent:p.tan.clone(),
    d:best.pathDist
  };
}

function chooseShotType(){
  const combat=enemies.length>0;
  const pool=combat
    ? ['action','orbit','follow','tower','action','bridge','castle','follow','orbit','tower','village','action']
    : ['orbit','tower','castle','bridge','village','orbit'];
  let t=pick(pool);
  let guard=0;
  while(t===camState.lastType && guard++<5) t=pick(pool);
  return t;
}

function setShot(type, hardCut){
  camState.lastType=camState.shotType;
  camState.shotType=type;
  camState.age=0;
  let towerPick=null;
  if(towers.length){
    const safe=towers.filter(t=>Math.hypot(t.slot.pos.x-CASTLE.x,t.slot.pos.z-CASTLE.z)>18);
    const base=safe.length?safe:towers;
    const busy=base.filter(t=>t.target && t.target.alive);
    const pool=busy.length?busy:base;
    towerPick=pool[(rng()*pool.length)|0];
  }
  camState.data={
    angle:rand(0,Math.PI*2),
    side:rng()<.5?-1:1,
    lowSky: rng()<.55 && camera.aspect>0.9,
    tower: towerPick,
    duration: type==='orbit'?rand(6.8,8.2):(type==='action'?rand(5.2,6.6):(type==='follow'?rand(5.2,6.6):rand(4.5,5.8)))
  };
  camState.duration=camState.data.duration;
  camState.fromPos.copy(camera.position);
  camState.fromLook.copy(camState.look);
  const canSwoop=(type==='action'||type==='follow'||type==='tower') && (camState.lastType==='orbit'||camState.lastType==='castle'||camState.lastType==='bridge');
  camState.transition = !hardCut || (canSwoop && rng()<.55);
  camState.transT=0;
  camState.transDur=rand(1.1,1.9);
  if(type==='action' || type==='follow'){
    const hot=battleHotspot();
    if(hardCut) camState.follow.copy(hot.center);
    camState.hot=hot;
    camState.hotTimer=.2;
  }
  if(type==='orbit'){
    camState.orbitAngle=rand(0,Math.PI*2);
  }
}

const _shotPos=new THREE.Vector3();
const _shotLook=new THREE.Vector3();
const _perp=new THREE.Vector3();

function computeShot(dt){
  const type=camState.shotType;
  const age=camState.age;
  const aspectZoom = camera.aspect<1.25 ? Math.min(1.6,Math.pow(1.25/camera.aspect,0.6)) : 1;
  const hot = camState.hot;
  if(type==='orbit'){
    const radius=108*aspectZoom;
    const ang=camState.orbitAngle + age*0.045;
    if(camState.data.lowSky && camera.aspect>0.9){
      _shotPos.set(2+Math.cos(ang)*radius, 33+Math.sin(age*.2)*3, -3+Math.sin(ang)*radius);
      _shotLook.set(5,7.5,-2);
    } else {
      _shotPos.set(5+Math.cos(ang)*radius, 58+Math.sin(age*.2)*4, -2+Math.sin(ang)*radius);
      _shotLook.set(6,3,-2);
    }
  } else if(type==='action'){
    if(camState.hotTimer<=0){
      camState.hot=battleHotspot();
      camState.hotTimer=.55;
    }
    const h=camState.hot;
    camState.follow.lerp(h.center, 1-Math.exp(-dt*1.8));
    const ang=camState.data.angle + age*.08;
    const rad=30*aspectZoom;
    _shotPos.set(camState.follow.x+Math.cos(ang)*rad, camState.follow.y+17.0+Math.sin(age*.35)*1.8, camState.follow.z+Math.sin(ang)*rad);
    _shotLook.copy(camState.follow).addScaledVector(h.tangent,6.5);
    _shotLook.y+=0.4;
  } else if(type==='follow'){
    if(camState.hotTimer<=0){ camState.hot=battleHotspot(); camState.hotTimer=.55; }
    const h=camState.hot;
    camState.follow.lerp(h.center, 1-Math.exp(-dt*2.2));
    _perp.set(h.tangent.z,0,-h.tangent.x);
    _shotPos.copy(camState.follow)
      .addScaledVector(h.tangent,-22*aspectZoom)
      .addScaledVector(_perp, camState.data.side*9.0*aspectZoom);
    _shotPos.y+=13.5;
    _shotLook.copy(camState.follow).addScaledVector(h.tangent,10.0);
    _shotLook.y+=0.6;
  } else if(type==='tower'){
    let tower=camState.data.tower;
    if(!tower || !towers.includes(tower)) tower=towers.length?towers[(rng()*towers.length)|0]:null;
    camState.data.tower=tower;
    if(!tower){
      _shotPos.set(30,20,40); _shotLook.set(5,2,0);
    } else {
      const tgt=tower.target && tower.target.alive?tower.target:null;
      const tp=tower.slot.pos;
      let dir;
      if(tgt){
        dir=new THREE.Vector3(tgt.group.position.x-tp.x,0,tgt.group.position.z-tp.z);
        if(dir.lengthSq()<.01) dir.set(0,0,1); else dir.normalize();
      } else {
        const p=path.at(tower.slot.d);
        dir=new THREE.Vector3(p.tan.x,0,p.tan.z);
      }
      _perp.set(dir.z,0,-dir.x);
      _shotPos.set(tp.x, 12.8+tower.level*0.4, tp.z)
        .addScaledVector(dir,-9.5*aspectZoom)
        .addScaledVector(_perp,camState.data.side*6.0*aspectZoom);
      _shotLook.set(tp.x, 3.8+tower.level*0.3, tp.z).addScaledVector(dir,3.2);
      _shotLook.y=Math.min(_shotLook.y, 6.0);
      const hover=Math.sin(age*.35)*.5;
      _shotPos.y+=hover;
    }
  } else if(type==='castle'){
    const ang=camState.data.angle + age*.06;
    const r=38*aspectZoom;
    _shotPos.set(CASTLE.x+Math.cos(ang)*r, 21+Math.sin(age*.3)*1.8, CASTLE.z+Math.sin(ang)*r);
    _shotLook.set(CASTLE.x+1, 6.8, CASTLE.z);
  } else if(type==='bridge'){
    if(bridgeInfo){
      const dir=bridgeInfo.p1.clone().sub(bridgeInfo.p0); dir.y=0; dir.normalize();
      const perp=new THREE.Vector3(dir.z,0,-dir.x);
      const mid=bridgeInfo.mid;
      _shotPos.copy(mid).addScaledVector(perp, camState.data.side*18*aspectZoom).addScaledVector(dir,-7);
      _shotPos.y=8.2;
      _shotLook.copy(mid).addScaledVector(dir,3); _shotLook.y=1.2;
    } else {
      _shotPos.set(5,18,30); _shotLook.set(0,1,0);
    }
  } else {
    const ang=camState.data.angle + age*.035;
    _shotPos.set(VILLAGE.x+Math.cos(ang)*30, 25.0, VILLAGE.z+Math.sin(ang)*30);
    _shotLook.set(VILLAGE.x-1, 2.2, VILLAGE.z+1);
  }
  // keep the lens above the ground
  const floor=groundYAt(_shotPos.x,_shotPos.z)+3.2;
  if(_shotPos.y<floor) _shotPos.y=floor;
  if(_shotLook.y<0.8) _shotLook.y=0.8;
}

function updateCamera(dt, force){
  if(run.phase==='defeat' || run.phase==='victory'){
    const ang=env.time*.05+2.15;
    const endZoom=camera.aspect<0.9?1.3:1;
    const radius=(run.phase==='victory'?46:43)*endZoom;
    const desiredPos=new THREE.Vector3(CASTLE.x+Math.cos(ang)*radius, (run.phase==='victory'?26:23)+Math.sin(env.time*.3)*1.6, CASTLE.z+Math.sin(ang)*radius);
    const desiredLook=new THREE.Vector3(CASTLE.x+1, run.phase==='victory'?7.0:5.6, CASTLE.z);
    camera.position.lerp(desiredPos, 1-Math.exp(-dt*1.5));
    camState.look.lerp(desiredLook, 1-Math.exp(-dt*1.8));
    if(Math.random()<.02) addShake(.03);
    applyCameraShake(dt);
    camera.lookAt(camState.look);
    return;
  }

  if(!camState.shotType) setShot('action', true);
  camState.age+=dt;
  if(camState.hotTimer>0) camState.hotTimer-=dt;
  if(camState.age>camState.duration){
    const next=chooseShotType();
    setShot(next, rng()<.56);
  }
  computeShot(dt);
  if(camState.transition){
    camState.transT+=dt;
    const t=smoothstep(0,1,camState.transT/camState.transDur);
    camera.position.lerpVectors(camState.fromPos,_shotPos,t);
    camState.look.lerpVectors(camState.fromLook,_shotLook,t);
    if(camState.transT>=camState.transDur) camState.transition=false;
  } else {
    camera.position.copy(_shotPos);
    camState.look.copy(_shotLook);
  }
  const floor=groundYAt(camera.position.x,camera.position.z)+2.2;
  if(camera.position.y<floor) camera.position.y=floor;
  if(shakeAmp>0){
    camera.position.x+=rand(-1,1)*shakeAmp*0.55;
    camera.position.y+=rand(-1,1)*shakeAmp*0.4;
    camera.position.z+=rand(-1,1)*shakeAmp*0.55;
  }
  camera.lookAt(camState.look);
  camera.rotation.z += rand(-1,1)*shakeAmp*0.012;
  shakeAmp*=Math.exp(-dt*4.5);
  if(shakeAmp<0.002) shakeAmp=0;
  camera.updateMatrixWorld();
}

function applyCameraShake(dt){
  if(shakeAmp>0){
    camera.position.x+=rand(-1,1)*shakeAmp*0.4;
    camera.position.y+=rand(-1,1)*shakeAmp*0.3;
    camera.position.z+=rand(-1,1)*shakeAmp*0.4;
    shakeAmp*=Math.exp(-dt*4.5);
  }
}

// =========================================================================
// HUD
// =========================================================================
let displayGold=240;
let separateHudT=0;
function updateHUD(force=false){
  separateHudT+=0.016;
  displayGold += (run.gold-displayGold)*0.22;
  if(hud.waveMax.textContent!==String(MAX_WAVES)) hud.waveMax.textContent=String(MAX_WAVES);
  hud.waveNow.textContent=padded(run.wave);
  hud.kills.textContent=String(run.kills);
  hud.gold.textContent=Math.floor(displayGold).toLocaleString('en-US');
  const hp=Math.max(0,Math.ceil(castleHp));
  hud.hpText.textContent=String(hp);
  const frac=clamp(castleHp/CASTLE_MAX_HP,0,1);
  hud.hpFill.style.width=(frac*100).toFixed(1)+'%';
  if(frac>0.6) hud.hpFill.style.background='linear-gradient(90deg,#6f9d45,#b6cd73)';
  else if(frac>0.3) hud.hpFill.style.background='linear-gradient(90deg,#b58a3e,#e4c36f)';
  else hud.hpFill.style.background='linear-gradient(90deg,#9c352c,#e4604b)';
  const boss=run.phase==='running' ? enemies.find(e=>e.alive && e.type==='boss') : null;
  if(boss){
    hud.bossRow.classList.remove('hidden');
    const bf=clamp(boss.hp/boss.hpMax,0,1);
    hud.bossFill.style.width=(bf*100).toFixed(1)+'%';
    hud.bossHpText.textContent=Math.ceil(bf*100)+'%';
  } else {
    hud.bossRow.classList.add('hidden');
  }
  hudDirty=false;
}

// =========================================================================
// INITIALIZATION
// =========================================================================
const director = {
  follow:camState.follow,
  reset(){ camState.shotType=null; camState.hot=null; camState.age=0; }
};
resetRun();

// ---------------------------------------------------------------- resize
function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5));
}
window.addEventListener('resize', onResize);

// ---------------------------------------------------------------- main loop
const clock = new THREE.Clock();
let elapsed=0;
let hudUpdateAccum=0;
let fpsAccum=0, fpsFrames=0, currentFps=60;
let qualityPr=renderer.getPixelRatio();
let qualityCheckAt=6;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  elapsed+=dt;
  run.time+=dt;

  updateEnvironment(elapsed,dt);
  updateWaves(dt);
  updateAI(dt);
  updateEnemies(dt);
  updateTowers(dt);
  updateProjectiles(dt);
  updateEndState(dt);
  updateAtmosphere(elapsed,dt);
  updateVillagers(elapsed);
  updateCastleDamageVisuals(dt);
  for(const p of allParticles) p.update(dt);
  updateGlows(dt);
  updateRings(dt);
  updateDecals(dt);
  updateCamera(dt);
  updateContactShadows();
  updateHealthBars();

  hudUpdateAccum+=dt;
  if(hudUpdateAccum>0.12){ hudUpdateAccum=0; updateHUD(); }
  hudUpdateAccum=Math.min(hudUpdateAccum,0.2);

  // adaptive resolution for slower machines
  fpsFrames++; fpsAccum+=dt;
  if(elapsed>qualityCheckAt && fpsAccum>2){
    currentFps=fpsFrames/fpsAccum;
    fpsFrames=0; fpsAccum=0;
    if(currentFps<42 && qualityPr>1.0){
      qualityPr=Math.max(1.0,qualityPr-0.25);
      renderer.setPixelRatio(qualityPr);
    }
  }

  renderer.render(scene,camera);
}
animate();

// debug / inspection hooks (no UI)
window.__siege = {
  run, enemies, towers, director, camState, path, slots,
  resetRun, triggerDefeat, triggerVictory,
  spawn(type, d, wave){ return spawnEnemy(type, d ?? path.length*0.62, wave ?? run.wave, {instant:true}); },
  forceShot(type){ setShot(type, true); },
  setTimeOfDay(t){ dayShift=(t-START_DAY_T)*DAY_LENGTH-elapsed; },
  getState(){ return {
    phase:run.phase, wave:run.wave, gold:Math.round(run.gold), kills:run.kills, castleHp,
    enemies:enemies.length, towers:towers.length,
    towerLevels:towers.map(t=>t.type[0]+t.level),
    fps:+currentFps.toFixed(1), camType:camState.shotType
  }; }
};
window.__world = { scene, camera, renderer, path, slots, meta, env, CASTLE, VILLAGE };
</script>
