  const projectilePos = new THREE.Vector3();
  const projectileDir = new THREE.Vector3();
  const projectileAim = new THREE.Vector3();
  const projectileTmp = new THREE.Vector3();

  let shakeAmount = 0;
  function addCameraShake(amount) {
    shakeAmount = Math.min(0.9, shakeAmount + amount);
  }

  const explosionSphereGeo = new THREE.IcosahedronGeometry(1, 0);
  const explosionRingGeo = new THREE.RingGeometry(0.55, 1.0, 26);
  function createExplosion(x, y, z, color, scale = 1, duration = 0.55) {
    const group = new THREE.Group();
    group.position.set(x, y, z);
    const sphereMat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 0.8, depthWrite: false,
      blending: THREE.AdditiveBlending, toneMapped: false
    });
    const sphere = new THREE.Mesh(explosionSphereGeo, sphereMat);
    sphere.scale.setScalar(0.15 * scale);
    group.add(sphere);
    const ringMat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 0.8, depthWrite: false,
      blending: THREE.AdditiveBlending, side: THREE.DoubleSide, toneMapped: false
    });
    const ring = new THREE.Mesh(explosionRingGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.25 - y;
    group.add(ring);
    scene.add(group);
    effects.push({
      type: 'explosion', group, sphere, ring, sphereMat, ringMat,
      t: 0, duration, scale
    });
  }

  function updateEffects(dt) {
    for (let i = effects.length - 1; i >= 0; i--) {
      const fx = effects[i];
      fx.t += dt;
      const k = fx.t / fx.duration;
      if (k >= 1) {
        scene.remove(fx.group);
        fx.sphereMat.dispose();
        fx.ringMat.dispose();
        effects.splice(i, 1);
        continue;
      }
      const eased = 1 - Math.pow(1 - k, 3);
      fx.sphere.scale.setScalar((0.25 + eased * 1.35) * fx.scale);
      fx.sphereMat.opacity = 0.72 * (1 - k) * (1 - k);
      fx.ring.scale.setScalar(0.7 + eased * (2.2 * fx.scale));
      fx.ringMat.opacity = 0.65 * (1 - eased);
      fx.sphere.rotation.y += dt * 2.0;
      fx.sphere.rotation.x += dt * 1.1;
    }
  }

  function spawnArrow(t, target, start) {
    const mesh = new THREE.Mesh(arrowGeo, arrowMat);
    mesh.castShadow = true;
    mesh.position.copy(start);
    scene.add(mesh);
    projectileAim.copy(target.hitPos);
    projectileDir.copy(projectileAim).sub(start);
    if (projectileDir.lengthSq() < 0.0001) projectileDir.set(0, 0, 1);
    projectileDir.normalize();
    mesh.quaternion.setFromUnitVectors(forwardVec, projectileDir);
    projectiles.push({
      kind: 'arrow', mesh, target, targetPos: target.hitPos.clone(),
      speed: 27, life: 3.0, damage: t.damage, tower: t, trailTimer: 0
    });
  }

  function spawnFrostShard(t, target, start) {
    const mesh = new THREE.Mesh(iceGeo, iceMat);
    mesh.position.copy(start);
    mesh.scale.setScalar(1.1);
    scene.add(mesh);
    projectileAim.copy(target.hitPos);
    projectileDir.copy(projectileAim).sub(start).normalize();
    mesh.quaternion.setFromUnitVectors(forwardVec, projectileDir);
    projectiles.push({
      kind: 'frost', mesh, target, targetPos: target.hitPos.clone(),
      speed: 19, life: 3.2, damage: t.damage, tower: t, trailTimer: 0, spin: 0
    });
  }

  function spawnCannonball(t, target, start) {
    const mesh = new THREE.Mesh(cannonGeo, cannonMat);
    mesh.castShadow = true;
    mesh.position.copy(start);
    scene.add(mesh);
    const flight = clamp(0.4 + getTowerWorld(t, projectileTmp).distanceTo(target.group.position) * 0.048, 0.55, 1.45);
    const future = clamp((target.progress + enemySpeed(target) * flight * 0.8) / pathLength, 0, 1);
    pathCurve.getPointAt(future, projectileAim);
    const tangent = pathCurve.getTangentAt(future, vecScratchB);
    projectileAim.x += tangent.z * target.lane;
    projectileAim.z -= tangent.x * target.lane;
    projectileAim.y = target.def.fly ? target.def.hover + PATH_Y : PATH_Y + 0.25;
    const dx = projectileAim.x - start.x;
    const dz = projectileAim.z - start.z;
    const dy = projectileAim.y - start.y;
    const g = 25;
    const vel = new THREE.Vector3(dx / flight, (dy + 0.5 * g * flight * flight) / flight, dz / flight);
    projectiles.push({
      kind: 'cannon', mesh, target, targetPos: projectileAim.clone(),
      vel, flight, age: 0, damage: t.damage, tower: t,
      radius: t.splash, trailTimer: 0
    });
  }

  function addBoltLink(cubes, from, to) {
    const dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z;
    const length = Math.sqrt(dx * dx + dy * dy + dz * dz);
    const steps = clamp(Math.floor(length * 1.7), 5, 20);
    const colorList = [0xc9fbff, 0x8cefff, 0xffffff, 0x87c8ff];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const jitter = Math.sin(t * Math.PI) * 0.28 + 0.08;
      const x = from.x + dx * t + (Math.random() - 0.5) * jitter;
      const y = from.y + dy * t + (Math.random() - 0.5) * jitter;
      const z = from.z + dz * t + (Math.random() - 0.5) * jitter;
      const s = 0.075 + Math.random() * 0.1;
      cubes.push(C(x, y, z, s, s, s, colorList[Math.floor(Math.random() * colorList.length)]));
      if (i % 4 === 1 && Math.random() < 0.5) {
        cubes.push(C(x + (Math.random() - 0.5) * 0.7, y + (Math.random() - 0.5) * 0.5, z + (Math.random() - 0.5) * 0.7,
          0.045, 0.045, 0.045, 0x9fe7ff));
      }
    }
  }

  function fireLightning(t, target, start) {
    const chained = [target];
    const used = new Set([target]);
    for (let c = 1; c < t.chains; c++) {
      const prev = chained[chained.length - 1];
      let next = null;
      let bestD = 16;
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (!e.alive || used.has(e)) continue;
        const d = e.hitPos.distanceToSquared(prev.hitPos);
        if (d < 35 && d < bestD) { bestD = d; next = e; }
      }
      if (!next) break;
      chained.push(next);
      used.add(next);
    }
    const dmgScale = [1, 0.78, 0.62, 0.5, 0.42];
    const cubes = [];
    let from = start.clone();
    for (let i = 0; i < chained.length; i++) {
      const e = chained[i];
      addBoltLink(cubes, from, e.hitPos);
      spawnSparksAt(e.hitPos.x, e.hitPos.y, e.hitPos.z, [0xd5fbff, 0x70e5ff, 0xffffff], 9, 4.2, 2.2);
      damageEnemy(e, t.damage * (dmgScale[i] || 0.35), {
        sparks: false, flash: 0.2
      });
      createExplosion(e.hitPos.x, e.hitPos.y, e.hitPos.z, 0x8feaff, 0.28 + i * 0.04, 0.24);
      from = e.hitPos.clone();
    }
    if (!cubes.length) return;
    const mat = new THREE.MeshBasicMaterial({
      vertexColors: true, transparent: true, opacity: 1, depthWrite: false,
      blending: THREE.AdditiveBlending, toneMapped: false
    });
    const mesh = new THREE.Mesh(makeVoxelGeometry(cubes), mat);
    mesh.renderOrder = 9;
    scene.add(mesh);
    zaps.push({ mesh, mat, life: 0.22, maxLife: 0.22 });
  }

  function getTowerWorld(t, out) {
    out.copy(t.group.position);
    out.y += 1.2;
    return out;
  }

  function removeProjectile(index) {
    const p = projectiles[index];
    if (p.mesh.parent) scene.remove(p.mesh);
    projectiles.splice(index, 1);
  }

  function explodeCannonball(p) {
    const pos = p.mesh.position;
    createExplosion(pos.x, Math.max(0.35, pos.y), pos.z, 0xffb14d, p.radius * 0.8, 0.62);
    spawnSparksAt(pos.x, Math.max(0.3, pos.y), pos.z,
      [0xffb14d, 0xffe3a2, 0xff7737, 0xffffff], 28, 7.5, 4.2);
    for (let s = 0; s < 7; s++) {
      spawnSmokeAt(pos.x + (Math.random() - 0.5) * 1.2, Math.max(0.6, pos.y + 0.2), pos.z + (Math.random() - 0.5) * 1.2,
        0.65 + Math.random() * 0.5, 1.8 + Math.random(), 0x80796f, 0.9);
    }
    addCameraShake(0.055);
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const d = e.hitPos.distanceTo(pos);
      if (d < p.radius) {
        const falloff = 1 - 0.45 * (d / p.radius);
        damageEnemy(e, p.damage * falloff, {
          sparks: Math.random() < 0.6, sparkColors: [0xffc66c, 0xffe6ad], sparkCount: 3
        });
      }
    }
  }

  function spawnFrostBurst(x, y, z, radius, damage, slow, source) {
    createExplosion(x, y, z, 0x8fe6ff, 0.7, 0.38);
    spawnSparksAt(x, y, z, [0xc6f6ff, 0x7cdcf4, 0xffffff], 18, 4.4, 2.8);
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const d = e.hitPos.distanceTo(vecScratchA.set(x, y, z));
      if (d < radius) {
        damageEnemy(e, damage * (1 - 0.28 * d / radius), {
          slow: slow, slowFactor: 0.42, sparks: Math.random() < 0.5,
          sparkColors: [0xbcf6ff, 0x8edcf8], sparkCount: 2
        });
      }
    }
  }

  function updateProjectiles(dt) {
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      if (p.kind === 'arrow' || p.kind === 'frost') {
        p.life -= dt;
        if (p.life <= 0) { removeProjectile(i); continue; }
        const targetAlive = p.target && p.target.alive;
        if (targetAlive) p.targetPos.copy(p.target.hitPos);
        projectileTmp.copy(p.targetPos).sub(p.mesh.position);
        const dist = projectileTmp.length();
        if (dist < 0.35 || dist < p.speed * dt + 0.06) {
          if (p.kind === 'arrow') {
            if (targetAlive) {
              damageEnemy(p.target, p.damage, { sparks: true, sparkColors: [0xffe3a0, 0xd7be8c], sparkCount: 4 });
            }
            spawnSparksAt(p.targetPos.x, p.targetPos.y, p.targetPos.z, [0xffe4b4, 0xd9c49b], 4, 2.8, 1.2);
          } else {
            spawnFrostBurst(p.targetPos.x, p.targetPos.y, p.targetPos.z,
              1.75 + (p.tower.level - 1) * 0.18, p.damage, 2.3 + p.tower.level * 0.22, p.tower);
          }
          removeProjectile(i);
          continue;
        }
        projectileDir.copy(projectileTmp).normalize();
        p.mesh.position.addScaledVector(projectileDir, Math.min(p.speed * dt, dist));
        p.mesh.quaternion.setFromUnitVectors(forwardVec, projectileDir);
        if (p.kind === 'frost') {
          p.spin += dt * 12;
          p.mesh.rotation.z += p.spin * dt;
          p.trailTimer -= dt;
          if (p.trailTimer <= 0) {
            p.trailTimer = 0.055;
            spawnSparksAt(p.mesh.position.x, p.mesh.position.y, p.mesh.position.z, [0x9feeff, 0xe2ffff], 1, 0.9, 0.4);
          }
        }
      } else if (p.kind === 'cannon') {
        p.age += dt;
        p.vel.y -= 25 * dt;
        p.mesh.position.addScaledVector(p.vel, dt);
        p.mesh.rotation.x += dt * 3.8;
        p.mesh.rotation.z += dt * 2.2;
        p.trailTimer -= dt;
        if (p.trailTimer <= 0) {
          p.trailTimer = 0.055;
          spawnSmokeAt(p.mesh.position.x, p.mesh.position.y, p.mesh.position.z, 0.26, 0.8, 0x8b877c, 0.25);
          if (Math.random() < 0.5) spawnSparksAt(p.mesh.position.x, p.mesh.position.y, p.mesh.position.z, [0xffa446, 0xffcf70], 1, 0.5, 0.4);
        }
        if (p.age >= p.flight || p.mesh.position.y < 0.4) {
          explodeCannonball(p);
          removeProjectile(i);
        }
      }
    }
    for (let i = zaps.length - 1; i >= 0; i--) {
      const z = zaps[i];
      z.life -= dt;
      if (z.life <= 0) {
        scene.remove(z.mesh);
        z.mesh.geometry.dispose();
        z.mat.dispose();
        zaps.splice(i, 1);
      } else {
        z.mat.opacity = clamp(z.life / z.maxLife, 0, 1);
        z.mesh.scale.setScalar(0.98 + Math.random() * 0.05);
      }
    }
  }

  function updateTowers(dt) {
    const canFire = state.phase === 'combat';
    for (let i = 0; i < towers.length; i++) {
      const t = towers[i];
      t.animT += dt;
      if (t.spawnAnim < 1) {
        t.spawnAnim = Math.min(1, t.spawnAnim + dt * 2.3);
        const e = 1 - Math.pow(1 - t.spawnAnim, 3);
        t.group.scale.setScalar(0.04 + e * 0.96);
        t.group.position.y = 0.135 - (1 - e) * 0.8;
      }
      if (t.upgradePulse > 0) {
        t.upgradePulse = Math.max(0, t.upgradePulse - dt * 2.4);
        const p = 1 + Math.sin(t.upgradePulse * Math.PI) * 0.05;
        t.turret.scale.setScalar(p);
      } else {
        t.turret.scale.setScalar(1);
      }
      t.recoilAmt = Math.max(0, t.recoilAmt - dt * 7.5);
      const recoilOffset = t.recoilAmt * (t.type === 'cannon' ? 0.22 : 0.1);
      t.recoil.position.z = -recoilOffset;
      if (t.recoilAmt > 0) t.recoil.position.y = t.recoilAmt * 0.035;
      else t.recoil.position.y = 0;
      const target = canFire ? chooseTarget(t) : null;
      t.target = target;
      if (t.type === 'lightning' || t.type === 'frost') {
        // gentle magical bobbing
        t.turret.rotation.x = Math.sin(t.animT * 1.4) * 0.025;
      }
      if (target) {
        const aim = target.hitPos;
        const desiredYaw = Math.atan2(aim.x - t.group.position.x, aim.z - t.group.position.z);
        let diff = desiredYaw - t.pivot.rotation.y;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        t.pivot.rotation.y += diff * Math.min(1, dt * 8.5);
      } else {
        t.pivot.rotation.y += Math.sin(t.animT * 0.35 + t.gemPhase) * dt * 0.095;
      }
      // gems orbit above the base and pulse softly
      for (let g = 0; g < t.levelGems.length; g++) {
        const gem = t.levelGems[g];
        if (!gem.visible) continue;
        const a = t.animT * 0.85 + t.gemPhase + g * (TAU / 3);
        const r = 1.3 + g * 0.12;
        gem.position.x = Math.cos(a) * r;
        gem.position.z = Math.sin(a) * r;
        gem.position.y = t.def.pivotY - 0.22 + Math.sin(t.animT * 1.7 + g) * 0.11;
        gem.rotation.y += dt * 2.3;
        gem.rotation.x += dt * 0.8;
      }
      if (target) {
        if (t.type === 'flame') {
          if (t.flameDamageTimer <= 0) {
            // fixed tick schedule handled inside emitFlameJet
          }
          t.flameAcc += dt;
          let emitted = 0;
          while (t.flameAcc > 0.055 && emitted < 4) {
            t.flameAcc -= 0.055;
            emitFlameJet(t, target, 0.055);
            emitted++;
          }
          t.flameDamageTimer = Math.max(t.flameDamageTimer, 0.001);
        } else {
          t.cooldown -= dt;
          if (t.cooldown <= 0) fireTower(t, target);
        }
      } else if (t.type === 'flame') {
        t.flameAcc = 0;
        t.flameDamageTimer = 0;
        // idle pilot flame
        t.idleEmitter += dt;
        if (t.idleEmitter > 0.48) {
          t.idleEmitter = 0;
          const m = getMuzzleWorld(t, vecScratchA);
          spawnSparksAt(m.x, m.y, m.z, [0xff9a36, 0xffd15c], 1, 0.6, 0.7);
        }
      }
      if (t.type === 'lightning' && !target) {
        t.idleEmitter += dt;
        if (t.idleEmitter > 1.1) {
          t.idleEmitter = 0;
          const m = getMuzzleWorld(t, vecScratchA);
          spawnSparksAt(m.x, m.y, m.z, [0xb8a3ff, 0xe6dfff], 2, 0.6, 1.1);
        }
      }
    }
  }

  /* -------------------------------------------------------------------------
     The siege director: waves, economy, damage, defeat and rebirth
     ------------------------------------------------------------------------- */
  const gateWorld = new THREE.Vector3();
  castleGroup.updateMatrixWorld(true);
  castleGroup.localToWorld(gateWorld.set(0, 2.3, 5.2));

  function compactEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
      if (!enemies[i].alive) enemies.splice(i, 1);
    }
  }

  function retireEnemy(enemy) {
    if (!enemy || !enemy.alive) return;
    enemy.alive = false;
    if (enemy.group.parent) scene.remove(enemy.group);
    enemy.material.dispose();
  }

  function leakEnemy(enemy) {
    if (!enemy.alive) return;
    const p = enemy.group.position;
    spawnDebrisAt(p.x, p.y + 0.7, p.z, enemy.def.palette, 16, 1.1);
    spawnSparksAt(p.x, p.y + 0.8, p.z, [0xff6f4d, 0xffb072, 0x7f2a1e], 16, 5.2, 3.1);
    retireEnemy(enemy);
    damageCastle(enemy.def.leak, enemy);
  }

  function damageCastle(amount, source) {
    if (state.phase !== 'combat' && state.phase !== 'intermission') return;
    state.castleHP = Math.max(0, state.castleHP - amount);
    state.castleFlash = 1;
    castleMat.emissive.setHex(0x5b160d);
    castleMat.emissiveIntensity = 1.25;
    addCameraShake(0.24);
    spawnDebrisAt(gateWorld.x, gateWorld.y + 0.4, gateWorld.z,
      [0x77746a, 0x5a5143, 0x884234, 0xb96945], 22, 1.2);
    spawnSparksAt(gateWorld.x, gateWorld.y + 1.0, gateWorld.z,
      [0xff9a52, 0xffd08a, 0xffffff], 22, 5.7, 3.0);
    spawnSmokeAt(gateWorld.x, gateWorld.y + 1.6, gateWorld.z, 1.6, 2.8, 0x5e574f, 1.8);
    createExplosion(gateWorld.x, gateWorld.y + 0.8, gateWorld.z, 0xff7b45, 1.0, 0.5);
    flashHUDHit();
    updateHUD(true);
    if (state.castleHP <= 0) triggerEnd(false);
  }

  function updateEnemies(dt, allowMovement) {
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      if (allowMovement && state.phase === 'combat') {
        e.progress += enemySpeed(e) * dt;
        if (e.progress >= pathLength) {
          leakEnemy(e);
          continue;
        }
      }
      updateEnemyVisual(e, dt);
    }
    compactEnemies();
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function composeWave(wave) {
    const list = [];
    const runners = 10 + wave * 2;
    const brutes = wave >= 2 ? 1 + Math.floor((wave - 1) * 0.8) : 0;
    const flyers = wave >= 2 ? 1 + Math.floor((wave - 2) * 0.9) : 0;
    for (let i = 0; i < runners; i++) list.push('runner');
    for (let i = 0; i < brutes; i++) list.push('brute');
    for (let i = 0; i < flyers; i++) list.push('flyer');
    shuffleArray(list);
    let bossCount = 0;
    if (wave === 4 || wave === 7) bossCount = 1;
    if (wave === 10) bossCount = 2;
    for (let b = 0; b < bossCount; b++) {
      const at = Math.floor(list.length * (0.58 + b * 0.22));
      list.splice(at, 0, 'boss');
    }
    return list;
  }

  function spawnWaveEnemy(type) {
    const spawn = spawnEnemy(type, 0, { effect: true });
    const portalPos = portalGroup.position;
    spawnSparksAt(portalPos.x, 2.0, portalPos.z,
      type === 'boss' ? [0xff8059, 0xffd46c, 0xe7b1ff] : [0xb97bff, 0x8250e4, 0xe7c9ff],
      type === 'boss' ? 28 : 8, type === 'boss' ? 6 : 3, type === 'boss' ? 3 : 1);
    if (type === 'boss') {
      createExplosion(portalPos.x, 2.2, portalPos.z, 0xff8b5c, 1.4, 0.55);
      addCameraShake(0.18);
      spawnSmokeAt(portalPos.x, 2.2, portalPos.z, 1.2, 2.4, 0x776170, 1.2);
    }
    return spawn;
  }

  function startWave(waveNumber) {
    state.wave = waveNumber;
    state.phase = 'combat';
    state.spawnQueue = composeWave(waveNumber);
    state.spawnTimer = 0.3;
    state.spawnInterval = Math.max(0.32, 0.78 - waveNumber * 0.034);
    state.hudDirty = true;
    updateHUD(true);
  }

  function checkWaveCompletion() {
    if (state.phase !== 'combat') return;
    if (state.spawnQueue.length > 0) return;
    compactEnemies();
    if (enemies.length > 0) return;
    if (state.wave >= MAX_WAVES) {
      triggerEnd(true);
      return;
    }
    state.totalWavesBeaten++;
    const bonus = 40 + state.wave * 13;
    state.gold += bonus;
    state.goldEarned += bonus;
    state.phase = 'intermission';
    state.intermission = 4.4;
    state.builderTimer = Math.min(state.builderTimer, 0.18);
    state.hudDirty = true;
    updateHUD(true);
  }

  function updateWaveSpawning(dt) {
    if (state.phase !== 'combat' || state.spawnQueue.length === 0) return;
    state.spawnTimer -= dt;
    let guard = 0;
    while (state.spawnTimer <= 0 && state.spawnQueue.length > 0 && guard < 2) {
      const type = state.spawnQueue.shift();
      spawnWaveEnemy(type);
      const pause = type === 'boss' ? 1.15 : 0;
      state.spawnTimer += state.spawnInterval + pause;
      guard++;
    }
  }

  function updateIntermission(dt) {
    if (state.phase !== 'intermission') return;
    state.intermission -= dt;
    updateBuilder(dt);
    if (state.intermission <= 0) {
      startWave(state.wave + 1);
    }
  }

  function updateEnding(dt) {
    if (state.phase !== 'victory' && state.phase !== 'defeat') return;
    state.endTimer += dt;
    if (!state.announceHidden && state.endTimer > 4.5) {
      hideAnnouncement();
      state.announceHidden = true;
    }
    if (!state.curtainStarted && state.endTimer > 5.0) {
      state.curtainStarted = true;
      curtainEl.style.transition = 'opacity .9s ease';
      curtainEl.style.opacity = '1';
    }
    if (state.endTimer > 6.05) {
      beginRun(false);
      return;
    }
    state.endFxTimer -= dt;
    if (state.phase === 'defeat') {
      if (state.endFxTimer <= 0) {
        state.endFxTimer = 0.46;
        const anchors = castleDamageAnchors;
        const anchor = anchors[Math.floor(Math.random() * anchors.length)];
        const wp = new THREE.Vector3();
        anchor.getWorldPosition(wp);
        createExplosion(wp.x, wp.y, wp.z, Math.random() < 0.5 ? 0xff7c45 : 0xffb357,
          0.7 + Math.random() * 0.9, 0.55);
        spawnSparksAt(wp.x, wp.y, wp.z, [0xffbb60, 0xff743d, 0xffe3a0], 12, 5, 3.2);
        spawnSmokeAt(wp.x, wp.y, wp.z, 0.35 + Math.random() * 0.4, 1.6, 0x5c5148, 0.9);
        addCameraShake(0.13);
      }
    } else {
      if (state.endFxTimer <= 0) {
        state.endFxTimer = 0.42;
        const fx = rand(-17, 17);
        const fz = rand(-17, 17);
        const fy = rand(9, 18);
        const col = pick([0xffcf68, 0xff7f63, 0x9ee8ff, 0xcfa6ff, 0x9dffb0]);
        createExplosion(castleCenter.x + fx, fy, castleCenter.z + fz, col, 1.2, 0.55);
        spawnSparksAt(castleCenter.x + fx, fy, castleCenter.z + fz,
          [col, 0xffffff, 0xffe2a0], 34, 7.5, 2.5);
        spawnCoinsAt(castleCenter.x + fx, fy - 2, castleCenter.z + fz, 3);
      }
    }
  }

  function triggerEnd(victory) {
    if (state.phase === 'victory' || state.phase === 'defeat') return;
    state.phase = victory ? 'victory' : 'defeat';
    state.endKind = victory ? 'victory' : 'defeat';
    state.endTimer = 0;
    state.endFxTimer = 0.2;
    state.announceHidden = false;
    state.curtainStarted = false;
    state.spawnQueue.length = 0;
    showAnnouncement(victory);
    updateHUD(true);
    if (victory) {
      addCameraShake(0.2);
      createExplosion(castleCenter.x, 7, castleCenter.z, 0xffd777, 2.0, 0.8);
    } else {
      addCameraShake(0.65);
      state.castleFlash = 1.0;
      createExplosion(gateWorld.x, gateWorld.y, gateWorld.z, 0xff6a32, 2.2, 0.8);
      for (let i = 0; i < 5; i++) {
        spawnSmokeAt(castleCenter.x + (Math.random() - 0.5) * 8, 2 + Math.random() * 5,
          castleCenter.z + (Math.random() - 0.5) * 8, 0.55 + Math.random() * 0.5, 2.1, 0x4b4542, 1.1);
      }
    }
  }

  function chooseAutoTowerType() {
    const counts = { archer: 0, frost: 0, flame: 0, cannon: 0, lightning: 0 };
    for (const t of towers) counts[t.type]++;
    if (state.wave >= 4 && counts.lightning < 2) return 'lightning';
    if (state.wave >= 2 && counts.cannon < 2) return 'cannon';
    if (state.wave >= 3 && counts.frost < 2) return 'frost';
    if (state.wave >= 3 && counts.flame < 2) return 'flame';
    if (counts.archer < 3) return 'archer';
    const options = [];
    for (const k of TOWER_TYPE_ORDER) {
      const weight = Math.max(0, 3 - counts[k]);
      for (let i = 0; i < weight; i++) options.push(k);
    }
    return options.length ? pick(options) : pick(TOWER_TYPE_ORDER);
  }

  function chooseAutoPad(freePads) {
    let best = null;
    let bestScore = -Infinity;
    for (const p of freePads) {
      let nearestCoverage = 100;
      for (const t of towers) nearestCoverage = Math.min(nearestCoverage, Math.abs(t.pad.u - p.u) * pathLength);
      let threat = 0;
      for (const e of enemies) {
        if (!e.alive) continue;
        const d = Math.hypot(e.group.position.x - p.x, e.group.position.z - p.z);
        if (d < 13) threat += e.type === 'boss' ? 3 : 1;
      }
      const score = nearestCoverage * 1.7 + threat * 2.3 + p.u * 7 + Math.random() * 2.5;
      if (score > bestScore) { bestScore = score; best = p; }
    }
    return best;
  }

  function chooseAutoUpgrade() {
    let best = null;
    let bestScore = Infinity;
    for (const t of towers) {
      if (t.level >= 4) continue;
      const cost = t.upgradeCost;
      if (!Number.isFinite(cost)) continue;
      const score = t.level * 8 + (1.0 - t.pad.u) * 2.5 + Math.random() * 0.8 + cost * 0.008;
      if (score < bestScore) { bestScore = score; best = t; }
    }
    return best;
  }

  function updateBuilder(dt) {
    if (state.phase !== 'combat' && state.phase !== 'intermission') return;
    state.builderTimer -= dt;
    if (state.builderTimer > 0) return;
    state.builderTimer = 0.82;
    const desiredCrowd = Math.min(pads.length, 5 + Math.ceil(state.wave * 0.68));
    const freePads = pads.filter(p => !p.occupied);
    const reserve = 18;
    if (towers.length < desiredCrowd && freePads.length > 0) {
      let type = chooseAutoTowerType();
      let cost = TOWER_TYPES[type].cost;
      if (state.gold < cost + reserve) {
        const affordable = TOWER_TYPE_ORDER.filter(k => TOWER_TYPES[k].cost + reserve <= state.gold);
        if (affordable.length) {
          type = pick(affordable);
          cost = TOWER_TYPES[type].cost;
        } else {
          type = null;
        }
      }
      if (type) {
        const pad = chooseAutoPad(freePads);
        if (pad) {
          state.gold -= cost;
          state.goldEarned -= cost;
          createTower(type, pad, 1, true);
          state.hudDirty = true;
          updateHUD(true);
          return;
        }
      }
    }
    const upgrade = chooseAutoUpgrade();
    if (upgrade && state.gold >= upgrade.upgradeCost + reserve) {
      state.gold -= upgrade.upgradeCost;
      upgradeTower(upgrade);
      state.hudDirty = true;
      updateHUD(true);
    }
  }

  function placeStartingTowers() {
    const specs = [
      { u: 0.10, type: 'archer' },
      { u: 0.27, type: 'flame' },
      { u: 0.44, type: 'cannon' },
      { u: 0.61, type: 'frost' },
      { u: 0.79, type: 'lightning' }
    ];
    const chosen = [];
    for (const spec of specs) {
      let best = null;
      let bestD = Infinity;
      for (const pad of pads) {
        if (pad.occupied) continue;
        const d = Math.abs(pad.u - spec.u);
        if (d < bestD) { bestD = d; best = pad; }
      }
      if (best) {
        createTower(spec.type, best, 1, false);
        chosen.push({ pad: best, tower: towers[towers.length - 1] });
      }
    }
    chosen.sort((a, b) => a.pad.u - b.pad.u);
    return chosen;
  }

  function spawnInitialVanguard(startingTowers) {
    const starters = startingTowers.length ? startingTowers : [];
    if (!starters.length) return;
    const vanguard = [
      { type: 'runner', index: 0, delta: 0.012, hpMul: 1 },
      { type: 'runner', index: 0, delta: 0.05, hpMul: 1 },
      { type: 'brute', index: 1, delta: 0.02, hpMul: 1 },
      { type: 'flyer', index: 2, delta: 0.025, hpMul: 1 },
      { type: 'boss', index: 2, delta: 0.062, hpMul: 0.42 },
      { type: 'runner', index: 3, delta: 0.02, hpMul: 1 },
      { type: 'brute', index: 4, delta: 0.02, hpMul: 1 },
      { type: 'runner', index: 4, delta: 0.055, hpMul: 1 }
    ];
    for (let i = 0; i < vanguard.length; i++) {
      const v = vanguard[i];
      const st = starters[v.index % starters.length];
      const progress = clamp(st.pad.u + v.delta + Math.random() * 0.018, 0.01, 0.93) * pathLength;
      const enemy = spawnEnemy(v.type, progress, { hpMul: v.hpMul, effect: false });
      if (i % 2 === 0) spawnSmokeAt(enemy.group.position.x, enemy.group.position.y + 0.35, enemy.group.position.z, 0.4, 1.6, 0x8d8876, 0.55);
    }
  }

  function clearRunEntities() {
    for (const e of enemies) {
      if (e.group.parent) scene.remove(e.group);
      e.material.dispose();
    }
    enemies.length = 0;
    for (const p of projectiles) {
      if (p.mesh.parent) scene.remove(p.mesh);
    }
    projectiles.length = 0;
    for (const z of zaps) {
      if (z.mesh.parent) scene.remove(z.mesh);
      z.mesh.geometry.dispose();
      z.mat.dispose();
    }
    zaps.length = 0;
    for (const fx of effects) {
      scene.remove(fx.group);
      fx.sphereMat.dispose();
      fx.ringMat.dispose();
    }
    effects.length = 0;
    for (const t of towers) {
      scene.remove(t.group);
    }
    towers.length = 0;
    for (const p of pads) {
      p.occupied = false;
      p.tower = null;
    }
    debris.clear();
    sparks.clear();
    smoke.clear();
    coins.clear();
    barOutline.count = 0;
    barBack.count = 0;
    barFill.count = 0;
    state.spawnQueue.length = 0;
    state.spawnTimer = 0;
    state.castleFlash = 0;
    castleMat.emissiveIntensity = 0;
    castleMat.emissive.setHex(0x000000);
    hudEl.classList.remove('hit-castle', 'low-castle');
    hideAnnouncement();
  }

  function updateCameraDirectorAfterReset() {
    if (typeof resetCameraDirector === 'function') resetCameraDirector();
  }

  function beginRun(isInitial) {
    clearRunEntities();
    state.phase = 'combat';
    state.time = 0;
    state.dayClock = 0;
    state.wave = 1;
    state.gold = 150;
    state.goldEarned = 0;
    state.castleHP = state.castleMax;
    state.kills = 0;
    state.spawnQueue = [];
    state.spawnTimer = 0.72;
    state.intermission = 0;
    state.endTimer = 0;
    state.endKind = '';
    state.endFxTimer = 0;
    state.announceHidden = false;
    state.curtainStarted = false;
    state.builderTimer = 0.95;
    state.castleFlash = 0;
    if (!isInitial) state.runNumber++;
    const starting = placeStartingTowers();
    state.wave = 1;
    state.spawnQueue = composeWave(1);
    state.spawnInterval = Math.max(0.32, 0.78 - 0.034);
    spawnInitialVanguard(starting);
    // Start the simulation mid-battle so the first rendered frame already has
    // arrows in the air, damaged health bars and coins on the ground.
    const warmupSteps = isInitial ? 84 : 66;
    for (let i = 0; i < warmupSteps; i++) {
      const dt = 1 / 60;
      state.time += dt;
      updateWaveSpawning(dt);
      updateEnemies(dt, true);
      updateTowers(dt);
      updateProjectiles(dt);
      updateEffects(dt);
      debris.update(dt);
      sparks.update(dt);
      smoke.update(dt);
      coins.update(dt);
    }
    compactEnemies();
    state.phase = 'combat';
    updateHUD(true);
    updateCameraDirectorAfterReset();
    if (!isInitial) {
      curtainEl.style.transition = 'none';
      curtainEl.style.opacity = '1';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          curtainEl.style.transition = 'opacity 1.1s ease';
          curtainEl.style.opacity = '0';
        });
      });
    } else {
      curtainEl.style.transition = 'none';
      curtainEl.style.opacity = '0';
    }
  }

  /* -------------------------------------------------------------------------
     HUD & announcements
     ------------------------------------------------------------------------- */
  const hudEl = document.getElementById('hud');
  const waveValueEl = document.getElementById('waveValue');
  const goldValueEl = document.getElementById('goldValue');
  const hpValueEl = document.getElementById('hpValue');
  const hpFillEl = document.getElementById('hpFill');
  const killsValueEl = document.getElementById('killsValue');
  const hudLiveEl = document.getElementById('hudLive');
  const wavePipsEl = document.getElementById('wavePips');
  const announceEl = document.getElementById('announce');
  const announceKicker = announceEl.querySelector('.ann-kicker');
  const announceTitle = announceEl.querySelector('.ann-title');
  const announceSub = announceEl.querySelector('.ann-sub');
  const curtainEl = document.getElementById('curtain');
  const pips = [];
  for (let i = 0; i < MAX_WAVES; i++) {
    const pip = document.createElement('i');
    if (i === 3 || i === 6 || i === 9) pip.classList.add('boss');
    wavePipsEl.appendChild(pip);
    pips.push(pip);
  }
  const hudCache = { wave: -1, gold: -1, hp: -1, kills: -1, phase: '', lit: -1, pipPhase: '' };
  let lastGoldPulse = -1000;
  let hudHitTimeout = null;

  function flashHUDHit() {
    hudEl.classList.remove('hit-castle');
    void hudEl.offsetWidth;
    hudEl.classList.add('hit-castle');
    clearTimeout(hudHitTimeout);
    hudHitTimeout = setTimeout(() => hudEl.classList.remove('hit-castle'), 300);
  }

  function updateHUD(force = false) {
    const goldInt = Math.max(0, Math.floor(state.gold));
    const hpInt = Math.max(0, Math.ceil(state.castleHP));
    if (force || state.wave !== hudCache.wave) {
      hudCache.wave = state.wave;
      waveValueEl.textContent = String(state.wave).padStart(2, '0');
    }
    if (force || goldInt !== hudCache.gold) {
      if (!force && goldInt > hudCache.gold && performance.now() - lastGoldPulse > 380) {
        lastGoldPulse = performance.now();
        const goldWrap = goldValueEl.parentElement;
        goldWrap.classList.remove('hud-pulse-gold');
        void goldWrap.offsetWidth;
        goldWrap.classList.add('hud-pulse-gold');
      }
      goldValueEl.textContent = goldInt;
      hudCache.gold = goldInt;
    }
    if (force || hpInt !== hudCache.hp) {
      hudCache.hp = hpInt;
      hpValueEl.textContent = hpInt;
      hpFillEl.style.width = `${clamp(hpInt / state.castleMax * 100, 0, 100)}%`;
      hudEl.classList.toggle('low-castle', hpInt <= 38);
    }
    if (force || state.kills !== hudCache.kills) {
      hudCache.kills = state.kills;
      killsValueEl.textContent = state.kills;
    }
    let liveText = 'LIVE';
    if (state.phase === 'intermission') liveText = 'REGROUP';
    else if (state.phase === 'victory') liveText = 'VICTORY';
    else if (state.phase === 'defeat') liveText = 'FALLEN';
    if (force || liveText !== hudCache.phase) {
      hudCache.phase = liveText;
      hudLiveEl.textContent = liveText;
    }
    const lit = state.phase === 'victory' ? MAX_WAVES : state.wave;
    if (force || lit !== hudCache.lit || state.phase !== hudCache.pipPhase) {
      hudCache.lit = lit;
      hudCache.pipPhase = state.phase;
      for (let i = 0; i < pips.length; i++) pips[i].classList.toggle('on', i < lit);
    }
  }

  function showAnnouncement(victory) {
    announceEl.classList.remove('show');
    announceEl.classList.toggle('defeat', !victory);
    announceKicker.textContent = victory ? 'The last wave is broken' : 'The gate is lost';
    announceTitle.textContent = victory ? 'The Bastion Stands' : 'The Bastion Falls';
    announceSub.textContent = victory ? 'the horde is scattered — a new siege begins' : 'the horde sweeps through — the realm rebuilds itself';
    void announceEl.offsetWidth;
    announceEl.classList.add('show');
  }

  function hideAnnouncement() {
    announceEl.classList.remove('show');
  }

  /* -------------------------------------------------------------------------
     Living world atmosphere
     ------------------------------------------------------------------------- */
  let visualClock = 0;
  let darkness = 0;
  let castleFxTimer = 0;
  const worldTmpA = new THREE.Vector3();
  const worldTmpB = new THREE.Vector3();

  function updateEnvironment(dt) {
    // water level and foam
    waterMesh.position.y = Math.sin(visualClock * 0.75) * 0.012;
    for (let i = 0; i < foamItems.length; i++) {
      const it = foamItems[i];
      it.x += it.speed * dt * 1.4;
      if (it.x > 33.5) it.x = -33.5;
      const z = riverZ(it.x) + it.lat + Math.sin(visualClock * 0.9 + it.phase) * 0.16;
      const visible = insideIsland(it.x, z, 0.985);
      dummy.position.set(it.x, -0.33 + Math.sin(visualClock * 1.4 + it.phase) * 0.025, z);
      dummy.rotation.set(0, Math.sin(visualClock * 0.5 + it.phase) * 0.5, 0);
      dummy.scale.set(visible ? it.size : 0.0001, visible ? 0.045 : 0.0001, visible ? it.size * 0.35 : 0.0001);
      dummy.updateMatrix();
      foamMesh.setMatrixAt(i, dummy.matrix);
    }
    foamMesh.instanceMatrix.needsUpdate = true;

    // clouds drift in long, lazy currents
    for (let i = 0; i < cloudRecords.length; i++) {
      const c = cloudRecords[i];
      c.x += c.speed * dt;
      if (c.x > 220) c.x = -220;
      const factor = c.far ? 0.29 : (c.below ? 0.26 : 0.25);
      let s = c.scale * factor;
      const camDist = Math.hypot(c.x - camera.position.x,
        c.y + Math.sin(visualClock * 0.16 + c.phase) * 0.5 - camera.position.y,
        c.z - camera.position.z);
      s *= smoothstep(s * 7 + 8, s * 7 + 28, camDist);
      dummy.position.set(c.x, c.y + Math.sin(visualClock * 0.16 + c.phase) * 0.5, c.z);
      dummy.rotation.set(0, Math.sin(visualClock * 0.06 + c.phase) * 0.08, 0);
      dummy.scale.set(s, s * 0.68, s);
      dummy.updateMatrix();
      cloudMesh.setMatrixAt(i, dummy.matrix);
    }
    cloudMesh.instanceMatrix.needsUpdate = true;

    // portal shimmer
    if (portalMaterial) portalMaterial.uniforms.uTime.value = visualClock;
    for (const b of movingBits) {
      if (b.kind === 'portalMotes') {
        b.mesh.rotation.y = visualClock * 0.45;
        b.mesh.rotation.x = Math.sin(visualClock * 0.3) * 0.12;
      } else if (b.kind === 'pennant') {
        b.mesh.rotation.y = 0.2 + Math.sin(visualClock * 1.7) * 0.08;
      }
    }
    for (let i = 0; i < flags.length; i++) {
      const f = flags[i];
      f.group.rotation.y = Math.sin(visualClock * 2.1 + f.phase) * 0.18;
      f.group.scale.setScalar(f.baseScale * (1 + Math.sin(visualClock * 2.8 + f.phase) * 0.035));
      f.group.position.y = f.baseY + Math.sin(visualClock * 1.45 + f.phase) * 0.035;
    }

    // fireflies
    if (fireflies.material.opacity > 0.005) {
      const pos = fireflies.geometry.attributes.position;
      if (!fireflies.userData.base) fireflies.userData.base = new Float32Array(pos.array);
      const base = fireflies.userData.base;
      for (let i = 0; i < pos.count; i++) {
        pos.array[i * 3] = base[i * 3] + Math.sin(visualClock * 0.55 + i * 1.7) * 0.45;
        pos.array[i * 3 + 1] = base[i * 3 + 1] + Math.sin(visualClock * 0.9 + i * 2.2) * 0.28;
        pos.array[i * 3 + 2] = base[i * 3 + 2] + Math.cos(visualClock * 0.47 + i * 1.1) * 0.45;
      }
      pos.needsUpdate = true;
    }

    // open flames
    for (let i = 0; i < envFlames.length; i++) {
      const f = envFlames[i];
      f.acc += dt;
      const interval = f.scale > 1.1 ? 0.045 : 0.115;
      let guard = 0;
      while (f.acc > interval && guard < 2) {
        f.acc -= interval;
        guard++;
        f.node.getWorldPosition(worldTmpA);
        spawnSparksAt(worldTmpA.x, worldTmpA.y, worldTmpA.z,
          [f.color, 0xffd373, 0xff7f32], f.scale > 1.1 ? 2 : 1,
          (0.7 + Math.random() * 0.8) * f.scale, (0.5 + Math.random() * 0.9) * f.scale);
        if (f.scale > 1.1 && Math.random() < 0.45) {
          spawnSmokeAt(worldTmpA.x, worldTmpA.y + 0.4, worldTmpA.z, 0.42 * f.scale, 2.1, 0x57514b, 0.35);
        }
      }
    }
    for (let i = 0; i < envSmokes.length; i++) {
      const s = envSmokes[i];
      s.acc += dt;
      const interval = s.kind === 'campfire' ? 1.1 : 1.8;
      if (s.acc > interval) {
        s.acc = 0;
        s.node.getWorldPosition(worldTmpB);
        spawnSmokeAt(worldTmpB.x, worldTmpB.y, worldTmpB.z,
          (s.kind === 'campfire' ? 0.75 : 0.42) * (s.scale || 1),
          s.kind === 'campfire' ? 2.6 : 2.5, 0x9b9489, 0.3);
      }
    }

    // the wounded castle breathes smoke and sparks
    if (state.castleHP < 58) {
      castleFxTimer -= dt;
      if (castleFxTimer <= 0) {
        castleFxTimer = state.castleHP < 25 ? 0.22 : 0.65;
        const anchor = castleDamageAnchors[Math.floor(Math.random() * castleDamageAnchors.length)];
        anchor.getWorldPosition(worldTmpA);
        spawnSmokeAt(worldTmpA.x, worldTmpA.y, worldTmpA.z, 0.8 + Math.random() * 0.8, 2.3, 0x625a52, 0.8);
        if (state.castleHP < 25) {
          spawnSparksAt(worldTmpA.x, worldTmpA.y, worldTmpA.z, [0xff8a42, 0xffcb67, 0xe7522d], 5, 2.0, 1.6);
        }
      }
    }
    if (state.castleFlash > 0) {
      state.castleFlash = Math.max(0, state.castleFlash - dt * 2.6);
      castleMat.emissiveIntensity = state.castleFlash * 1.4;
      if (state.castleFlash <= 0) {
        castleMat.emissiveIntensity = 0;
        castleMat.emissive.setHex(0x000000);
      }
    }
  }

  /* -------------------------------------------------------------------------
     Light, colour and the slow turn from day into dusk
     ------------------------------------------------------------------------- */
  const DAY_LENGTH = 260;
  const skyDayTop = new THREE.Color(0x3f7fa9);
  const skyDayHorizon = new THREE.Color(0xa9cede);
  const skySunsetTop = new THREE.Color(0x383360);
  const skySunsetHorizon = new THREE.Color(0xff9060);
  const skyNightTop = new THREE.Color(0x061225);
  const skyNightHorizon = new THREE.Color(0x1b2a43);
  const skyTopScratch = new THREE.Color();
  const skyHorizonScratch = new THREE.Color();
  const skyFogScratch = new THREE.Color();
  const sunWarmColor = new THREE.Color(0xffa867);
  const sunNoonColor = new THREE.Color(0xfff1d0);
  const whiteColor = new THREE.Color(0xe8f4ff);
  const cloudNightTint = new THREE.Color(0x40536b);
  const skySunDir = new THREE.Vector3();
  const skyMoonDir = new THREE.Vector3();
  const moonPos = new THREE.Vector3();

  function updateSky(dt) {
    const dayPhase = (0.145 + state.dayClock / DAY_LENGTH) % 1;
    const angle = dayPhase * TAU;
    skySunDir.set(Math.cos(angle), Math.sin(angle), 0.34).normalize();
    const elev = skySunDir.y;
    const day = smoothstep(-0.12, 0.32, elev);
    const evening = Math.exp(-Math.pow(elev / 0.19, 2));
    const night = 1 - smoothstep(-0.27, 0.03, elev);
    darkness = 1 - smoothstep(-0.07, 0.23, elev);

    skyTopScratch.copy(skyNightTop).lerp(skyDayTop, day);
    skyTopScratch.lerp(skySunsetTop, evening * 0.52);
    skyHorizonScratch.copy(skyNightHorizon).lerp(skyDayHorizon, day);
    skyHorizonScratch.lerp(skySunsetHorizon, evening * 0.84);
    skyFogScratch.copy(skyHorizonScratch).lerp(skyTopScratch, 0.24);

    skyUniforms.topColor.value.copy(skyTopScratch);
    skyUniforms.bottomColor.value.copy(skyHorizonScratch);
    skyUniforms.horizonColor.value.copy(skyHorizonScratch);
    skyUniforms.sunDir.value.copy(skySunDir);
    skyUniforms.sunColor.value.copy(sunWarmColor).lerp(sunNoonColor, smoothstep(0.08, 0.5, elev));
    skyUniforms.glowStrength.value = 0.23 + evening * 0.26;
    scene.fog.color.copy(skyFogScratch);
    scene.fog.density = 0.00155 + night * 0.00065;
    scene.background.copy(skyHorizonScratch);

    const sunPower = smoothstep(-0.055, 0.11, elev);
    sunLight.color.copy(sunWarmColor).lerp(sunNoonColor, smoothstep(0.05, 0.55, elev));
    sunLight.intensity = sunPower * (1.05 + smoothstep(0.08, 0.58, elev) * 1.7);
    sunLight.position.copy(skySunDir).multiplyScalar(110);
    if (sunLight.position.y < 34) sunLight.position.y = 34;
    sunLight.target.position.set(0, 0, 0);
    sunLight.target.updateMatrixWorld();
    hemi.color.copy(skyHorizonScratch).lerp(whiteColor, 0.28);
    hemi.groundColor.setHex(0x51412e);
    hemi.intensity = 0.56 + day * 0.6 + evening * 0.28;
    ambient.color.copy(whiteColor).lerp(skyHorizonScratch, 0.35 + night * 0.18);
    ambient.intensity = 0.27 + day * 0.08 + evening * 0.08;
    moonLight.intensity = night * 1.08;
    skyMoonDir.set(-skySunDir.x, -skySunDir.y, -skySunDir.z).normalize();
    moonLight.position.copy(skyMoonDir).multiplyScalar(110);
    moonLight.color.setHex(0x93b5f1);

    sunSprite.position.copy(skySunDir).multiplyScalar(300);
    sunSprite.material.color.copy(sunWarmColor).lerp(sunNoonColor, smoothstep(0.08, 0.5, elev));
    sunSprite.material.opacity = smoothstep(-0.035, 0.055, elev) * 0.95;
    sunSprite.visible = sunSprite.material.opacity > 0.01;
    moonPos.copy(skyMoonDir).multiplyScalar(320);
    moonSprite.position.copy(moonPos);
    moonSprite.material.opacity = night * 0.92;
    moonSprite.visible = moonSprite.material.opacity > 0.01;
    starMat.opacity = night * 0.94;
    stars.rotation.y += dt * 0.0015;
    fireflies.material.opacity = clamp(night * 0.95 + evening * 0.12, 0, 1);
    cloudMat.color.copy(whiteColor).lerp(skyHorizonScratch, 0.16 + evening * 0.4);
    cloudMat.color.lerp(cloudNightTint, night * 0.82);
    cloudMat.opacity = 0.56 - night * 0.2;
    renderer.toneMappingExposure = 1.07 + night * 0.09 + evening * 0.035;

    for (let i = 0; i < nightLights.length; i++) {
      const n = nightLights[i];
      const flicker = 0.88 + Math.sin(visualClock * (7.1 + i * 1.9) + i * 3.2) * 0.08 + Math.sin(visualClock * 3.2 + i) * 0.04;
      n.light.intensity = n.base * (0.06 + darkness * 0.94) * flicker;
    }
  }

  /* -------------------------------------------------------------------------
     The camera director: wide, slow circles then sudden close-up battles
     ------------------------------------------------------------------------- */
  let screenFit = 1;
  let battleFit = 1;
  const director = {
    mode: 'orbit',
    timer: 0,
    duration: 8.8,
    orbitAngle: 0.64,
    battleAngle: 0,
    battleDist: 20,
    battleHeight: 11,
    shotIndex: 0,
    snap: true,
    clusterTimer: 0,
    focus: new THREE.Vector3(0, 1.3, 0),
    tangent: new THREE.Vector3(0, 0, 1)
  };
  const camDesired = new THREE.Vector3();
  const camFocusDesired = new THREE.Vector3();
  const camFocus = new THREE.Vector3(0, 1, 0);
  const clusterCenter = new THREE.Vector3();
  const clusterTangent = new THREE.Vector3(0, 0, 1);

  function updateScreenFit() {
    const aspect = window.innerWidth / Math.max(1, window.innerHeight);
    screenFit = clamp(1.0 / aspect, 0.92, 1.6);
    battleFit = clamp(0.82 / aspect, 1, 1.7);
  }

  function resetCameraDirector() {
    director.mode = 'orbit';
    director.timer = 0;
    director.duration = 8.8;
    director.orbitAngle = 0.64;
    director.shotIndex = 0;
    director.snap = true;
    director.clusterTimer = 0;
    director.focus.set(0, 1.3, 0);
  }

  function findThickFight() {
    let best = null;
    let bestScore = -1;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      let score = e.type === 'boss' ? 9 : (e.type === 'brute' ? 2.5 : 1);
      for (let j = 0; j < enemies.length; j++) {
        if (i === j) continue;
        const o = enemies[j];
        if (!o.alive) continue;
        const dx = e.group.position.x - o.group.position.x;
        const dz = e.group.position.z - o.group.position.z;
        if (dx * dx + dz * dz < 44) score += o.type === 'boss' ? 5 : (o.type === 'brute' ? 1.4 : 1);
      }
      score += (e.progress / pathLength) * 1.4;
      if (score > bestScore) { bestScore = score; best = e; }
    }
    if (!best) return null;
    let count = 0;
    let cx = 0, cy = 0, cz = 0;
    let avgProgress = 0;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const dx = e.group.position.x - best.group.position.x;
      const dz = e.group.position.z - best.group.position.z;
      if (dx * dx + dz * dz > 85) continue;
      const weight = e.type === 'boss' ? 2.2 : (e.type === 'brute' ? 1.35 : 1);
      cx += e.group.position.x * weight;
      cy += (e.group.position.y + e.def.aimY * 0.55) * weight;
      cz += e.group.position.z * weight;
      avgProgress += e.progress * weight;
      count += weight;
    }
    cx /= count; cy /= count; cz /= count;
    avgProgress /= count;
    // Look toward a nearby tower so we get the whole duel in frame.
    let nearestTower = null;
    let towerDist = 16 * 16;
    for (let i = 0; i < towers.length; i++) {
      const t = towers[i];
      const dx = t.group.position.x - cx;
      const dz = t.group.position.z - cz;
      const d = dx * dx + dz * dz;
      if (d < towerDist) { towerDist = d; nearestTower = t; }
    }
    if (nearestTower) {
      cx = cx * 0.82 + nearestTower.group.position.x * 0.18;
      cz = cz * 0.82 + nearestTower.group.position.z * 0.18;
    }
    const tangent = pathCurve.getTangentAt(clamp(avgProgress / pathLength, 0, 1), clusterTangent);
    clusterCenter.set(cx, Math.max(1.0, Math.min(4.2, cy * 0.6 + 0.75)), cz);
    return { center: clusterCenter, tangent };
  }

  function battleCameraScore(angle, dist, height, focus, baseAngle) {
    const cx = focus.x + Math.cos(angle) * dist;
    const cz = focus.z + Math.sin(angle) * dist;
    const cy = focus.y + height;
    let score = (1 - Math.abs(Math.sin(angle - baseAngle))) * 2.2;
    const dCastle = Math.hypot(cx - castleCenter.x, cz - castleCenter.z);
    if (dCastle < 13) score += 30;
    let blocked = 0;
    for (let s = 1; s <= 8; s++) {
      const t = s / 8;
      const sx = lerp(focus.x, cx, t);
      const sy = lerp(focus.y + 1.2, cy, t);
      const sz = lerp(focus.z, cz, t);
      const dc = Math.hypot(sx - castleCenter.x, sz - castleCenter.z);
      if (dc < 9 && sy < 13.5) blocked += 5;
      for (let i = 0; i < treeSpots.length; i++) {
        const tr = treeSpots[i];
        if (Math.abs(tr.x - sx) > 5.5 || Math.abs(tr.z - sz) > 5.5) continue;
        const rr = 2.2 * tr.scale;
        const dx = sx - tr.x;
        const dz = sz - tr.z;
        if (dx * dx + dz * dz < rr * rr && sy < tr.h + 7.2 * tr.scale && sy > tr.h + 0.25) {
          blocked += 1;
        }
      }
    }
    if (blocked) score += blocked * 7.5;
    // Prefer the lower of two possible camera rigs when both are unobstructed.
    if (height > 22) score += (height - 22) * 0.5;
    score += Math.random() * 0.6;
    return score;
  }

  function pickBattleCamera(fight) {
    const baseAngle = Math.atan2(fight.tangent.x, fight.tangent.z);
    const baseDist = (21 + Math.random() * 7) * battleFit;
    const baseHeight = (13 + Math.random() * 5) * (0.65 + battleFit * 0.27);
    let best = { angle: baseAngle + 1.3, dist: baseDist, height: baseHeight, score: Infinity };
    const steps = 16;
    for (let i = 0; i < steps; i++) {
      const angle = (i / steps) * TAU;
      for (let hI = 0; hI < 2; hI++) {
        const dist = baseDist * (hI === 0 ? 1.0 : 0.87);
        const height = baseHeight * (hI === 0 ? 1.0 : 1.28);
        const score = battleCameraScore(angle, dist, height, fight.center, baseAngle);
        if (score < best.score) {
          best = { angle, dist, height, score };
        }
      }
    }
    return best;
  }

  function chooseNextShot() {
    director.shotIndex++;
    director.timer = 0;
    const hasEnemies = enemies.length > 0;
    if (director.mode === 'battle' || !hasEnemies) {
      if (director.mode !== 'orbit') {
        const angle = Math.atan2(camera.position.z, camera.position.x);
        if (Number.isFinite(angle)) director.orbitAngle = angle;
      }
      director.mode = 'orbit';
      director.duration = 8.2 + Math.random() * 2.4;
    } else {
      const fight = findThickFight();
      if (!fight) {
        director.mode = 'orbit';
        director.duration = 8.0;
        return;
      }
      director.mode = 'battle';
      director.duration = 6.2 + Math.random() * 2.2;
      director.focus.copy(fight.center);
      director.tangent.copy(fight.tangent);
      const rig = pickBattleCamera(fight);
      director.battleAngle = rig.angle;
      director.battleDist = rig.dist;
      director.battleHeight = rig.height;
      director.clusterTimer = 0;
    }
  }

  function updateCamera(dt) {
    if (state.phase === 'victory' || state.phase === 'defeat') {
      const t = state.endTimer;
      const victory = state.phase === 'victory';
      const radius = ((victory ? 28 : 19) + Math.min(t, 5) * 1.8) * screenFit;
      const angle = 0.6 + t * (victory ? 0.11 : 0.06);
      const focusY = 4.0;
      camDesired.set(
        castleCenter.x + Math.cos(angle) * radius,
        ((victory ? 21 : 12) + Math.min(t, 5) * 1.2) * screenFit + Math.sin(t * 0.5) * 0.6,
        castleCenter.z + Math.sin(angle) * radius
      );
      camFocusDesired.set(castleCenter.x, focusY, castleCenter.z);
      const blend = 1 - Math.exp(-dt * 1.4);
      camera.position.lerp(camDesired, blend);
      camFocus.lerp(camFocusDesired, 1 - Math.exp(-dt * 2.0));
      if (shakeAmount > 0.001) {
        camera.position.x += Math.sin(visualClock * 73.1) * shakeAmount * 0.6;
        camera.position.y += Math.sin(visualClock * 91.7 + 1.3) * shakeAmount * 0.45;
        camera.position.z += Math.cos(visualClock * 67.3 + 2.1) * shakeAmount * 0.6;
        camFocus.x += Math.sin(visualClock * 41.2) * shakeAmount * 0.15;
        camFocus.y += Math.cos(visualClock * 53.4) * shakeAmount * 0.12;
        shakeAmount *= Math.exp(-dt * 3.5);
      }
      camera.lookAt(camFocus);
      return;
    }

    director.timer += dt;
    if (director.timer > director.duration) chooseNextShot();

    if (director.mode === 'orbit') {
      const radius = 84 * screenFit;
      const elevation = 0.43;
      const horizontal = Math.cos(elevation) * radius;
      const angle = director.orbitAngle + director.timer * 0.055;
      camDesired.set(
        Math.cos(angle) * horizontal,
        Math.sin(elevation) * radius,
        Math.sin(angle) * horizontal
      );
      const driftX = Math.sin(director.timer * 0.13) * 0.8;
      const driftZ = Math.cos(director.timer * 0.1) * 0.8;
      camFocusDesired.set(driftX, 2.2, driftZ);
    } else {
      director.clusterTimer -= dt;
      if (director.clusterTimer <= 0) {
        director.clusterTimer = 0.33;
        const fight = findThickFight();
        if (fight) {
          director.focus.lerp(fight.center, 0.55);
          director.tangent.copy(fight.tangent);
        } else if (state.phase === 'intermission') {
          director.mode = 'orbit';
          director.timer = 0;
          director.duration = 7;
        }
      }
      const angle = director.battleAngle + director.timer * 0.043;
      const dist = director.battleDist;
      camDesired.set(
        director.focus.x + Math.cos(angle) * dist,
        director.focus.y + director.battleHeight,
        director.focus.z + Math.sin(angle) * dist
      );
      const dCastle = Math.hypot(camDesired.x - castleCenter.x, camDesired.z - castleCenter.z);
      if (dCastle < 16 && camDesired.y < 22) {
        const a = Math.atan2(camDesired.z - castleCenter.z, camDesired.x - castleCenter.x);
        camDesired.x = castleCenter.x + Math.cos(a) * 16;
        camDesired.z = castleCenter.z + Math.sin(a) * 16;
      }
      camFocusDesired.copy(director.focus);
      camFocusDesired.y += 1.0;
      camFocusDesired.addScaledVector(director.tangent, 1.35);
    }

    if (director.snap) {
      camera.position.copy(camDesired);
      camFocus.copy(camFocusDesired);
      director.snap = false;
    } else {
      camera.position.lerp(camDesired, 1 - Math.exp(-dt * 1.9));
      camFocus.lerp(camFocusDesired, 1 - Math.exp(-dt * 2.7));
    }
    if (shakeAmount > 0.001) {
      camera.position.x += Math.sin(visualClock * 73.1) * shakeAmount * 0.55;
      camera.position.y += Math.sin(visualClock * 91.7 + 1.3) * shakeAmount * 0.4;
      camera.position.z += Math.cos(visualClock * 67.3 + 2.1) * shakeAmount * 0.55;
      camFocus.x += Math.sin(visualClock * 41.2) * shakeAmount * 0.18;
      camFocus.y += Math.cos(visualClock * 53.4) * shakeAmount * 0.14;
      shakeAmount *= Math.exp(-dt * 3.6);
    }
    camera.lookAt(camFocus);
  }

  /* -------------------------------------------------------------------------
     Window shape / resolution
     ------------------------------------------------------------------------- */
  function onResize() {
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    const aspect = w / h;
    renderer.setPixelRatio(getDPR());
    renderer.setSize(w, h);
    camera.aspect = aspect;
    camera.fov = aspect < 0.9 ? 58 : 52;
    camera.updateProjectionMatrix();
    updateScreenFit();
  }
  window.addEventListener('resize', onResize, { passive: true });

  /* -------------------------------------------------------------------------
     Main frame
     ------------------------------------------------------------------------- */
  function updateFrame(dt) {
    state.time += dt;
    visualClock += dt;
    state.dayClock += dt;
    if (state.phase === 'combat') {
      updateWaveSpawning(dt);
      updateEnemies(dt, true);
      updateTowers(dt);
      updateProjectiles(dt);
      updateBuilder(dt);
      compactEnemies();
      checkWaveCompletion();
    } else if (state.phase === 'intermission') {
      updateIntermission(dt);
      if (state.phase === 'intermission') {
        updateTowers(dt);
        updateProjectiles(dt);
      }
    } else {
      updateEnding(dt);
      if (state.phase === 'victory' || state.phase === 'defeat') {
        updateEnemies(dt, false);
        updateTowers(dt);
        updateProjectiles(dt);
      }
    }
    updateEffects(dt);
    debris.update(dt);
    sparks.update(dt);
    smoke.update(dt);
    coins.update(dt);
    updateEnvironment(dt);
    updateSky(dt);
    updateCamera(dt);
    updateHealthBars();
    updateHUD();
  }

  let lastFrameTime = performance.now();
  function animate(now) {
    requestAnimationFrame(animate);
    let dt = (now - lastFrameTime) / 1000;
    lastFrameTime = now;
    if (!Number.isFinite(dt) || dt <= 0) dt = 1 / 60;
    dt = Math.min(dt, 0.05);
    updateFrame(dt);
    renderer.render(scene, camera);
  }

  /* -------------------------------------------------------------------------
     Start the endless siege
     ------------------------------------------------------------------------- */
  onResize();
  beginRun(true);
  updateSky(1 / 60);
  updateEnvironment(1 / 60);
  updateCamera(1 / 60);
  updateHealthBars();
  updateHUD(true);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);

  // A quiet debug surface for automated smoke-testing. It is never shown,
  // never changes the game without being called, and is not part of the HUD.
  window.__VT = {
    state,
    getEnemies: () => enemies,
    getTowers: () => towers,
    pads,
    pathLength,
    advance(seconds) {
      let left = Math.max(0, Number(seconds) || 0);
      let guard = 0;
      while (left > 0.001 && guard < 30000) {
        const dt = Math.min(1 / 30, left);
        updateFrame(dt);
        left -= dt;
        guard++;
      }
      renderer.render(scene, camera);
      return { wave: state.wave, phase: state.phase, hp: state.castleHP, gold: state.gold, kills: state.kills, enemies: enemies.length, towers: towers.length };
    },
    simulate(seconds) {
      let left = Math.max(0, Number(seconds) || 0);
      let guard = 0;
      while (left > 0.001 && guard < 40000) {
        const dt = Math.min(1 / 30, left);
        updateFrame(dt);
        left -= dt;
        guard++;
      }
      return { wave: state.wave, phase: state.phase, hp: state.castleHP, gold: state.gold, kills: state.kills, enemies: enemies.length, towers: towers.length, dayClock: state.dayClock };
    },
    info() {
      return {
        wave: state.wave, phase: state.phase, hp: state.castleHP, gold: state.gold,
        kills: state.kills, towers: towers.length, pads: pads.length,
        enemies: enemies.map(e => ({ type: e.type, hp: Math.round(e.hp), progress: +(e.progress / pathLength).toFixed(2) })),
        towers2: towers.map(t => ({ type: t.type, level: t.level, u: +t.pad.u.toFixed(2), shots: t.shots })),
        camera: camera.position.toArray().map(v => +v.toFixed(1)),
        render: { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles },
        sky: {
          visible: skyDome.visible, background: scene.background.getHexString(),
          top: skyUniforms.topColor.value.getHexString(),
          horizon: skyUniforms.bottomColor.value.getHexString()
        }
      };
    },
    scene, camera, renderer, skyDome, skyMat, THREE
  };

})();
</script>
</body>
